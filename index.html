function rMarket(){const pc=S.pendingChoice;

/* ---------------- DEAL (private peeks) ---------------- */
function rDeal(){const i=U.peekQueue[U.peekPos];const p=S.players[i];const next=U.peekQueue[U.peekPos+1];

/* ---------------- TABLE ---------------- */
function seatPos(i,n){if(n===2)return [[50,92],[50,8]][i];const a=Math.PI/2+(i/n)*Math.PI*2;return [50+Math.cos(a)*42,50+Math.sin(a)*42];}
function seatHTML(p,i){const n=S.players.length;const [x,y]=seatPos(i,n);
  const turn=S.phase==="betting"&&(U.tray==="bet"||MP())&&i===S.turn&&!(MP()&&S.window);const tier=p.boast?tierOf(p.boast):null;const nch=(S.challenges[i]||[]).length;
  const st=p.out?"Sat out · no ante":p.folded?"Folded":p.allin?"All-in":p.committed>0?`Bet ${p.committed} this round`:p.acted?"Checked":"Waiting";
  const used=CKEYS.filter(k=>p.powerUsed&&p.powerUsed[k]);
  return `<div class="seat ${turn?"turn":""} ${p.folded?"folded":""}" data-seat="${i}" style="left:${x}%;top:${y}%">
    ${portrait(p,44,{dealer:i===S.dealer})}
    <div class="nm">${esc(p.name)}</div><div class="fl num">${fl(p.fl)}${p.escrow?` <span class="dim" style="font-size:11px">+${p.escrow} staked</span>`:""}</div>
    <div class="st">${MP()&&!S.conn[i]?'<b style="color:var(--down)">Away</b> · ':""}${MP()&&i===ME()?"You · ":""}${st}${used.length?` · ${used.map(k=>icon(k)).join("")}`:""}</div>
    ${tier?`<div class="boast">⚑ ${tier.n} or better · ${p.boastStake} fl${nch?` · ${nch} challenge${nch>1?"s":""}`:""}</div>`:""}</div>`;}
function boardHTML(opts){opts=opts||{};const cd=community();let out="";
  for(let j=0;j<5;j++){if(j<cd.length){const roll=(opts.roll&&j>=U.revealFrom)?" rolling":"";const hl=opts.hl===j?" glow":"";
      const pickable=opts.pick&&(!opts.pickOk||opts.pickOk(j));
      out+=die(cd[j],"bone",roll+hl+(pickable?" pickable":""),(roll?`style="animation-delay:${(j-U.revealFrom)*110}ms" `:"")+(pickable?`data-act="pickBoard" data-arg="${j}" tabindex="0"`:""));}
    else out+=opts.slots===false?"":`<span class="slot">${die(0,"back","dimmed")}</span>`;}
  return `<div class="board">${out}</div>`;}
function rTable(){
  if(!MP()&&S.phase==="betting"&&U.tray==="bet"){const p=S.players[S.turn];if(!p||p.folded||p.allin){setTimeout(continueHand,0);}}
  const L=legal();const p=S.players[S.turn];
  const potSub=S.phase==="betting"&&U.tray==="bet"&&S.currentBet>0?`Bet to match ${S.currentBet}`:"";
  const seats=S.players.map((q,i)=>seatHTML(q,i)).join("");
  return `<div class="table-screen">
   <div class="arena">
     <div class="seats-strip">${seats}</div>
     <div class="felt"><div class="street">${STREET_NAMES[S.street]} · hand ${S.handNo}</div>
       ${boardHTML({roll:U.rollPending})}
       <div class="pot">${coinsSVG(S.pot)}<div><b class="num">Pot ${S.pot}</b><span class="sub">${potSub||"&nbsp;"}</span></div></div></div>
   </div>
   ${MP()?mpTrayHTML(L):trayHTML(L,p)}</div>`;}
function trayHTML(L,p){
  if(U.tray==="reveal")return `<div class="tray turn-banner"><div class="who"><div style="flex:1;min-width:200px"><div class="eyebrow">${STREET_NAMES[S.street]}</div><div class="nm" style="font-family:var(--display);font-weight:900;font-size:22px">${REVEAL_LINES[S.street]}</div></div>
      <button class="btn btn-gold" data-act="continue">Continue →</button></div></div>`;
  if(U.tray==="allin"){const pend=allinPending();
    return `<div class="tray turn-banner"><div><div class="eyebrow">${STREET_NAMES[S.street]}</div><div style="font-family:var(--display);font-weight:900;font-size:20px">All-in merchants may spend a commodity</div>
      <p class="soft" style="margin:4px 0 0;font-size:14px">They can't bet any more, but they can still bend the dice once per hand.</p></div>
      <div class="actions">${pend.map(i=>`<button class="btn btn-line" data-act="power" data-arg="${i}">⚒ ${esc(S.players[i].name)}: use a power</button>`).join("")}
      <button class="btn btn-gold" data-act="allinDone">Continue →</button></div></div>`;}
  if(!p||L.fl===undefined)return `<div class="tray"><p class="soft" style="margin:0">Waiting…</p></div>`;
  const allinCall=L.canCall&&L.callAmt<L.toCall;const callLbl=allinCall?`All-in · ${L.callAmt} fl`:`Call ${L.callAmt} fl`;
  const chal=L.boastTargets.map(i=>`<button class="btn btn-line btn-sm" data-act="challenge" data-arg="${i}">Challenge ${esc(S.players[i].name)}</button>`).join("");

        <div class="meta">Chips <b class="num">${fl(p.fl)}</b> · in this round <b class="num">${p.committed}</b>${L.toCall>0?` · to call <b class="num">${L.toCall}</b>`:""}${p.priv.length>2?" · 3 private dice":""}</div></div>
      ${MP()?"":`<button class="btn btn-line peek-btn" data-peek="${S.turn}" aria-label="Hold to see your private dice">${uiIcon("eye").replace("<svg",'<svg width="18" height="18"')} My dice</button>`}</div>
    <div class="actions">
      ${L.canCheck?`<button class="btn btn-line" data-act="check">Check</button>`:""}
      ${L.canCall?`<button class="btn ${allinCall?"btn-wax":"btn-line"} ${U.armed==="call"?"armed":""}" data-act="call">${allinCall&&U.armed==="call"?"Tap again: go all-in":callLbl}</button>`:""}
      ${L.canRaise?`<button class="btn btn-gold" data-act="raise">${S.currentBet>0?"Raise":"Bet"} →</button>`:""}
      ${L.canFold?`<button class="btn btn-wax ${U.armed==="fold"?"armed":""}" data-act="fold">${U.armed==="fold"?"Tap again to fold":"Fold"}</button>`:""}
    </div>
    <div class="minor">
      ${L.canBoast?`<button class="btn btn-line btn-sm" data-act="boast">⚑ Boast</button>`:""}
      ${chal}
      ${L.canAbility?`<button class="btn btn-line btn-sm" data-act="power" data-arg="${S.turn}">⚒ Use a power · ${powersLeft} left</button>`:`<span class="dim it" style="font-size:13px;align-self:center">${p.usedThisHand?"Power used this hand":"No power available now"}</span>`}
      ${L.canPledge?`<button class="btn btn-wax btn-sm" data-act="pledge">Pledge goods at 50%</button>`:""}
    </div></div>`;}

/* ---------------- RESULT ---------------- */
function rResult(){const sh=S._show||{winners:[],pots:[],boasts:[]};
  if(sh.nobody)return `<div class="wrap rise" style="max-width:720px"><div class="ledger" style="display:grid;gap:14px;text-align:center">
    <div class="eyebrow">Hand ${S.handNo}</div><h2 class="h2">Nobody could cover the ante</h2><p class="soft">The dice stay in the cup this hand. Sell goods in the next market to buy back in.</p>
    <div class="row c"><button class="btn btn-gold" data-act="toScore">Tally the ledger →</button></div></div></div>`;
  const names=sh.winners.map(i=>esc(S.players[i].name));
  const head=sh.winners.length>1?`${names.join(" & ")} split the pot`:`${names[0]} takes the pot`;
  const rows=S.players.map((p,i)=>{const win=sh.winners.includes(i);const net=p.fl+(p.escrow||0)-(p.flAtDeal==null?p.fl:p.flAtDeal)-(p.pledged||0);
    let mid;if(p.out)mid=`<span class="dt">Sat out this hand</span>`;
    else if(p.folded)mid=`<span class="dt">Folded</span>`;
    else if(sh.byFold)mid=`<span class="dt">Dice stay hidden. Everyone else folded.</span>`;
    else{const ev=bestOf(p);mid=`<div class="dice">${bestFiveDice(p,ev,"sm")}</div><div><span class="hn">${ev.name}</span> <span class="dt">· ${ev.detail}</span></div>`;}
    return `<div class="srow ${win?"win":""} ${p.folded?"out":""}" data-row="${i}">${portrait(p,46,{crown:win})}
      <div style="min-width:0;display:grid;gap:4px"><span class="nm">${esc(p.name)}</span>${mid}</div>
      <span class="gain num ${net<0?"neg":""}">${net>0?"+":net<0?"−":""}${Math.abs(net)} fl</span></div>`;}).join("");
  const pots=(sh.pots||[]).length>1?sh.pots.map((pt,j)=>`<div class="note gold">${j===0?"Main pot":"Side pot "+j}: ${pt.amount} fl → ${pt.winners.map(w=>esc(S.players[w].name)).join(" & ")}</div>`).join(""):"";
  const boasts=(sh.boasts||[]).map(b=>{const bp=S.players[b.bi];const t=tierOf(b.tier);
    if(!b.chals.length)return `<div class="note">⚑ ${esc(bp.name)} boasted ${t.n}. Nobody challenged. ${b.made?"They made it.":"A bluff that went unpunished."}</div>`;
    const who=b.chals.map(c=>esc(S.players[c.c].name)).join(", ");
    return `<div class="note">⚑ ${esc(bp.name)}'s boast of ${t.n} ${b.made?"<b>held</b>":b.folded?"<b>fell</b> when they folded":"<b>fell short</b>"} (${b.ev.name}). ${b.made?`They win ${b.net} fl from ${who}.`:`${who} collect${b.chals.length>1?"":"s"} ${-b.net} fl.`}</div>`;}).join("");
  const over=gameOverReason();
  return `<div class="wrap rise" style="max-width:860px"><div class="ledger" style="display:grid;gap:14px">
    <div><div class="eyebrow">Hand ${S.handNo} · ${sh.byFold?"Everyone else folded":"Showdown"}</div><h2 class="h2" style="margin-top:4px">${head}</h2>
      <p class="soft" style="margin:4px 0 0">${(sh.pots||[]).reduce((a,p)=>a+p.amount,0)} fl in the pot.</p></div>

    ${S.rollout&&S.reveal<5?`<p class="soft it" style="margin:-4px 0 0;text-align:center;font-size:14px">The unrevealed dice were rolled out to settle boasts. They don't affect the pot.</p>`:""}
    <div class="show">${rows}</div>${pots}${boasts}
    <div class="row c"><button class="btn btn-gold" data-act="toScore">${over?"Final tally →":"Tally the ledger →"}</button></div></div></div>`;}

/* ---------------- SCORE ---------------- */

   <div><div class="eyebrow">After hand ${S.handNo} of ${S.totalHands} · first to ${S.target} wins</div><h2 class="h2" style="margin-top:4px">The Ledger</h2></div>

   :`<div class="row c"><button class="btn btn-gold" data-act="${over?"finish":"nextHand"}">${over?"Crown the victor →":"Next hand →"}</button></div>`}</div></div>`;}

/* ---------------- END ---------------- */
function rEnd(){const rk=ranking();const w=rk[0];const byT=S._endReason==="target";const fm=(!byT&&S._finalMove)||null;

    ${fm?`<div class="note gold"><b>Closing bell.</b> One last market move revalued every warehouse: ${COMM.map(c=>{const d=fm[c.k]||0;return `${c.n} ${d>0?"▲"+d:d<0?"▼"+(-d):"·"}`;}).join(" · ")}</div>`:""}
    <div class="rank-list">${rk.map((r,j)=>`<div class="rrow ${j===0?"lead":""}"><span class="rk">${j+1}</span>${portrait(r.p,40)}
      <div style="min-width:0"><div class="nm">${esc(r.p.name)}</div><div class="br">${fl(r.p.fl)} + ${fl(holdingsValue(r.p))} in goods · pots won ${r.p.stats?r.p.stats.won:0} · boasts ${r.p.stats?r.p.stats.boastsMade:0}</div></div>
      <span class="v num">${r.v}</span></div>`).join("")}</div>
    ${MP()?`<div class="row c">${NET.role==="host"?`<button class="btn btn-gold" data-act="mpRematch">New game, same table</button>`:`<span class="soft">The host can start a new game at this table.</span>`}<button class="btn btn-ink" data-act="mpLeave">Leave</button></div>`
    :`<div class="row c"><button class="btn btn-gold" data-act="again">Play again, same merchants</button><button class="btn btn-ink" data-act="toSetup">New merchants</button></div>`}</div></div>`;}

/* ====================== SHEETS ====================== */
function renderSheet(){const root=$("sheet");const sh=U.sheet;if(!sh){root.innerHTML="";return;}
  const f=SHEETS()[sh.type];
  if(!f){root.innerHTML="";return;}
  patchDOM(root,`<div class="scrim" id="scrim" data-act="scrim"><div id="sh-${sh.type}${sh.type==="power"?"-"+sh.stage:""}" class="sheet ${sh.type==="holdings"||sh.type==="rules"?"wide":""} ledger" role="dialog" aria-modal="true">${f(sh)}</div></div>`);
  if(sh.type==="power"&&sh.stage==="result")requestAnimationFrame(rollFx);
}
function SHEETS(){return {tradePrompt:shTradePrompt,holdings:shHoldings,rules:shRules,leave:shLeave,trade:shTrade,raise:shRaise,boast:shBoast,challenge:shChallenge,power:shPower,pledge:shPledge};}
/* live-update a sheet while a slider is dragged, without rebuilding the slider itself */
function patchSheet(){const f=SHEETS()[U.sheet&&U.sheet.type];if(!f)return;const tmp=document.createElement("div");tmp.innerHTML=f(U.sheet);
  [".read",".quote",'[data-act$="Go"]'].forEach(sel=>{const a=document.querySelector("#sheet "+sel),b=tmp.querySelector(sel);if(!a||!b)return;
    a.innerHTML=b.innerHTML;if(b.hasAttribute("disabled"))a.setAttribute("disabled","");else a.removeAttribute("disabled");});}
function sheetHead(eyebrow,title,closable){return `<div class="sheet-h"><div><div class="eyebrow">${eyebrow}</div><h2 class="h2" style="margin-top:4px;font-size:clamp(20px,3vw,26px)">${title}</h2></div>${closable===false?"":`<button class="x" data-act="close" aria-label="Close">✕</button>`}</div>`;}
function shHoldings(){return sheetHead("At current prices","Holdings &amp; worth")+`<div class="hold-grid">${S.players.map(p=>`<div class="hold-card"><div class="row">${portrait(p,34)}<b class="h3">${esc(p.name)}</b></div>${dashHTML(p)}</div>`).join("")}</div>`;}
function shLeave(){if(MP())return sheetHead("Leave the table",NET.role==="host"?"Close the table?":"Leave the table?")+`<p style="margin:0 0 14px">${NET.role==="host"?"Everyone's game pauses while your page is closed. The game is saved on this phone: tap <b>Resume hosting</b> on the title screen to reopen it with the same code.":"You can rejoin with the same room code while the host keeps the table open."}</p>
  <div class="row c"><button class="btn btn-ink" data-act="close">Stay</button><button class="btn btn-wax" data-act="mpLeave">${NET.role==="host"?"Close the table":"Leave"}</button></div>`;
  return sheetHead("Leave the table","Pause this game?")+`<p style="margin:0 0 14px">Your game is saved in this browser. Resume it from the title screen.</p>
  <div class="row c"><button class="btn btn-ink" data-act="close">Stay</button><button class="btn btn-wax" data-act="leave">Leave the table</button></div>`;}
function shRules(){const rows=RANK_NAMES.map((n,r)=>({n,r})).reverse();
  return sheetHead("How to play","The Merchant's Table")+`<div class="rules">
   <div><h4>The goal</h4><p>Be the first merchant to reach the wealth target, or the richest when the turns run out. Wealth is your florins plus your goods at current market prices.</p></div>
   <div><h4>A hand</h4><p>1. <b>Market.</b> Prices drift, an event card is drawn, and each merchant may make one trade. 2. <b>Ante</b> ${ANTE} fl. If you can't, you sit out (nobody is ever eliminated). 3. Everyone privately sees <b>2 dice</b> (d8, faces 1–8). 4. Five <b>community dice</b> are revealed 3, then 1, then 1, with a betting round before each reveal and after the last. 5. <b>Showdown:</b> best five of your seven dice wins the pot. Ties split.</p></div>
   <div><h4>Hand ranks · strongest first</h4><div class="scroll-x"><table class="rtable"><thead><tr><th>Hand</th><th>Example</th><th>Chance with 7 dice</th></tr></thead><tbody>
     ${rows.map(({n,r})=>`<tr><td><b>${n}</b></td><td>${({7:"6 6 6 6 6",6:"3 3 3 3 · 7",5:"4 5 6 7 8",4:"5 5 5 · 2 2",3:"7 7 7 · 4 1",2:"8 8 · 3 3 · 5",1:"6 6 · 8 4 2",0:"8 6 4 3 1"})[r]}</td><td class="num">${({7:"0.4%",6:"5%",5:"11%",4:"20%",3:"10%",2:"40%",1:"14%",0:"0.5%"})[r]}</td></tr>`).join("")}</tbody></table></div>
     <p class="soft it" style="margin-top:6px;font-size:14px">There are no suits, so no flush. A Straight beats a Full House because with eight-sided dice it is about half as common.</p></div>
   <div><h4>Boasts</h4><p>Before the final die, you may boast that your final hand will reach a tier or better, with a stake up to a quarter of your chips. Anyone may challenge on their turn. Both stakes are locked until the hand ends. Rarer boasts pay more:</p>
     <div class="scroll-x"><table class="rtable"><thead><tr><th>Boast</th><th>Challenger pays</th><th>Blind chance</th></tr></thead><tbody>${HAND_TIERS.map(t=>`<tr><td>${t.n} or better</td><td>${t.pay[0]}:${t.pay[1]} on the stake</td><td>${t.pct}%</td></tr>`).join("")}</tbody></table></div>
     <p class="soft it" style="margin-top:6px;font-size:14px">If the hand ends early because everyone folds, the remaining dice are rolled out to settle boasts. A boaster who folds loses the boast.</p></div>
   <div><h4>Commodity powers</h4><div class="scroll-x"><table class="rtable"><thead><tr><th>Good</th><th>Power</th><th>Cost</th></tr></thead><tbody>${COMM.map(c=>`<tr><td>${icon(c.k)} ${c.n}</td><td><b>${c.ab}.</b> ${c.abd}</td><td>${c.cost}</td></tr>`).join("")}</tbody></table></div>
     <p class="soft it" style="margin-top:6px;font-size:14px">Each power once per game, and one power per hand. Nudges stop at 1 and 8. All-in merchants get a chance to use a power at each new street.</p></div>
   <div><h4>Trading and running dry</h4><p>One trade per market phase, and it can mix buying and selling: set every purchase and sale, then execute them together. Sale proceeds can pay for purchases. Buying is free. Selling two or more kinds in one trade costs a ${Math.round(SELL_FEE*100)}% fee on the sales (${Math.round(BROKE_FEE*100)}% if you start with no florins). During betting, if you can't cover a call, you may <b>pledge</b> goods to the bank at 50% of market value.</p></div>
   <div><h4>Events</h4><p>Each hand draws one card: price shocks for a commodity or a group, market-wide booms and panics, lost or gained stock, and cards that let the richest or poorest merchant move goods or bend a price. Cards never create or destroy florins.</p></div>
  </div>`;}
/* --- trade --- */
function tradeOrder(sh){const buy={},sell={};CKEYS.forEach(k=>{const v=sh.sel[k]||0;if(v>0)buy[k]=v;else if(v<0)sell[k]=-v;});return {mode:"order",buy,sell};}
function shTrade(sh){const p=S.players[sh.pi];sh.sel=sh.sel||{};const q=tradeQuote(p,tradeOrder(sh));const any=CKEYS.some(k=>sh.sel[k]);
  const rows=COMM.map(c=>{const v=sh.sel[c.k]||0;const pr=S.prices[c.k];
    const canSell=-(v-1)<=p.port[c.k];const tryBuy=Object.assign({},sh.sel,{[c.k]:v+1});const canBuy=tradeQuote(p,tradeOrder({sel:tryBuy})).ok||(v<0);
    const lab=v>0?`Buy ${v}`:v<0?`Sell ${-v}`:"—";const amt=v?`${v>0?"−":"+"}${Math.abs(v)*pr} fl`:"";
    return `<div class="trow ${v>0?"buy":v<0?"sell":""}"><span class="tn">${icon(c.k)}<span><b>${c.n}</b><small class="num">${pr} fl · you hold ${p.port[c.k]}${v?` → ${p.port[c.k]+v}`:""}</small></span></span>
      <span class="tstep"><button data-act="tadj" data-arg="${c.k}:-1" ${canSell?"":"disabled"} aria-label="Sell one more ${c.n}">−</button><b class="num">${lab}</b><button data-act="tadj" data-arg="${c.k}:1" ${canBuy?"":"disabled"} aria-label="Buy one more ${c.n}">+</button></span>
      <span class="tamt num">${amt}</span></div>`;}).join("");
  const after=p.fl+q.net;
  const summary=!any?`<div class="quote">Tap <b>+</b> to buy or <b>−</b> to sell. Mix both in one trade.</div>`
    :`<div class="tsum num">${q.sales?`<div><span>Sales</span><b>+${q.sales} fl</b></div>`:""}${q.fee?`<div><span>Fee (${Math.round(q.rate*100)}%, ${q.kinds} kinds sold)</span><b>−${q.fee} fl</b></div>`:""}${q.buys?`<div><span>Purchases</span><b>−${q.buys} fl</b></div>`:""}
      <div class="net"><span>Florins</span><b>${p.fl} → ${after}</b></div>${!q.ok?`<div class="bad">${after<0?"Not enough florins for these purchases.":"Adjust the order to continue."}</div>`:""}</div>`;
  sh._label=any&&q.ok?(q.net>0?`Execute trade · receive ${q.net} fl`:q.net<0?`Execute trade · pay ${-q.net} fl`:"Execute trade"):null;
  return sheetHead(`Market · one trade per hand`,`${esc(p.name)} · <span class="num">${fl(p.fl)}</span>`)+`<div style="display:grid;gap:10px">
   <p class="soft" style="margin:0;font-size:14px">Set everything you want to buy and sell, then execute it all at once. After that, the market is closed to you until next hand.</p>
   <div class="tlist">${rows}</div>${summary}
   <p class="soft it" style="margin:0;font-size:12.5px;text-align:center">Buying is free. Selling two or more kinds costs ${Math.round(SELL_FEE*100)}% of sales (${Math.round(BROKE_FEE*100)}% if you start with no florins).</p>
   <div class="row c"><button class="btn btn-ink" data-act="${any?"tclear":"close"}">${any?"Clear":"Cancel"}</button><button class="btn btn-gold" data-act="tradeGo" ${sh._label?"":"disabled"}>${sh._label||"Execute trade"}</button></div></div>`;}
/* --- trade prompt (hints) --- */
function hintsOn(){const v=lsGet("mt-hints");return v!==false;}
function setHints(on){lsSet("mt-hints",!!on);}
function shTradePrompt(sh){const hintsLine=`<label class="hint-toggle"><input type="checkbox" data-inp="hints" ${hintsOn()?"checked":""}> Show trading tips each hand</label>`;
  if(MP()){const p=S.players[ME()];const hs=tradeHints(p);
    return `<div class="tp">${portrait(p,64)}<div class="eyebrow">Hand ${S.handNo} · the market is open</div><h2 class="h2">Trade before the deal?</h2>
     <div class="tip"><span class="tag gold">Tip</span>${hs.map(h=>`<p>${esc(h)}</p>`).join("")}</div>
     <div class="row c"><button class="btn btn-ink" data-act="close">Not this hand</button><button class="btn btn-gold" data-act="trade" data-arg="${ME()}">Open the market</button></div>${hintsLine}</div>`;}
  const list=S.players.map((p,i)=>p.traded?"":`<div class="tp-row">${portrait(p,40)}<div style="min-width:0"><b>${esc(p.name)}</b> <span class="soft num">· ${fl(p.fl)}</span><p>${esc(tradeHints(p)[0])}</p></div><button class="btn btn-line btn-sm" style="color:var(--ink);border-color:rgba(42,29,18,.35)" data-act="trade" data-arg="${i}">Trade</button></div>`).join("");
  return `<div class="tp"><div class="eyebrow">Hand ${S.handNo} · the market is open</div><h2 class="h2">Anyone trading before the deal?</h2>
   <div class="tp-list">${list}</div>
   <div class="row c"><button class="btn btn-gold" data-act="close">Back to the market</button></div>${hintsLine}</div>`;}
function maybeTradePrompt(){if(!hintsOn()||U.screen!=="market"||S.pendingChoice||U.sheet||U.tradePromptHand===S.handNo)return;
  if(MP()){const p=S.players[ME()];if(!p||p.traded||S.ready[ME()])return;}else if(S.players.every(p=>p.traded))return;
  U.tradePromptHand=S.handNo;U.sheet={type:"tradePrompt"};renderSheet();}
/* --- raise --- */
function shRaise(sh){const L=legal();const p=S.players[S.turn];const lo=Math.min(L.minRaise,L.maxRaise),hi=L.maxRaise;sh.v=Math.max(lo,Math.min(hi,sh.v||lo));
  const potBet=Math.min(hi,Math.max(lo,S.currentBet+S.pot+L.toCall));const half=Math.min(hi,Math.max(lo,S.currentBet+Math.round((S.pot+L.toCall)/2)));
  const adds=sh.v-p.committed;const allin=sh.v===hi;
  return sheetHead(`${esc(p.name)} · ${fl(p.fl)} in chips`,S.currentBet>0?"Raise to":"Open the betting")+`<div style="display:grid;gap:12px">
   <div class="slider"><div class="read num">${sh.v} fl</div><input type="range" id="rsr" data-inp="raise" min="${lo}" max="${hi}" step="1" value="${sh.v}" aria-label="Amount">
    <div class="quick"><button class="btn btn-ink btn-sm" data-act="rset" data-arg="${lo}">Min ${lo}</button><button class="btn btn-ink btn-sm" data-act="rset" data-arg="${half}">½ pot ${half}</button><button class="btn btn-ink btn-sm" data-act="rset" data-arg="${potBet}">Pot ${potBet}</button><button class="btn btn-ink btn-sm" data-act="rset" data-arg="${hi}">All-in ${hi}</button></div></div>
   <div class="quote">Puts <b>${adds} fl</b> more in · chips ${p.fl} → <b>${p.fl-adds}</b>${allin?" · <b>all-in</b>":""}</div>
   <div class="row c"><button class="btn btn-ink" data-act="close">Back</button><button class="btn btn-gold" data-act="raiseGo">${S.currentBet>0?"Raise":"Bet"} ${sh.v} fl</button></div></div>`;}
/* --- boast --- */
function shBoast(sh){const L=legal();const p=S.players[S.turn];const cap=L.boastCap;sh.stake=Math.max(1,Math.min(cap,sh.stake||cap));
  const t=sh.tier?tierOf(sh.tier):null;const win=t?Math.round(sh.stake*t.pay[0]/t.pay[1]):0;
  return sheetHead(`${esc(p.name)} boasts`,"Claim your final hand")+`<div style="display:grid;gap:12px">
   <p style="margin:0">Claim that your final hand will reach a tier or better. Anyone may challenge you on their turn. Stakes lock until the hand ends.</p>
   <div class="tiers">${HAND_TIERS.map(x=>`<button class="tier" data-act="btier" data-arg="${x.t}" aria-pressed="${sh.tier===x.t}"><b>${x.n} or better</b><span>Pays ${x.pay[0]}:${x.pay[1]} · ${x.pct}% blind chance</span></button>`).join("")}</div>
   <div class="slider"><div class="read num">${sh.stake} fl <span style="font-size:14px;font-family:var(--body);font-weight:500;color:var(--ink-soft)">per challenger</span></div>
    <input type="range" id="bsr" data-inp="bstake" min="1" max="${cap}" step="1" value="${sh.stake}" aria-label="Stake"></div>
   <div class="quote">${t?`Win <b>${win} fl</b> from each challenger if you make it. Lose <b>${sh.stake} fl</b> to each if you don't.`:"Pick a tier."}</div>
   <div class="row c"><button class="btn btn-ink" data-act="close">Never mind</button><button class="btn btn-wax" data-act="boastGo" ${t?"":"disabled"}>${t?`Boast ${t.n} · ${sh.stake} fl`:"Boast"}</button></div></div>`;}
function shChallenge(sh){const p=S.players[S.turn],b=S.players[sh.bi];const t=challengeTerms(b,p);const tier=tierOf(b.boast);
  return sheetHead(`${esc(p.name)} · ${fl(p.fl)} in chips`,`Challenge ${esc(b.name)}?`)+`<div style="display:grid;gap:12px">
   <p style="margin:0">${esc(b.name)} claims <b>${tier.n} or better</b>. You bet they fall short once all five community dice are out.</p>
   <div class="quote">You lock up <b>${t.cRisk} fl</b>. ${esc(b.name)} locks up <b>${t.bRisk} fl</b>.${t.cRisk<t.full?` <span class="soft">(scaled down to what you can cover)</span>`:""} Winner takes both.</div>
   <div class="row c"><button class="btn btn-ink" data-act="close">Back</button><button class="btn btn-wax" data-act="challengeGo">Challenge for ${t.cRisk} fl</button></div></div>`;}
/* --- pledge --- */
function shPledge(sh){const p=S.players[S.turn];sh.sel=sh.sel||{};let g=0;CKEYS.forEach(k=>g+=(sh.sel[k]||0)*S.prices[k]);const gain=Math.round(g*PLEDGE_RATE);
  return sheetHead(`${esc(p.name)} · ${fl(p.fl)} in chips`,"Pledge goods to the bank")+`<div style="display:grid;gap:10px">
   <p style="margin:0">Fire-sell goods at <b>half</b> their market price to keep betting. The florins go straight into your stack.</p>
   ${COMM.filter(c=>p.port[c.k]>0).map(c=>`<div class="qrow"><span>${icon(c.k)} <b>${c.n}</b> <span class="soft">@ ${S.prices[c.k]} → ${S.prices[c.k]*PLEDGE_RATE} each</span></span>
     <span class="stepper"><button data-act="ps" data-arg="${c.k}:-1" aria-label="One less ${c.n}">−</button><b class="num">${sh.sel[c.k]||0}</b><button data-act="ps" data-arg="${c.k}:1" aria-label="One more ${c.n}">+</button></span><span class="soft num">/ ${p.port[c.k]}</span></div>`).join("")}
   <div class="quote">${g?`Market value <b>${g} fl</b> → you receive <b>${gain} fl</b>`:"Pick goods to pledge."}</div>
   <div class="row c"><button class="btn btn-ink" data-act="close">Back</button><button class="btn btn-wax" data-act="pledgeGo" ${g?"":"disabled"}>Pledge for ${gain} fl</button></div></div>`;}
/* --- powers --- */
function whyNot(p,c){if(p.powerUsed&&p.powerUsed[c.k])return "Already used this game";if(p.port[c.k]<c.cost)return `Need ${c.cost}, you hold ${p.port[c.k]}`;
  if((c.k==="wheat"||c.k==="wood")&&S.reveal===0)return "No community dice yet";if(c.k==="silver"&&S.reveal>=5)return "No die left to preview";if(c.k==="gold"&&p.priv.length>=3)return "Already three dice";return "";}
function shPower(sh){const p=S.players[sh.pi];const c=sh.k?CMAP[sh.k]:null;
  if(sh.stage==="choose")return sheetHead(`${esc(p.name)} · one power per hand`,"Spend a commodity")+`<p style="margin:0 0 12px">Each power works once per game. Spending goods also lowers your wealth.</p>
   <div class="powers">${COMM.map(x=>{const ok=abilityReady(p,x.k);return `<button class="power" data-act="pchoose" data-arg="${x.k}" ${ok?"":"disabled"}>${icon(x.k)}<b>${x.ab}</b><span>${x.abd}</span><em>${ok?`Costs ${x.cost} ${x.n.toLowerCase()} · you hold ${p.port[x.k]}`:whyNot(p,x)}</em></button>`;}).join("")}</div>
   <div class="row c" style="margin-top:12px"><button class="btn btn-ink" data-act="close">Back</button></div>`;
  if(sh.stage==="pickBoard"){const okFn=sh.k==="wood"?(j=>true):null;

     ${sh.idx!=null&&sh.k==="wood"?`<p style="text-align:center;margin:12px 0 0">Nudge die showing <b>${S.board[sh.idx]}</b></p><div class="row c" style="margin-top:8px"><button class="btn btn-gold" data-act="nudge" data-arg="1" ${S.board[sh.idx]>=8?"disabled":""}>${S.board[sh.idx]>=8?"Already 8":"▲ Up to "+(S.board[sh.idx]+1)}</button><button class="btn btn-gold" data-act="nudge" data-arg="-1" ${S.board[sh.idx]<=1?"disabled":""}>${S.board[sh.idx]<=1?"Already 1":"▼ Down to "+(S.board[sh.idx]-1)}</button></div>`:""}
     <div class="row c" style="margin-top:12px"><button class="btn btn-ink" data-act="pback">Back</button></div>`;}
  if(sh.stage==="cover")return `<div class="cover"><div class="eyebrow">${c.ab} · private</div>${portrait(p,110)}<div class="big">${esc(p.name)}</div><p class="soft" style="margin:0">Everyone else, look away.</p>
    <div class="row c"><button class="btn btn-ink" data-act="pback">Back</button><button class="btn btn-gold" data-act="pcover">I'm ${esc(p.name)}. Go on</button></div></div>`;
  if(sh.stage==="pickPriv")return sheetHead(c.ab,sh.k==="brick"?"Tap a private die to re-roll":"Tap a private die to nudge",false)+`<div class="dice">${p.priv.map((d,j)=>die(d,"garnet","lg pickable"+(sh.idx===j?" glow":""),`data-act="pickPriv" data-arg="${j}" tabindex="0"`)).join("")}</div>
    ${sh.idx!=null&&sh.k==="ore"?`<div class="row c" style="margin-top:12px"><button class="btn btn-gold" data-act="nudge" data-arg="1" ${p.priv[sh.idx]>=8?"disabled":""}>${p.priv[sh.idx]>=8?"Already 8":"▲ Up to "+(p.priv[sh.idx]+1)}</button><button class="btn btn-gold" data-act="nudge" data-arg="-1" ${p.priv[sh.idx]<=1?"disabled":""}>${p.priv[sh.idx]<=1?"Already 1":"▼ Down to "+(p.priv[sh.idx]-1)}</button></div>`:""}
    <div class="row c" style="margin-top:12px"><button class="btn btn-ink" data-act="close">Cancel</button></div>`;
  if(sh.stage==="pending")return `<div class="cover"><div class="eyebrow">${c.ab}</div><div class="big" style="font-size:32px">Casting…</div><p class="soft" style="margin:0">Waiting for the host's phone.</p></div>`;
  if(sh.stage==="result"){let body="";
    if(sh.k==="silver")body=`<p style="margin:0">The next community die will show:</p><div class="dice">${die(p.preview.v,"sapphire","lg rolling")}</div><p class="soft it" style="margin:0">Only you know this. It also appears when you hold My dice.</p>`;
    else if(sh.k==="wheat"||sh.k==="wood"){body=`<div class="board-mini">${community().map((d,j)=>die(d,"bone","md"+(j===sh.idx?" glow rolling":""))).join("")}</div>
       <p style="margin:0">Community die ${sh.idx+1}: <b>${sh.was}</b> → <b>${S.board[sh.idx]}</b>${sh.was===S.board[sh.idx]?" <span class='soft it'>(re-rolled the same face, about 1 in 8)</span>":""}</p>`;}
    else{const hi=sh.k==="gold"?p.priv.length-1:sh.idx;const ev=bestOf(p);
      body=`<div class="dice">${p.priv.map((d,j)=>die(d,"garnet","lg"+(j===hi?" glow rolling":""))).join("")}</div>
       <p style="margin:0">${sh.k==="gold"?"A third die joins your hand. Your best five of eight now count.":`Die ${hi+1}: <b>${sh.was}</b> → <b>${p.priv[hi]}</b>${sh.was===p.priv[hi]?" <span class='soft it'>(the same face again)</span>":""}`}</p>
       <p class="soft" style="margin:0">Best hand now: <b>${ev.name}</b> · ${ev.detail}</p>`;}
    return `<div class="cover"><div class="eyebrow">${c.ab}</div>${body}<button class="btn btn-gold" data-act="close">${c.scope==="public"||c.scope==="publicSign"?"Back to the table":"Hide & resume"}</button></div>`;}
  return "";}

/* ---------- hold-to-peek layer ---------- */
function peekHTML(i){const p=S.players[i];const ev=bestOf(p);const pv=p.preview&&p.preview.idx>=S.reveal?p.preview:null;const t=p.boast?tierOf(p.boast):null;

/* ---------- coin flight from a seat to the pot ---------- */
function flyCoin(from){const s=document.querySelector(`.seat[data-seat="${from}"]`),pot=document.querySelector(".pot .coins");if(!s||!pot||!s.animate)return;
  let layer=$("flylayer");if(!layer){layer=document.createElement("div");layer.id="flylayer";document.body.appendChild(layer);}
  const W=innerWidth,H=innerHeight,cl=(v,m)=>Math.max(0,Math.min(m-26,v));
  const a=s.getBoundingClientRect(),b=pot.getBoundingClientRect();for(let k=0;k<3;k++){const el=document.createElement("div");el.className="flycoin";el.innerHTML=coinSVG();layer.appendChild(el);setTimeout(()=>el.remove(),1500);
    const x0=cl(a.left+a.width/2-13,W),y0=cl(a.top+a.height/2-13,H),x1=cl(b.left+b.width/2-13+(k-1)*6,W),y1=cl(b.top+b.height/2-13,H);
    el.animate([{transform:`translate(${x0}px,${y0}px) scale(.9)`,opacity:1},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-60}px) scale(1.15)`,opacity:1,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.8)`,opacity:.2}],
      {duration:560+k*90,easing:"cubic-bezier(.3,.7,.4,1)",delay:k*60,fill:"forwards"}).onfinish=()=>el.remove();}}

function startGame(){S.skin=SKIN_ID;S.players.forEach((p,i)=>{p.name=(p.name||"").trim()||`Merchant ${i+1}`;});newGame();startHand();U.screen="market";U.expand=null;U.tradePromptHand=0;SFX.card();render();setTimeout(maybeTradePrompt,700);}
function dealHand(){S.players.forEach(p=>{p.flAtDeal=p.fl;p.pledged=0;});postAntes();SFX.dice(4);
  const live=liveIdx();
  if(live.length===0){S._show={winners:[],byFold:true,pots:[],boasts:[],nobody:true};S.phase="result";U.screen="result";return render();}
  if(live.length===1){endHandByFold();return toResult();}
  U.peekQueue=seatOrderFrom(S.dealer).filter(i=>!S.players[i].out);U.peekPos=0;U.peekShown=false;U.allinDone="";U.screen="deal";render();}
function continueHand(){
  if(S.phase==="result")return toResult();
  const key=S.handNo+":"+S.street;
  if(allinPending().length&&U.allinDone!==key){U.tray="allin";U.screen="table";return render();}
  if(streetDone()){const r=advanceStreet();if(r==="result")return toResult();return showReveal();}
  U.tray="bet";U.screen="table";render();}
function showReveal(){U.revealFrom=[0,0,3,4][S.street];U.rollPending=true;U.tray="reveal";U.screen="table";SFX.dice(S.street===1?3:1);render();}
function step(act){if(MP()){U.armed=null;U.sheet=null;send(act);render();return;}const who=S.turn,potBefore=S.pot;const r=apply(act);U.armed=null;U.sheet=null;
  if(S.pot>potBefore){U.fly={from:who};SFX.coin();}else if(act.type==="fold")SFX.card();else SFX.tap();
  if(r==="result")return toResult();
  if(r==="reveal")return showReveal();
  continueHand();}
function toResult(){U.screen="result";U.sheet=null;U.tray="bet";render();
  const sh=S._show;if(sh&&sh.winners&&sh.winners.length){SFX.win();requestAnimationFrame(()=>{const r=document.querySelector(`.srow[data-row="${sh.winners[0]}"]`);if(r){const b=r.getBoundingClientRect();FX.burst(b.left+40,b.top+b.height/2,36);}});}}

  SFX.win();setTimeout(()=>FX.burst(innerWidth/2,innerHeight*.3,90),200);}

    if(a==="peekClose"&&Date.now()-lastPointerPeek<400)return;

    const el=e.target.closest&&e.target.closest("[data-peek]");if(el&&(e.key===" "||e.key==="Enter")){e.preventDefault();U.peekOpen?closePeek():openPeek(+el.dataset.peek,"tap");}
    const d=e.target.closest&&e.target.closest(".die[data-act]");if(d&&(e.key===" "||e.key==="Enter")){e.preventDefault();d.click();}});
  let t0=0;
  document.addEventListener("pointerdown",e=>{const el=e.target.closest("[data-peek]");if(!el)return;e.preventDefault();t0=Date.now();lastPointerPeek=t0;openPeek(+el.dataset.peek,"hold");});
  const up=()=>{if(U.peekOpen==="hold"){if(Date.now()-t0>300)closePeek();else{U.peekOpen="tap";const i=S.turn;openPeek(i,"tap");}lastPointerPeek=Date.now();}};
  document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
  document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-peek]"))e.preventDefault();});
  document.addEventListener("input",e=>{const el=e.target;const k=el.dataset&&el.dataset.inp;if(!k)return;
    if(k==="name"){S.players[+el.dataset.i].name=el.value;return;}
    if(k==="hints"){setHints(el.checked);toast(el.checked?"Trading tips on":"Trading tips off. Turn them back on in setup or the lobby");if(!el.checked&&U.sheet&&U.sheet.type==="tradePrompt"){U.sheet=null;render();}return;}

    const v=+el.value;

    patchSheet();});
  document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.inp;if(k&&k!=="name"){const id=e.target.id;renderSheet();const n=$(id);if(n)n.focus();}});
}

/* ===================== MULTIPLAYER TRANSPORT + SCREENS (DOM) ===================== */
const PEER_PREFIX="mercantila-v2-";
const NET={role:"solo",code:null,seat:0,peer:null,conns:{},conn:null,real:null,status:"",lastSeen:{},lastHost:0,timers:[],wake:null,retry:0};
const MP=()=>NET.role!=="solo";
const ME=()=>S.mySeat|0;
function lsGet(k){try{const t=localStorage.getItem(k);return t?JSON.parse(t):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function profile(){return lsGet("mt-profile")||{name:"",pi:rng(0,5),hi:rng(0,3)};}
function roomFromURL(){try{const q=new URLSearchParams(location.search).get("room");return q&&/^[A-Za-z]{4}$/.test(q)?q.toUpperCase():null;}catch(e){return null;}}
function joinURL(code){const u=location.href.split("?")[0].split("#")[0];let sig=null;try{sig=new URLSearchParams(location.search).get("signal");}catch(e){}return `${u}?room=${code}${sig?"&signal="+encodeURIComponent(sig):""}`;}
function peerAvailable(){return typeof Peer!=="undefined";}
/* optional self-hosted signaling server: ?signal=host:port (defaults to the free public PeerJS server) */
const ICE_SERVERS=[
  {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},
  {urls:"stun:stun.cloudflare.com:3478"},
  {urls:["turn:eu-0.turn.peerjs.com:3478","turn:us-0.turn.peerjs.com:3478"],username:"peerjs",credential:"peerjsp"},
  {urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443","turns:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}];
function peerOpts(){const o={debug:0,config:{iceServers:ICE_SERVERS,sdpSemantics:"unified-plan"}};
  try{const s=new URLSearchParams(location.search).get("signal");if(s){const [h,pt]=String(s).split(":");Object.assign(o,{host:h,port:+pt||443,path:"/peerjs",secure:!/^(localhost|127\.|192\.168\.|10\.)/.test(h)});}}catch(e){}return o;}

/* keep the screen awake so phones don't drop the connection mid-hand */
async function keepAwake(){try{if(navigator.wakeLock&&!NET.wake){NET.wake=await navigator.wakeLock.request("screen");NET.wake.addEventListener("release",()=>{NET.wake=null;});}}catch(e){}}
typeof document!=="undefined"&&document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&MP()){keepAwake();if(NET.role==="guest"&&(!NET.conn||!NET.conn.open))guestConnect();if(NET.peer&&NET.peer.disconnected)try{NET.peer.reconnect();}catch(e){}}});

/* ---------------- host ---------------- */
function withReal(fn){const view=S;S=NET.real;try{return fn();}finally{NET.real=S;S=view;}}
function markActive(){lsSet("mt-active",{role:NET.role,code:NET.code,at:Date.now()});}
function hostSave(){markActive();lsSet("mt-host",{code:NET.code,real:NET.real,host:{tokens:HOST.tokens,passed:HOST.passed,seq:HOST.seq},at:Date.now()});}
function hostCreate(resume){
  if(!peerAvailable())return toast("Multiplayer needs an internet connection");
  const pr=profile();
  if(resume){const sv=lsGet("mt-host");if(!sv)return toast("No hosted game to resume");NET.code=sv.code;NET.real=sv.real;Object.assign(HOST,sv.host);
    NET.real.conn=NET.real.players.map((_,i)=>i===0);}
  else{NET.code=newRoomCode();const real={players:[],count:2,totalHands:10,target:525,targetAuto:true,numerals:"arabic",phase:"lobby"};
    NET.real=real;withReal(()=>hostInitLobby(pr.name||"Host",pr.pi,pr.hi));NET.real.skin=SKIN_ID;}
  NET.role="host";NET.seat=0;NET.status="Opening the table…";hostOpenPeer(!!resume,0);hostBroadcast();keepAwake();
}
function hostOpenPeer(resume,attempt){
  if(NET.peer)try{NET.peer.destroy();}catch(e){}
  const peer=new Peer(PEER_PREFIX+NET.code,peerOpts());NET.peer=peer;
  peer.on("open",()=>{NET.status="";render();});
  peer.on("connection",conn=>hostAccept(conn));
  peer.on("disconnected",()=>{if(NET.peer!==peer)return;if(NET.real&&NET.real.phase==="lobby"){NET.status="Reconnecting to the lobby server…";render();}
    let tries=0;const retry=()=>{if(NET.peer!==peer||NET.role!=="host"||!peer.disconnected)return;if(++tries>4){hostOpenPeer(true,0);return;}try{peer.reconnect();}catch(e){}setTimeout(retry,3000);};setTimeout(retry,1000);});
  peer.on("error",e=>{
    if(e.type==="unavailable-id"){ // the code is still held (e.g. after a reload): retry, or pick a new code for a fresh lobby
      if(resume||NET.real.phase!=="lobby"||attempt<1){NET.status="Reclaiming your room code…";render();setTimeout(()=>hostOpenPeer(resume,attempt+1),3000);}
      else{NET.code=newRoomCode();hostOpenPeer(false,attempt+1);}return;}
    if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"){NET.status="Can't reach the lobby server. Retrying…";render();setTimeout(()=>hostOpenPeer(resume,attempt+1),4000);return;}
    if(e.type==="browser-incompatible"){NET.status="This browser can't do peer-to-peer play.";render();}
  });
  clearInterval(NET.pinger);NET.pinger=setInterval(hostTick,4000);
}
function hostAccept(conn){let seat=null;
  conn.on("data",d=>{if(!d||typeof d!=="object")return;
    if(d.t==="hello"){const r=withReal(()=>hostJoin(d));if(r.err){conn.send({t:"err",msg:r.err,fatal:true});setTimeout(()=>conn.close(),500);return;}
      seat=r.seat;const old=NET.conns[seat];NET.conns[seat]=conn;NET.lastSeen[seat]=Date.now();
      if(old&&old!==conn){old._replaced=true;try{old.close();}catch(e){}}NET.real.conn[seat]=true;
      conn.send({t:"welcome",seat,token:r.token,code:NET.code});hostBroadcast();return;}
    if(seat==null)return;NET.lastSeen[seat]=Date.now();
    if(d.t==="pong")return;
    if(d.t==="act"){const r=withReal(()=>hostHandle(seat,d.a));if(r.err)conn.send({t:"err",msg:r.err});hostBroadcast();}
  });
  conn.on("close",()=>{if(conn._replaced)return;if(seat!=null&&NET.conns[seat]===conn){delete NET.conns[seat];NET.real.conn[seat]=false;hostBroadcast();}});
  conn.on("error",()=>{});
}
function hostTick(){const now=Date.now();let changed=false;
  Object.keys(NET.conns).forEach(s=>{const c=NET.conns[s];try{c.send({t:"ping"});}catch(e){}
    if(now-(NET.lastSeen[s]||0)>25000){delete NET.conns[s];try{c.close();}catch(e){}NET.real.conn[s]=false;changed=true;}});
  if(changed)hostBroadcast();}
function hostBroadcast(){const real=NET.real;if(!real)return;
  real.players.forEach((_,i)=>{if(i===0)return;const c=NET.conns[i];if(c&&c.open){try{c.send({t:"view",v:makeView(real,i)});}catch(e){}}});
  hostSave();applyView(makeView(real,0));}
function hostAct(a){const r=withReal(()=>hostHandle(0,a));if(r.err){toast(r.err);failPending();}hostBroadcast();}

/* ---------------- guest ---------------- */
function guestSave(){lsSet("mt-guest",{code:NET.code,token:NET.token,at:Date.now()});markActive();}
function guestJoin(code,rebuild){
  if(!peerAvailable())return toast("Multiplayer needs an internet connection");
  code=String(code||"").trim().toUpperCase();if(!/^[A-Z]{4}$/.test(code))return toast("Room codes are 4 letters");
  const sv=lsGet("mt-guest");NET.token=sv&&sv.code===code?sv.token:null;
  NET.role="guest";NET.code=code;NET.status="Connecting to the table…";
  if(!rebuild||!S.players||!S.players.length){U.screen="lobby";S=Object.assign({players:[],phase:"connecting",ui:S.ui});render();}else renderNet();
  if(NET.peer)try{NET.peer.destroy();}catch(e){}
  const peer=new Peer(peerOpts());NET.peer=peer;
  peer.on("open",()=>guestConnect());
  peer.on("disconnected",()=>{setTimeout(()=>{try{peer.reconnect();}catch(e){}},1500);});
  peer.on("error",e=>{
    if(e.type==="peer-unavailable"){NET.status=`No table found with code ${code}. Check the code, or ask the host to reopen the game.`;render();setTimeout(guestConnect,5000);return;}
    if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"){NET.status="Can't reach the lobby server. Retrying…";renderNet();if(U.screen==="lobby")render();setTimeout(()=>{if(NET.peer===peer&&NET.role==="guest")guestJoin(code,true);},4000);return;}
  });
  clearInterval(NET.watch);NET.watch=setInterval(()=>{if(NET.role!=="guest")return;const quiet=Date.now()-NET.lastHost;
    if(NET.conn&&NET.conn.open&&quiet>25000){NET.status="Lost the host. Reconnecting…";renderNet();try{NET.conn.close();}catch(e){}NET.conn=null;guestConnect();}
    else if(NET.conn&&NET.conn.open&&quiet>9000){if(!NET.status){NET.status=`Waiting for ${S.players&&S.players[0]?S.players[0].name+"'s":"the host's"} phone…`;renderNet();}}
    else if((!NET.conn||!NET.conn.open)&&!NET.connecting)guestConnect();},3000);
  keepAwake();
}
function guestConnect(){const peer=NET.peer;if(NET.role!=="guest")return;if(!peer||peer.destroyed){if(!NET.rebuilding){NET.rebuilding=true;setTimeout(()=>{NET.rebuilding=false;if(NET.role==="guest")guestJoin(NET.code,true);},1000);}return;}if(peer.disconnected){try{peer.reconnect();}catch(e){}return;}
  if(NET.conn&&NET.conn.open)return;
  const conn=peer.connect(PEER_PREFIX+NET.code,{reliable:true,serialization:"json"});NET.conn=conn;NET.connecting=true;
  setTimeout(()=>{if(NET.conn===conn&&!conn.open){NET.connecting=false;try{conn.close();}catch(e){}NET.conn=null;}},12000); // a connect attempt that never opens is abandoned and retried
  conn.on("open",()=>{NET.connecting=false;const pr=profile();NET.lastHost=Date.now();conn.send({t:"hello",name:pr.name,pi:pr.pi,hi:pr.hi,token:NET.token});});
  conn.on("data",d=>{if(!d||typeof d!=="object")return;NET.lastHost=Date.now();
    if(d.t==="ping"){try{conn.send({t:"pong"});}catch(e){}if(NET.status&&/Waiting for/.test(NET.status)){NET.status="";renderNet();}return;}
    if(d.t==="welcome"){NET.seat=d.seat;NET.token=d.token;NET.status="";guestSave();return;}
    if(d.t==="view"){if(!NET._mark||Date.now()-NET._mark>60000){NET._mark=Date.now();markActive();}const was=NET.status;NET.status="";applyView(d.v);if(was)renderNet();return;}
    if(d.t==="err"){toast(d.msg);failPending();if(d.fatal){NET.status=d.msg;lsDel("mt-guest");render();}}
  });
  conn.on("close",()=>{if(NET.role!=="guest"||NET.conn!==conn)return;NET.conn=null;NET.connecting=false;NET.status="Connection lost. Reconnecting…";renderNet();setTimeout(guestConnect,1500);});
  conn.on("error",()=>{});
}
function send(a){if(NET.role==="host")return hostAct(a);if(NET.conn&&NET.conn.open){try{NET.conn.send({t:"act",a});return;}catch(e){}}
  toast("Reconnecting to the table. Try again in a moment");failPending();}
/* connection banner + status dot, drawn without touching the game screen */
function renderNet(){const el=$("netbar");if(!el)return;const show=MP()&&NET.status&&U.screen!=="lobby";
  el.hidden=!show;if(show)el.innerHTML=skinText(`<span class="spin" aria-hidden="true"></span>${esc(NET.status)}`);
  document.body.classList.toggle("net-down",MP()&&NET.role==="guest"&&!(NET.conn&&NET.conn.open));}
function leaveMP(){lsDel("mt-active");{const tt=document.getElementById("toast");if(tt){tt.classList.remove("on");tt.textContent="";clearTimeout(toast._t);}}const wasHost=NET.role==="host";try{if(NET.peer)NET.peer.destroy();}catch(e){}clearInterval(NET.pinger);clearInterval(NET.watch);
  Object.assign(NET,{role:"solo",peer:null,conns:{},conn:null,status:""});if(NET.wake)try{NET.wake.release();}catch(e){}
  S={players:[],count:3,totalHands:10,target:525,targetAuto:true,numerals:"arabic",phase:"idle",ui:Object.assign(freshUI(),{muted:U.muted})};applySkin(deviceSkin(),{persist:false});U.screen="title";render();
  if(wasHost)toast("Table closed. You can resume hosting from the title screen");}

/* ---------------- views arrive: animate what changed, then render ---------------- */
function failPending(){if(U.sheet&&U.sheet.stage==="pending"){U.sheet=null;render();}}
function applyView(v){const prev=S;const ui=prev.ui||freshUI();v.ui=ui;const me=v.mySeat;if(v.skin&&v.skin!==SKIN_ID)applySkin(v.skin,{persist:NET.role==="host"});
  const prevAct=prev.lastAct&&prev.lastAct.seq,act=v.lastAct;
  const newAct=act&&act.seq!==prevAct&&prev.players&&prev.players.length;
  S=v;
  // route the screen from the game phase
  const ph=v.phase;const next={lobby:"lobby",connecting:"lobby",market:"market",betting:"table",over:"end"}[ph];
  if(ph==="result"){if(!["result","score"].includes(U.screen))U.screen="result";}else if(next)U.screen=next;
  if(ph!==prev.phase){U.sheet=null;if(ph==="betting")U.tray="bet";}
  if(prev.phase==="betting"&&ph==="betting"&&v.reveal>prev.reveal&&v.handNo===prev.handNo){U.revealFrom=prev.reveal;U.rollPending=true;SFX.dice(v.reveal-prev.reveal);}
  if(prev.phase!=="betting"&&ph==="betting"){SFX.dice(3);}
  if(U.sheet&&U.sheet.type==="power"&&U.sheet.stage==="pending"&&v.players[me]&&v.players[me].powerUsed&&v.players[me].powerUsed[U.sheet.k])U.sheet.stage="result";
  if(newAct){if(act.pot>(prev.pot||0)&&act.seat>=0&&["call","raise"].includes(act.type)){U.fly={from:act.seat};SFX.coin();}
    else if(act.type==="fold")SFX.card();else if(act.type!=="reveal")SFX.tap();
    if(act.seat!==me&&!["reveal","deal","market"].includes(act.type))toast(act.text);
    if(act.type==="market"||act.type==="start")SFX.card();}
  if(v.turn===me&&prev.turn!==me&&ph==="betting"&&v.players[me]&&!v.players[me].folded&&!v.players[me].allin){try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}}
  const prevMax=Math.max(0,...((prev.dms||[]).map(m=>m.id)));
  const incoming=(v.dms||[]).filter(m=>m.id>prevMax&&m.to===me&&prev.players&&prev.players.length);
  render();
  if(incoming.length)chatIncoming(incoming[incoming.length-1]);
  if(ph==="market")setTimeout(maybeTradePrompt,prev.phase!=="market"?800:0);
  renderChat();
  if(ph==="result"&&prev.phase!=="result"){const sh=v._show;if(sh&&sh.winners&&sh.winners.length){sh.winners.includes(me)?SFX.win():SFX.lose();
    requestAnimationFrame(()=>{const r=document.querySelector(`.srow[data-row="${sh.winners[0]}"]`);if(r){const b=r.getBoundingClientRect();FX.burst(b.left+40,b.top+b.height/2,36);}});}}
  if(ph==="over"&&prev.phase!=="over"){SFX.win();setTimeout(()=>FX.burst(innerWidth/2,innerHeight*.3,90),200);}
}

  return `<div class="chat-head"><div class="ch-title">Messages</div><button class="chat-x" data-act="chatClose" aria-label="Close messages">✕</button></div>
   <div class="chat-list">${rows}</div><p class="chat-note">Messages are private between the two of you.</p>`;}
function chatMsgsHTML(seat){const me=ME();const th=chatThread(seat);if(!th.length)return `<div class="chat-empty">No messages yet. Only ${esc(S.players[seat].name)} will see what you send.</div>`;
  let out="",lastT=0;th.forEach((m,j)=>{if(m.t-lastT>5*60e3)out+=`<div class="chat-stamp">${chatTime(m.t)}</div>`;lastT=m.t;
    const mine=m.f===me;const nextSame=th[j+1]&&th[j+1].f===m.f&&th[j+1].t-m.t<5*60e3;
    out+=`<div class="bub ${mine?"me":"them"} ${nextSame?"grouped":""}">${esc(m.x)}</div>`;});return out;}
function chatConvoHeadHTML(seat){const p=S.players[seat];const on=S.conn&&S.conn[seat];
  return `<button class="chat-back" data-act="chatBack" aria-label="Back to all messages">‹</button>
   <span class="cc-pt">${portrait(p,34)}<i class="dot ${on?"on":""}"></i></span>
   <div class="ch-who"><b>${esc(p.name)}</b><small>${on?"At the table":"Away"}</small></div>
   <button class="chat-x" data-act="chatClose" aria-label="Close messages">✕</button>`;}
function renderChat(){const root=$("chat");if(!root)return;
  if(!chatVisible()){root.innerHTML="";document.body.classList.remove("has-chat");return;}
  document.body.classList.add("has-chat");
  if(!root.querySelector(".chat-fab"))root.innerHTML=`<button class="chat-fab" data-act="chatOpen" aria-label="Messages">${chatIconSVG()}<i class="badge" hidden></i></button><div class="chat-panel" role="dialog" aria-label="Messages" hidden></div><div class="chat-toast" hidden></div>`;
  const fab=root.querySelector(".chat-fab"),badge=fab.querySelector(".badge"),panel=root.querySelector(".chat-panel");
  if(U.chatOpen&&U.chatWith!=null&&!S.players[U.chatWith])U.chatWith=null;
  if(U.chatOpen&&U.chatWith!=null)chatMarkRead(U.chatWith);
  const un=chatUnreadTotal();badge.hidden=!un;badge.textContent=un>9?"9+":un;fab.hidden=!!U.chatOpen;
  if(!U.chatOpen){panel.hidden=true;panel.dataset.view="";return;}
  panel.hidden=false;
  if(U.chatWith==null){panel.dataset.view="list";panel.innerHTML=chatListHTML();return;}
  const seat=U.chatWith;
  if(panel.dataset.view!=="c"+seat){panel.dataset.view="c"+seat;
    panel.innerHTML=`<div class="chat-head">${chatConvoHeadHTML(seat)}</div><div class="chat-msgs" id="chatmsgs">${chatMsgsHTML(seat)}</div>
     <div class="chat-quick">${CHAT_QUICK.map(q=>`<button data-act="chatQuick" data-arg="${esc(q)}">${esc(q)}</button>`).join("")}</div>
     <form class="chat-compose" data-chatform><input id="chatin" autocomplete="off" maxlength="${DM_MAX}" placeholder="Message ${esc(S.players[seat].name)}" aria-label="Message"><button type="submit" class="chat-send" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-2-7.5z" fill="currentColor"/></svg></button></form>`;
    const box=$("chatmsgs");box.scrollTop=box.scrollHeight;return;}
  const box=$("chatmsgs");const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  panel.querySelector(".chat-head").innerHTML=chatConvoHeadHTML(seat);box.innerHTML=chatMsgsHTML(seat);if(nearBottom)box.scrollTop=box.scrollHeight;}
function chatIncoming(m){const p=S.players[m.f];if(!p)return;
  if(U.chatOpen&&U.chatWith===m.f){SFX.tap();return;}
  SFX.coin();try{navigator.vibrate&&navigator.vibrate([40,40,40]);}catch(e){}
  const t=document.querySelector("#chat .chat-toast");if(!t)return;
  t.innerHTML=`<button data-act="chatWith" data-arg="${m.f}">${portrait(p,34)}<span><b>${esc(p.name)}</b><span>${esc(m.x)}</span></span></button>`;t.hidden=false;t.classList.remove("show");void t.offsetWidth;t.classList.add("show");
  clearTimeout(chatIncoming._t);chatIncoming._t=setTimeout(()=>{t.hidden=true;},4500);}
function chatSendText(text){text=String(text||"").trim();if(!text||U.chatWith==null)return;send({type:"dm",to:U.chatWith,text});}
Object.assign(ACT,{
  chatOpen(){U.chatOpen=true;renderChat();},
  chatClose(){U.chatOpen=false;renderChat();},
  chatBack(){U.chatWith=null;renderChat();},
  chatWith(i){U.chatOpen=true;U.chatWith=+i;const t=document.querySelector("#chat .chat-toast");if(t)t.hidden=true;renderChat();setTimeout(()=>{const n=$("chatin");if(n&&matchMedia("(hover:hover)").matches)n.focus();},50);},
  chatQuick(q){chatSendText(q);},
});
if(typeof document!=="undefined")document.addEventListener("submit",e=>{if(!e.target.matches||!e.target.matches("[data-chatform]"))return;e.preventDefault();
  const n=$("chatin");if(!n)return;chatSendText(n.value);n.value="";n.focus();});

/* After a reload (or the phone discarding the tab), jump straight back into the game you were in. */
function autoRejoin(){const a=lsGet("mt-active");if(!a||!a.code||Date.now()-(a.at||0)>6*3600e3||!peerAvailable())return false;
  const room=roomFromURL();if(room&&room!==a.code)return false;
  if(a.role==="host"){const hs=lsGet("mt-host");if(!hs||hs.code!==a.code||!hs.real||hs.real.phase==="over")return false;hostCreate(true);toast("Reopened your table "+a.code);return true;}
  if(a.role==="guest"){const gs=lsGet("mt-guest");if(!gs||gs.code!==a.code)return false;guestJoin(a.code);toast("Rejoining table "+a.code+"…");return true;}
  return false;}
