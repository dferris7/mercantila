<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#110C08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Merchant's Table">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>The Merchant's Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700;800;900&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#110C08; --walnut:#2A1A10; --walnut-2:#3B2618; --walnut-3:#523522;
  --baize:#1E3B32; --baize-lit:#2F5B4C; --baize-deep:#10231D;
  --brass:#C9A45C; --brass-hi:#EDD394; --brass-lo:#86672F;
  --candle:#F4C065; --wax:#9E3527; --wax-hi:#C75640;
  --parch:#F0E5CC; --parch-2:#E2D1AC; --parch-3:#CDB887; --ink:#2A1D12; --ink-soft:#6A563F;
  --text:#F2E7D0; --text-soft:#BCA986; --text-dim:#8D7C60;
  --up:#86BD6E; --down:#EC7A62; --up-ink:#3E7536; --down-ink:#A5392A;
  --display:'Cinzel',Georgia,'Times New Roman',serif;
  --deco:'Cinzel Decorative','Cinzel',Georgia,serif;
  --body:'Spectral',Georgia,'Times New Roman',serif;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
input{font:inherit}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:
   radial-gradient(ellipse 70% 55% at 50% 42%,rgba(244,192,101,.10),transparent 70%),
   radial-gradient(ellipse 120% 100% at 50% 0%,#3A2517 0%,#1E140D 55%,#0E0906 100%)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#bar{position:relative;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,rgba(20,13,8,.92),rgba(20,13,8,.55));border-bottom:1px solid rgba(201,164,92,.22)}
#bar[hidden]{display:none!important}
.mark{font-family:var(--deco);font-weight:900;font-size:15px;color:var(--brass-hi);letter-spacing:.02em;white-space:nowrap}
.bar-meta{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar-meta b{color:var(--brass-hi);font-weight:700}
.bar-sp{flex:1}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(201,164,92,.35);
  font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-hi);background:rgba(201,164,92,.07)}
.ibtn:hover{background:rgba(201,164,92,.16)}
.ibtn svg{width:16px;height:16px}
.ibtn .lbl{display:inline}
@media (max-width:620px){.ibtn .lbl{display:none}.ibtn{padding:0 10px}.mark{display:none}}

#view{position:relative;z-index:5;flex:1;min-height:0;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1040px;margin:0 auto}

/* ---------- type ---------- */
.eyebrow{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--brass)}
.h1{font-family:var(--deco);font-weight:900;font-size:clamp(40px,8vw,84px);line-height:.98;letter-spacing:.01em;margin:0;color:var(--text);text-wrap:balance;
  text-shadow:0 2px 0 #0008,0 0 40px rgba(244,192,101,.25)}
.h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.6vw,32px);line-height:1.1;margin:0;text-wrap:balance}
.h3{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;margin:0}
.soft{color:var(--text-soft)} .dim{color:var(--text-dim)}
.it{font-style:italic}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:10px;
  font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;transition:transform .08s,filter .15s,box-shadow .15s}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{opacity:.38;filter:saturate(.5)}
.btn-gold{color:#2B1A08;background:linear-gradient(180deg,#F7D98C,#E0AE4E 55%,#C38E33);box-shadow:inset 0 1px 0 #fff8,0 4px 0 #7A5720,0 10px 22px -8px #000}
.btn-gold:hover:not(:disabled){filter:brightness(1.06)}
.btn-wax{color:#FBEBD8;background:linear-gradient(180deg,#C85B45,#9E3527);box-shadow:inset 0 1px 0 #fff4,0 4px 0 #5E1C13,0 10px 22px -8px #000}
.btn-line{color:var(--brass-hi);border:1px solid rgba(201,164,92,.45);background:rgba(201,164,92,.06)}
.btn-line:hover:not(:disabled){background:rgba(201,164,92,.15)}
.btn-ink{color:var(--ink);border:1px solid rgba(42,29,18,.35);background:rgba(42,29,18,.06)}
.btn-ink:hover:not(:disabled){background:rgba(42,29,18,.12)}
.btn-sm{min-height:36px;padding:0 14px;font-size:12px}
.btn.armed{animation:armpulse .8s ease-in-out infinite;filter:brightness(1.12)}
@keyframes armpulse{50%{box-shadow:0 0 0 4px rgba(244,192,101,.45),0 4px 0 #5E1C13}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}

/* ---------- parchment ledger panels ---------- */
.ledger{background:
   radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),transparent 60%),
   linear-gradient(180deg,var(--parch),var(--parch-2));
  color:var(--ink);border-radius:14px;padding:22px;position:relative;
  box-shadow:0 30px 60px -24px #000,inset 0 0 0 1px rgba(134,103,47,.35),inset 0 0 60px rgba(134,103,47,.18)}
.ledger::before{content:"";position:absolute;inset:7px;border:1px solid rgba(134,103,47,.35);border-radius:9px;pointer-events:none}
.ledger .eyebrow{color:var(--wax)}
.ledger .soft{color:var(--ink-soft)}
.rise{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- dice ---------- */
.die{display:inline-block;width:52px;height:54px;position:relative;flex:none;filter:drop-shadow(0 5px 4px rgba(0,0,0,.45))}
.die svg{width:100%;height:100%;display:block;overflow:visible}
.die.sm{width:30px;height:31px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.die.md{width:40px;height:42px}
.die.lg{width:76px;height:79px}
.die.dimmed{opacity:.35;filter:grayscale(.6)}
.die.glow{filter:drop-shadow(0 0 6px rgba(244,192,101,.9)) drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.die.pickable{cursor:pointer;transition:transform .12s}
.die.pickable:hover{transform:translateY(-4px) scale(1.06)}
.die.rolling{animation:tumble .7s cubic-bezier(.25,.9,.35,1.15) both}
@keyframes tumble{
  0%{transform:translate(-60px,-50px) rotate(-260deg) scale(.4);opacity:0}
  55%{transform:translate(4px,4px) rotate(18deg) scale(1.12);opacity:1}
  75%{transform:translate(-2px,-3px) rotate(-8deg) scale(.97)}
  100%{transform:none;opacity:1}}
.slot{width:52px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(0,0,0,.28),rgba(0,0,0,.08) 60%,transparent 70%)}
.dice{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}

/* ---------- commodity chips & icons ---------- */
.ic{display:inline-block;width:20px;height:20px;vertical-align:-4px;flex:none}
.ic svg{width:100%;height:100%;display:block}

/* ---------- title ---------- */
.title-screen{min-height:100%;display:grid;place-items:center;text-align:center}
.title-screen .inner{max-width:720px;display:grid;gap:22px;justify-items:center;padding:24px 0}
.title-dice{display:flex;gap:12px;justify-content:center;min-height:80px}
.lede{font-size:clamp(16px,2.1vw,19px);color:var(--text-soft);max-width:60ch;margin:0 auto}
.seal{width:84px;height:84px}

/* ---------- setup ---------- */
.setup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{background:rgba(255,255,255,.35);border:1px solid rgba(134,103,47,.3);border-radius:12px;padding:14px;display:grid;gap:10px;justify-items:center}
.pcard input{width:100%;text-align:center;font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid rgba(134,103,47,.45);padding:6px 4px}
.pcard input:focus{outline:none;border-bottom-color:var(--wax)}
.pick-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pick-row button{border-radius:50%;padding:2px;border:2px solid transparent;line-height:0}
.pick-row button[aria-pressed="true"]{border-color:var(--wax)}
.sw{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}
.chips-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:48px;height:44px;padding:0 14px;border-radius:10px;font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink);
  border:1px solid rgba(134,103,47,.45);background:rgba(255,255,255,.3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--parch);border-color:var(--ink)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cfg-box{border:1px solid rgba(134,103,47,.35);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:rgba(255,255,255,.18)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(134,103,47,.5);font-size:20px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.35)}
.stepper b{font-family:var(--display);font-weight:900;font-size:24px;min-width:70px;text-align:center;color:var(--wax)}
.label{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.toggle{display:inline-flex;border:1px solid rgba(134,103,47,.5);border-radius:10px;overflow:hidden}
.toggle button{padding:8px 14px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--ink)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--parch)}

/* ---------- market ---------- */
.market-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.market-top{grid-template-columns:1fr}}
.ecard{perspective:900px}
.ecard .face{background:linear-gradient(180deg,#F5EBD3,#E4D2AA);color:var(--ink);border-radius:14px;padding:18px 20px 16px;position:relative;
  box-shadow:0 24px 50px -20px #000,inset 0 0 0 1px rgba(134,103,47,.4),inset 0 0 0 6px rgba(240,229,204,.7),inset 0 0 0 7px rgba(134,103,47,.35);
  animation:flipin .6s cubic-bezier(.2,.8,.3,1) both;transform-origin:50% 50%}
@keyframes flipin{from{transform:rotateY(80deg) translateY(-10px);opacity:.001}to{transform:none;opacity:1}}
.ecard .kind{display:flex;align-items:center;gap:10px}
.ecard .glyph{width:54px;height:54px;flex:none}
.ecard .t{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.ecard .etext{font-style:italic;font-size:15.5px;margin:10px 0 0;color:#3E2C1B}
.ecard .eff{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(134,103,47,.55);font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--wax)}
.moves{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mv{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;padding:2px 8px;border-radius:999px;background:rgba(42,29,18,.07)}
.mv.u{color:var(--up-ink)} .mv.d{color:var(--down-ink)}
.choice{display:grid;gap:8px;margin-top:12px}
.choice button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,.45);
  border:1px solid rgba(134,103,47,.4);color:var(--ink);font-family:var(--display);font-weight:700;font-size:14px;text-align:left}
.choice button:hover{background:rgba(255,255,255,.75);border-color:var(--wax)}
.choice .s{font-family:var(--body);font-style:italic;font-weight:500;font-size:13px;color:var(--ink-soft)}

.ticker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.ticker{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tk{border-radius:12px;padding:10px 12px 8px;background:linear-gradient(180deg,rgba(59,38,24,.92),rgba(42,26,16,.92));border:1px solid rgba(201,164,92,.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tk .hd{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--text)}
.tk .pr{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.tk .pr b{font-family:var(--display);font-weight:900;font-size:26px;color:var(--brass-hi)}
.tk .pr .u{color:var(--up);font-weight:700;font-size:13px} .tk .pr .d{color:var(--down);font-weight:700;font-size:13px} .tk .pr .z{color:var(--text-dim);font-size:13px}
.tk .trend{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);font-family:var(--display);font-weight:700}
.tk .pw{margin-top:6px;padding-top:6px;border-top:1px solid rgba(201,164,92,.18);font-size:12px;color:var(--text-soft)}
.tk .pw b{color:var(--candle);font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.04em}
.spark{display:block;width:100%;height:34px;margin-top:4px}

.merchants{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:16px}
.mcard{border-radius:12px;background:rgba(42,26,16,.85);border:1px solid rgba(201,164,92,.22);padding:10px 12px;display:grid;gap:8px}
.mcard .top{display:flex;align-items:center;gap:10px}
.mcard .nm{font-family:var(--display);font-weight:800;font-size:15px}
.mcard .w{font-size:12.5px;color:var(--text-soft)}
.mcard .w b{color:var(--brass-hi);font-family:var(--display)}
.holdrow{display:flex;gap:8px;flex-wrap:wrap}
.holdrow span{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px;color:var(--text)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.tag.ok{background:rgba(134,189,110,.16);color:var(--up)}
.tag.warn{background:rgba(236,122,98,.16);color:var(--down)}
.tag.gold{background:rgba(244,192,101,.16);color:var(--candle)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.foot-cta{position:sticky;bottom:0;margin-top:18px;padding:14px 0 4px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;
  background:linear-gradient(180deg,transparent,rgba(17,12,8,.94) 40%)}
.foot-cta p{margin:0;font-size:13.5px;color:var(--text-soft);max-width:52ch;text-align:center}

/* ---------- table ---------- */
.table-screen{display:grid;gap:14px;max-width:1080px;margin:0 auto}
.arena{position:relative;height:clamp(460px,62vh,600px)}
.felt{position:absolute;z-index:1;left:17%;right:17%;top:18%;bottom:18%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,var(--baize-lit),var(--baize) 55%,var(--baize-deep) 100%);
  box-shadow:0 0 0 10px #4A2F1C,0 0 0 12px var(--brass-lo),0 0 0 22px #2E1D11,0 0 0 23px rgba(201,164,92,.4),0 40px 80px -20px #000,inset 0 0 60px rgba(0,0,0,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.felt::before{content:"";position:absolute;inset:18px;border-radius:50%;border:1px dashed rgba(237,211,148,.22);pointer-events:none}
.felt .street{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(237,211,148,.8)}
.felt .board{display:flex;gap:10px;align-items:center;justify-content:center}
.pot{display:flex;align-items:center;gap:10px;justify-content:center}
.pot .coins{width:54px;height:44px}
.pot b{font-family:var(--display);font-weight:900;font-size:clamp(22px,3vw,30px);color:var(--brass-hi);text-shadow:0 2px 0 #0007}
.pot .sub{display:block;font-size:12px;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;color:rgba(242,231,208,.7)}
.seat{position:absolute;z-index:3;width:156px;transform:translate(-50%,-50%);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;
  background:linear-gradient(180deg,rgba(52,33,21,.96),rgba(33,21,13,.96));border:1px solid rgba(201,164,92,.28);box-shadow:0 10px 24px -10px #000;transition:box-shadow .2s,opacity .2s}
.seat .pt{grid-row:span 3;line-height:0;position:relative}
.seat .nm{font-family:var(--display);font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .fl{font-family:var(--display);font-weight:800;font-size:14px;color:var(--brass-hi)}
.seat .st{font-size:11.5px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.turn{box-shadow:0 0 0 2px var(--candle),0 0 28px rgba(244,192,101,.45),0 10px 24px -10px #000}
.seat.folded{opacity:.5}
.seat .boast{grid-column:1/-1;margin-top:4px;font-size:11.5px;font-weight:700;color:#FFD9C9;background:rgba(158,53,39,.55);border:1px solid rgba(199,86,64,.6);border-radius:6px;padding:2px 6px}
.dealer{position:absolute;right:-6px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:linear-gradient(180deg,#FFF3D6,#D9C08A);color:#3A2710;font-family:var(--display);font-weight:900;font-size:11px;display:grid;place-items:center;box-shadow:0 2px 4px #0008;line-height:1}
.bet-chip{grid-column:1/-1;font-size:11.5px;color:var(--candle);font-weight:700}
@media (max-width:760px){
  .arena{height:auto;display:grid;gap:10px}
  .seats-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}
  .seat{position:relative;transform:none;left:auto!important;top:auto!important;flex:none;width:150px;scroll-snap-align:start}
  .felt{position:relative;inset:auto;border-radius:36px;padding:26px 10px;min-height:220px;box-shadow:0 0 0 6px #4A2F1C,0 0 0 8px var(--brass-lo),0 20px 40px -16px #000,inset 0 0 40px rgba(0,0,0,.5)}
  .felt::before{inset:10px;border-radius:28px}
  .felt .board{gap:6px}
  .felt .die,.felt .slot{width:46px;height:48px}
}
@media (min-width:761px){.seats-strip{display:contents}}
@media (max-width:760px){.foot-cta:not(.mpfoot){position:static;background:none}.mpfoot{gap:8px;padding-top:10px}.mpfoot p{font-size:12.5px}}

.tray{border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,rgba(58,37,24,.97),rgba(34,22,14,.97));border:1px solid rgba(201,164,92,.3);
  box-shadow:0 -10px 40px -20px #000,inset 0 1px 0 rgba(255,255,255,.05);display:grid;gap:12px}
.tray .who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tray .who .nm{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.1}
.tray .who .meta{font-size:13px;color:var(--text-soft)}
.tray .who .meta b{color:var(--brass-hi);font-family:var(--display)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 130px}

<div id="app"><canvas id="fx" aria-hidden="true"></canvas><header id="bar" hidden></header><main id="view"></main></div>
<div id="sheet"></div><div id="peek"></div><div id="toast" role="status" aria-live="polite"></div>
<script>/* ======================================================================
   THE MERCHANT'S TABLE · ENGINE  (v2)
   Pure game logic. No DOM access anywhere in this section.
   Hard invariants: all money is integer · prices stay 5..15 · nobody is
   eliminated · every florin is conserved (pledges tracked in S._injected).
   ====================================================================== */

const COMM=[
 {k:"wheat", n:"Wheat",  col:"#D9A93A", cost:2, ab:"Spoil the Stock", abd:"Re-roll one community die.",               scope:"public"},
 {k:"wood",  n:"Wood",   col:"#8E5B33", cost:2, ab:"Whittle",         abd:"Nudge one community die up or down 1.",    scope:"publicSign"},
 {k:"brick", n:"Brick",  col:"#B4513A", cost:2, ab:"Recast",          abd:"Re-roll one of your private dice.",        scope:"private"},
 {k:"ore",   n:"Ore",    col:"#6F7C8A", cost:2, ab:"Temper",          abd:"Nudge one of your private dice up or down 1.",scope:"privateSign"},
 {k:"silver",n:"Silver", col:"#B9C2CC", cost:1, ab:"Insider Word",    abd:"Secretly preview the next community die.", scope:"peek"},
 {k:"gold",  n:"Gold",   col:"#E6BC4F", cost:2, ab:"Sellsword",       abd:"Gain a third private die this hand.",      scope:"adddie"},
];
const CKEYS=COMM.map(c=>c.k);
const CMAP={};COMM.forEach(c=>CMAP[c.k]=c);
const WORLD="Mercantila";
const START_FL=100;
const START_PORT={wheat:5,wood:5,brick:5,ore:5,silver:5,gold:5};
const ANTE=5, MINBET=5;
const SELL_FEE=0.05, BROKE_FEE=0.10, PLEDGE_RATE=0.50, BOAST_CAP=0.25;

/* Hand ranks, weakest → strongest, ordered by how rare each is with 7d8.
   v2 change: Straight (11% of 7-dice hands) now beats Full House (22%). */
const RANK_NAMES=["High Die","One Pair","Two Pair","Three of a Kind","Full House","Straight","Four of a Kind","Five of a Kind"];
const RK={HIGH:0,PAIR:1,TWO:2,TRIPS:3,FULL:4,STRAIGHT:5,QUADS:6,FIVE:7};
/* Boast tiers. pay=[a,b]: a challenger who loses pays stake × a/b. The odds
   are near-fair for a blind boast (at-least chance with 7 dice shown as pct). */
const HAND_TIERS=[
 {t:RK.TRIPS,   n:"Three of a Kind", pay:[1,1], pct:46},
 {t:RK.FULL,    n:"a Full House",    pay:[3,2], pct:36},
 {t:RK.STRAIGHT,n:"a Straight",      pay:[4,1], pct:16},
 {t:RK.QUADS,   n:"Four of a Kind",  pay:[15,1],pct:5},
];
const tierOf=t=>HAND_TIERS.find(x=>x.t===t);

let S={screen:"title",players:[],count:3,totalHands:10,target:525,targetAuto:true,handNo:0,dealer:0,
  prices:{},trend:{},history:{},board:[],reveal:0,street:0,currentBet:0,lastRaiser:0,turn:-1,pot:0,
  challenges:{},_injected:0,_show:null,_endReason:null,_finalMove:null,eventCard:null,pendingChoice:null,
  eventOrder:null,eventPos:0,phase:"idle",numerals:"arabic"};

const sum=a=>a.reduce((x,y)=>x+y,0);
const rng=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rollDie=()=>rng(1,8);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clampDie=v=>Math.max(1,Math.min(8,v));
const holdingsValue=p=>sum(CKEYS.map(k=>(p.port[k]||0)*S.prices[k]));
const wealth=p=>p.fl+(p.escrow||0)+holdingsValue(p);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------------------------- MARKET ---------------------------- */
const PMIN=5, PMAX=15, PERSIST=0.62;
const REGIMES=["rising","falling","calm","swingy"];
function regimeStep(r){
  if(r==="rising")return rng(1,3);
  if(r==="falling")return -rng(1,3);
  if(r==="swingy")return rng(-3,3);
  return rng(-1,1);
}
function nextRegime(){const x=Math.random();return x<0.25?"calm":x<0.525?"rising":x<0.80?"falling":"swingy";}
function clampPrice(v){return Math.max(PMIN,Math.min(PMAX,Math.round(v)));}
function evolveMarket(){
  CKEYS.forEach(k=>{
    let r=S.trend[k];const pr=S.prices[k];
    const atTop=pr>=PMAX-1&&r==="rising", atBot=pr<=PMIN+1&&r==="falling";
    const flip=(atTop||atBot)?0.7:(1-PERSIST);
    if(Math.random()<flip){let nr=nextRegime();if(atTop&&nr==="rising")nr="falling";if(atBot&&nr==="falling")nr="rising";r=nr;}
    S.trend[k]=r;S.prices[k]=clampPrice(pr+regimeStep(r));S.history[k].push(S.prices[k]);
  });
}
function syncHistory(k){const h=S.history[k];if(h&&h.length)h[h.length-1]=S.prices[k];}
function shiftPrice(k,a){S.prices[k]=clampPrice(S.prices[k]+a);syncHistory(k);}

/* ---------------------------- EVENTS ---------------------------- */
const GROUPS={staples:["wheat","wood"],metals:["brick","ore"],luxuries:["silver","gold"]};
const GRPNAME={staples:"Staples (wheat & wood)",metals:"Metals (brick & ore)",luxuries:"Luxuries (silver & gold)"};
const EVENTS=[
  {t:"Dragon's Awakening",k:"one",c:"gold",a:4,x:"A wyrm wakes beneath the Brass Quarter and hoards every ingot it can find. Gold grows scarce and dear."},
  {t:"Goldsmiths' Strike",k:"one",c:"gold",a:3,x:"The goldsmiths down their tools and finished gold vanishes from the stalls."},
  {t:"Wheat Blight",k:"one",c:"wheat",a:-4,x:"A black rot creeps through the granaries. Wheat is dumped before it spoils."},
  {t:"Bumper Harvest",k:"one",c:"wheat",a:-3,x:"Fields groan with grain after a golden summer, and wheat floods every market."},
  {t:"Silver Vein Struck",k:"one",c:"silver",a:-4,x:"Prospectors hit a vast vein in the northern hills. Silver pours downriver."},
  {t:"King's Armorers",k:"one",c:"ore",a:4,x:"The crown's armorers buy ore by the cartload ahead of a campaign."},
  {t:"Iron Glut",k:"one",c:"ore",a:-3,x:"A war winds down and leaves the foundries overstocked. Ore prices sag."},
  {t:"The Great Fire",k:"one",c:"wood",a:4,x:"Half the timber yards burn in a night. Sound wood commands a premium."},
  {t:"Quarry Collapse",k:"one",c:"brick",a:4,x:"The river floods the great quarry and brick turns scarce overnight."},
  {t:"Masons' Holiday",k:"one",c:"brick",a:-3,x:"A building moratorium idles the masons while brick stockpiles swell."},
  {t:"War Drums",k:"grp",g:"metals",a:3,x:"Drums sound on the frontier. Every smith and quartermaster scrambles for metal."},
  {t:"Peace Accord",k:"grp",g:"metals",a:-3,x:"A truce is signed and the great armories sell off their metal reserves."},
  {t:"Sumptuary Laws",k:"grp",g:"luxuries",a:-3,x:"The crown forbids common folk from flaunting finery. Luxuries lose their lustre."},
  {t:"Royal Wedding",k:"grp",g:"luxuries",a:3,x:"A lavish royal wedding sets every noble house bidding for silver and gold."},
  {t:"Famine",k:"grp",g:"staples",a:3,x:"A failed harvest grips the realm. Bread and timber turn precious."},
  {t:"Season of Plenty",k:"grp",g:"staples",a:-3,x:"Mild weather and full barns send staple prices tumbling."},
  {t:"A Golden Age",k:"allU",a:2,x:"A decade of peace and plenty lifts every market in the realm alike."},
  {t:"The Great Plague",k:"allU",a:-2,x:"Pestilence empties the streets and demand collapses evenly across the board."},
  {t:"Royal Jubilee",k:"allU",a:1,x:"The crown's jubilee loosens every purse. All goods tick upward together."},
  {t:"Hard Winter",k:"allU",a:-1,x:"A cruel winter slows every road and dampens every trade alike."},
  {t:"Market Boom",k:"allV",d:1,lo:1,hi:4,x:"Speculative fever sweeps the exchange. Every commodity climbs, though none alike."},
  {t:"Market Panic",k:"allV",d:-1,lo:1,hi:4,x:"A bank fails at dawn and panic spreads. Prices tumble unevenly across the board."},
  {t:"Speculative Frenzy",k:"allV",d:1,lo:1,hi:3,x:"Rumor and greed inflate the whole market in ragged fits and starts."},
  {t:"Credit Crunch",k:"allV",d:-1,lo:1,hi:3,x:"Lenders call in their debts and the market sags in uneven steps."},
  {t:"Spoilage",k:"resAll",g:"staples",a:-3,x:"Damp rot tears through the warehouses. Perishable stock is lost by the cartload."},
  {t:"Black Frost",k:"resAll",g:"any",a:-3,x:"A killing frost ruins goods in every storehouse across the realm."},
  {t:"Bountiful Shipment",k:"resAll",g:"any",a:3,x:"A fat merchant convoy arrives and every house takes delivery of fresh stock."},
  {t:"Smuggler's Cache",k:"resRole",r:"poor",g:"luxuries",a:4,x:"A smuggler slips the poorest merchant a heavy crate of contraband finery."},
  {t:"Warehouse Fire",k:"resRole",r:"rich",g:"any",a:-4,x:"Flames gut a wing of the richest merchant's warehouse."},
  {t:"Caravan Tribute",k:"resGive",r:"rich",val:45,take:false,x:"The wealthiest house must load a rival's wagons with a small fortune in one commodity."},
  {t:"Privateer's Raid",k:"resGive",r:"poor",val:45,take:true,x:"The leanest merchant turns corsair and plunders a fortune of one commodity from a chosen rival."},
  {t:"Levy in Kind",k:"resGive",r:"rich",val:35,take:false,x:"The guild collects its dues in goods. The richest ships a chosen merchant a haul of stock."},
  {t:"Caravan Waylaid",k:"resGive",r:"poor",val:35,take:true,x:"Bandits in the poorest merchant's pay waylay a rival's caravan and haul off its goods."},
  {t:"Crown Patent",k:"decree",r:"rich",dir:1,amt:4,x:"The wealthiest lord secures a royal patent and drives one commodity of their choice sharply upward."},
  {t:"Cornering the Market",k:"decree",r:"rich",dir:1,amt:3,x:"The richest merchant quietly hoards a chosen good until its price leaps."},
  {t:"Market Sabotage",k:"decree",r:"poor",dir:-1,amt:4,x:"The leanest merchant floods the stalls with cheap stock and crashes a commodity of their choice."},
  {t:"Guild Undercut",k:"decree",r:"poor",dir:-1,amt:3,x:"The poorest house undercuts every price on one chosen commodity."},
];
const TARGETING={resRole:1,resGive:1,decree:1};
function shuffleEvents(){S.eventOrder=shuffle(EVENTS.map((_,i)=>i));S.eventPos=0;}
function drawEvent(){

const community=()=>S.board.slice(0,S.reveal);

function legal(){

/* ---------------------------- EVALUATION ---------------------------- */
function evalHand(dice){
  const cnt=new Array(9).fill(0);dice.forEach(d=>cnt[d]++);
  const FACES=[8,7,6,5,4,3,2,1];
  let straightTop=0;for(let top=5;top<=8;top++){let ok=true;for(let f=top-4;f<=top;f++)if(!cnt[f]){ok=false;break;}if(ok)straightTop=top;}
  const at=n=>FACES.filter(f=>cnt[f]>=n);
  const fives=at(5),quads=at(4),trips=at(3),pairs=at(2);
  const pool=dice.slice().sort((a,b)=>b-a);
  const kick=(excl,n)=>pool.filter(d=>!excl.includes(d)).slice(0,n);
  const fhPair=trips.length?FACES.filter(f=>f!==trips[0]&&cnt[f]>=2):[];
  let rank,score;
  if(fives.length){rank=RK.FIVE;score=[rank,fives[0]];}
  else if(quads.length){rank=RK.QUADS;score=[rank,quads[0],...kick([quads[0]],1)];}
  else if(straightTop){rank=RK.STRAIGHT;score=[rank,straightTop];}
  else if(trips.length&&fhPair.length){rank=RK.FULL;score=[rank,trips[0],fhPair[0]];}
  else if(trips.length){rank=RK.TRIPS;score=[rank,trips[0],...kick([trips[0]],2)];}
  else if(pairs.length>=2){rank=RK.TWO;score=[rank,pairs[0],pairs[1],...kick([pairs[0],pairs[1]],1)];}
  else if(pairs.length===1){rank=RK.PAIR;score=[rank,pairs[0],...kick([pairs[0]],3)];}
  else{rank=RK.HIGH;score=[rank,...pool.slice(0,5)];}
  const s=score;let best,detail;
  if(rank===RK.FIVE){best=[s[1],s[1],s[1],s[1],s[1]];detail=`five ${s[1]}s`;}
  else if(rank===RK.QUADS){best=[s[1],s[1],s[1],s[1]].concat(s[2]?[s[2]]:[]);detail=s[2]?`four ${s[1]}s, ${s[2]} kicker`:`four ${s[1]}s`;}
  else if(rank===RK.STRAIGHT){best=[s[1],s[1]-1,s[1]-2,s[1]-3,s[1]-4];detail=`${s[1]-4}–${s[1]} run`;}
  else if(rank===RK.FULL){best=[s[1],s[1],s[1],s[2],s[2]];detail=`${s[1]}s over ${s[2]}s`;}
  else if(rank===RK.TRIPS){best=[s[1],s[1],s[1]].concat(s.slice(2));detail=`three ${s[1]}s`;}
  else if(rank===RK.TWO){best=[s[1],s[1],s[2],s[2]].concat(s.slice(3));detail=`${s[1]}s & ${s[2]}s`+(s[3]?`, ${s[3]} kicker`:"");}
  else if(rank===RK.PAIR){best=[s[1],s[1]].concat(s.slice(2));detail=`pair of ${s[1]}s`;}
  else{best=s.slice(1,6);detail=`${s[1]} high`;}

}
function cmp(a,b){for(let i=0;i<Math.max(a.score.length,b.score.length);i++){const x=a.score[i]||0,y=b.score[i]||0;if(x!==y)return y-x;}return 0;}

function bestAmong(idxs){const ev=idxs.map(i=>({i,e:bestOf(S.players[i])}));ev.sort((a,b)=>cmp(a.e,b.e));

/* ---------------------------- POTS ---------------------------- */
function buildPots(){
  const contrib=S.players.map(p=>p.totalIn||0);
  const levels=[...new Set(contrib.filter(c=>c>0))].sort((a,b)=>a-b);
  const pots=[];let prev=0;
  for(const L of levels){let amount=0;const eligible=[];
    S.players.forEach((p,i)=>{if(contrib[i]>=L){amount+=(L-prev);if(!p.folded)eligible.push(i);}});
    if(pots.length&&pots[pots.length-1].eligible.join()===eligible.join())pots[pots.length-1].amount+=amount; // merge identical layers

    // odd florins go to the tied winner(s) nearest the dealer's left

    order.forEach(wi=>{S.players[wi].fl+=share+(rem>0?1:0);if(rem>0)rem--;});

}

/* ---------------------------- TRADE ---------------------------- */
function tradeQuote(p,t){
  if(t.mode==="buy"){const q=Math.floor(t.q||0),pr=S.prices[t.k];return {gross:q*pr,fee:0,net:q*pr,ok:q>=1&&p.fl>=q*pr,kinds:1};}

function doTrade(p,t){

/* ---------------------------- POWERS ---------------------------- */
function abilityReady(p,key){

function doAbility(p,key,params){

  else if(key==="wood")S.board[pubIdx]=clampDie(S.board[pubIdx]+(params.sign>0?1:-1));
  else if(key==="brick")p.priv[privIdx]=rollDie();
  else if(key==="ore")p.priv[privIdx]=clampDie(p.priv[privIdx]+(params.sign>0?1:-1));

/* ======================================================================
   MULTIPLAYER CORE (DOM-free). The host phone holds the real game state;
   every phone, the host's included, renders a redacted VIEW of it.
   ====================================================================== */
const ROOM_ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ";
function newRoomCode(){let s="";for(let i=0;i<4;i++)s+=ROOM_ALPHA[Math.floor(Math.random()*ROOM_ALPHA.length)];return s;}
function randToken(){let s="";for(let i=0;i<16;i++)s+="abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(Math.random()*36)];return s;}

/* host-side bookkeeping that never leaves the host */
const HOST={tokens:[],passed:{},seq:0};

/* Build what one seat is allowed to see. */
function makeView(real,seat){
  const v=JSON.parse(JSON.stringify(real));delete v.ui;delete v.eventOrder;delete v.eventPos;delete v.trend;
  const showdown=v.phase==="result"&&v._show&&!v._show.byFold&&!v._show.nobody;
  const board=real.board||[];
  const seeAll=showdown?5:(v.phase==="result"&&v.rollout?5:v.reveal);
  v.board=board.map((d,j)=>j<seeAll?d:0);
  v.players.forEach((p,i)=>{
    if(i===seat)return;
    const reveal=(showdown&&!p.folded)||v.phase==="over";
    if(!reveal)p.priv=(p.priv||[]).map(()=>0);
    p.preview=null;
  });
  v.mySeat=seat;v.mp=true;return v;
}
function mpLog(text,seat,type){S.lastAct={seq:++HOST.seq,seat,type:type||"info",text,pot:S.pot};}

/* Lobby */
function hostInitLobby(hostName,pi,hi){S.players=[{name:hostName||"Host",pi:pi||0,hi:hi||0}];S.phase="lobby";S.conn=[true];S.ready=[false];
  HOST.tokens=[randToken()];HOST.passed={};HOST.seq=0;S.lastAct=null;return HOST.tokens[0];}
function hostJoin(msg){ // returns {seat,token} or {err}
  const t=msg.token&&HOST.tokens.indexOf(msg.token);
  if(t!=null&&t>=0){S.conn[t]=true;if(S.phase==="lobby"&&msg.name)S.players[t].name=cleanName(msg.name,t);return {seat:t,token:msg.token,rejoin:true};}
  if(S.phase!=="lobby")return {err:"This game has already started. Ask the host to start a new table."};
  if(S.players.length>=6)return {err:"The table is full (6 merchants)."};
  const seat=S.players.length;const token=randToken();HOST.tokens.push(token);
  S.players.push({name:cleanName(msg.name,seat),pi:(msg.pi|0)%6,hi:(msg.hi|0)%4});S.conn[seat]=true;S.ready[seat]=false;
  mpLog(`${S.players[seat].name} joined the table`,seat,"join");return {seat,token};
}
function cleanName(n,seat){n=String(n||"").replace(/[\u0000-\u001f]/g,"").trim().slice(0,14);return n||`Merchant ${seat+1}`;}
function hostStart(){if(S.phase!=="lobby"||S.players.length<2)return false;
  S.players.forEach((p,i)=>{p.name=cleanName(p.name,i);});newGame();S.ready=S.players.map(()=>false);startHand();mpLog("The table opens",0,"start");return true;}

/* Phase transitions the host drives */
function connectedSeats(){return S.players.map((_,i)=>i).filter(i=>S.conn[i]);}
function allReady(){return connectedSeats().every(i=>S.ready[i]);}
function hostDeal(){if(S.phase!=="market"||S.pendingChoice)return false;
  S.players.forEach(p=>{p.flAtDeal=p.fl;p.pledged=0;});postAntes();S.ready=S.players.map(()=>false);
  const live=liveIdx();
  if(live.length===0){S._show={winners:[],byFold:true,pots:[],boasts:[],nobody:true};S.phase="result";}
  else if(live.length===1)endHandByFold();
  mpLog(`Hand ${S.handNo} is dealt`,0,"deal");hostFlow();return true;}
function hostNext(){if(S.phase!=="result")return false;S.ready=S.players.map(()=>false);
  const why=gameOverReason();
  if(why){S._endReason=why;if(why==="cap")applyFinalReprice();else S._finalMove=null;S.phase="over";mpLog("The table closes",0,"over");return true;}
  startHand();mpLog(`Hand ${S.handNo}: the market opens`,0,"market");return true;}
/* After any betting change: run the board out while nobody can act, pausing for
   all-in merchants who still have a power to use on this street. */
function hostFlow(){
  for(let g=0;g<12;g++){
    if(S.phase!=="betting"){S.window=null;return;}
    if(!streetDone()){S.window=null;return;}
    const key=S.handNo+":"+S.street;const passed=HOST.passed[key]||[];
    const pend=allinPending().filter(i=>S.conn[i]&&!passed.includes(i));
    if(pend.length){S.window={key,pend};return;}
    S.window=null;const r=advanceStreet();
    if(r==="reveal")mpLog(["","Three community dice hit the table","The fourth die is thrown","The final die is thrown"][S.street],-1,"reveal");
  }
}
/* One action from one seat. Returns {ok} or {err}. */
function hostHandle(seat,a){
  if(!a||typeof a!=="object")return {err:"Bad action"};
  const p=S.players[seat];if(!p)return {err:"Unknown seat"};
  const nm=p.name;const t=a.type;
  if(t==="profile"){if(S.phase!=="lobby")return {err:"Game already started"};p.name=cleanName(a.name,seat);p.pi=(a.pi|0)%6;p.hi=(a.hi|0)%4;return {ok:true,quiet:true};}
  if(t==="settings"){if(seat!==0||S.phase!=="lobby")return {err:"Only the host can change settings"};
    if(typeof a.targetAuto==="boolean")S.targetAuto=a.targetAuto;if(a.target)S.target=Math.max(300,Math.min(5000,a.target|0));
    if(a.totalHands)S.totalHands=Math.max(3,Math.min(40,a.totalHands|0));if(S.targetAuto)S.target=autoTarget(S.players.length);return {ok:true,quiet:true};}
  if(t==="rematch"){if(seat!==0)return {err:"Only the host can do that"};return hostRematch()?{ok:true}:{err:"The game isn't over"};}
  if(t==="start"){if(seat!==0)return {err:"Only the host can start"};return hostStart()?{ok:true}:{err:"Need at least 2 merchants"};}
  if(t==="ready"){if(S.phase!=="market"&&S.phase!=="result")return {err:"Nothing to be ready for"};S.ready[seat]=!S.ready[seat];
    if(allReady()){if(S.phase==="market"&&!S.pendingChoice)hostDeal();else if(S.phase==="result")hostNext();}return {ok:true,quiet:true};}
  if(t==="force"){if(seat!==0)return {err:"Only the host can do that"};
    if(S.phase==="market"&&!S.pendingChoice)return hostDeal()?{ok:true}:{err:"Cannot deal yet"};
    if(S.phase==="result")return hostNext()?{ok:true}:{err:"Cannot continue"};
    if(S.phase==="market"&&S.pendingChoice){const pc=S.pendingChoice;if(S.conn[pc.chooser])return {err:"Waiting on a connected merchant"};
      const opts=pc.decree?CKEYS:S.players.map((_,i)=>i).filter(i=>i!==pc.chooser);resolveEventChoice(pick(opts));mpLog(`The host decided for ${S.players[pc.chooser].name}`,0);return {ok:true};}
    if(S.phase==="betting"){
      if(S.window){const w=S.window;(HOST.passed[w.key]=HOST.passed[w.key]||[]).push(...w.pend);hostFlow();return {ok:true};}
      const who=S.turn;if(who<0||S.conn[who])return {err:"That merchant is connected"};const L=legal();
      apply(L.canCheck?{type:"check"}:{type:"fold"});mpLog(`${S.players[who].name} is away: auto-${L.canCheck?"check":"fold"}`,who);hostFlow();return {ok:true};}
    return {err:"Nothing to force"};}
  if(t==="choose"){const pc=S.pendingChoice;if(S.phase!=="market"||!pc||pc.chooser!==seat)return {err:"Not your choice to make"};
    if(!resolveEventChoice(pc.decree?a.v:(a.v|0)))return {err:"Invalid choice"};mpLog(`${nm} made their choice`,seat);return {ok:true};}
  if(t==="trade"){if(S.phase!=="market")return {err:"The market is closed"};const r=doTrade(p,a.t||{});if(!r.ok)return {err:r.why};
    mpLog(`${nm} traded`,seat,"trade");return {ok:true};}
  if(S.phase!=="betting")return {err:"No hand in progress"};
  if(t==="power"){const mine=S.turn===seat||(p.allin&&!p.folded);if(!mine)return {err:"Wait for your turn to use a power"};
    if(!doAbility(p,a.k,{idx:a.idx|0,sign:a.sign}))return {err:"That power can't be used now"};
    const c=CMAP[a.k];const pub=c.scope==="public"||c.scope==="publicSign";
    mpLog(pub?`${nm} used ${c.ab} on community die ${(a.idx|0)+1}`:`${nm} used ${c.ab}`,seat,"power");hostFlow();return {ok:true};}
  if(t==="pass"){if(!S.window||!S.window.pend.includes(seat))return {err:"Nothing to pass"};(HOST.passed[S.window.key]=HOST.passed[S.window.key]||[]).push(seat);hostFlow();return {ok:true,quiet:true};}
  if(t==="pledge"){if(S.turn!==seat)return {err:"Not your turn"};const L=legal();if(!L.canPledge)return {err:"You can't pledge right now"};
    const g=doPledge(p,a.sel||{});if(!g)return {err:"Pick goods to pledge"};p.pledged=(p.pledged||0)+g;mpLog(`${nm} pledged goods for ${g} fl`,seat,"pledge");return {ok:true};}
  if(["check","call","raise","fold","boast","challenge"].includes(t)){
    if(S.turn!==seat)return {err:"Not your turn"};const before=S.pot;const L=legal();
    const act={type:t};if(t==="raise")act.amount=a.amount|0;if(t==="boast"){act.tier=a.tier|0;act.stake=a.stake|0;}if(t==="challenge")act.target=a.target|0;
    const hadBet=S.currentBet>0;if(apply(act)==="invalid")return {err:"That move isn't allowed"};
    const put=S.pot-before;
    const text=t==="check"?`${nm} checks`:t==="fold"?`${nm} folds`:t==="call"?(L.callAmt<L.toCall?`${nm} is all-in for ${put}`:`${nm} calls ${put}`)
      :t==="raise"?`${nm} ${hadBet?"raises to":"bets"} ${act.amount}`
      :t==="boast"?`${nm} boasts ${tierOf(act.tier).n} or better (${act.stake} fl)`:`${nm} challenges ${S.players[act.target].name}'s boast`;
    mpLog(text,seat,t);hostFlow();return {ok:true};}
  return {err:"Unknown action"};
}
function hostRematch(){if(S.phase!=="over")return false;S.players=S.players.map(p=>({name:p.name,pi:p.pi,hi:p.hi}));S.phase="lobby";
  S.ready=S.players.map(()=>false);S._show=null;S.window=null;S.pendingChoice=null;S.eventCard=null;S.handNo=0;mpLog("Back to the lobby",0);return true;}

     <path d="M44 34 Q56 30 70 34" stroke="rgba(255,255,255,.12)" stroke-width="2" fill="none"/>`;

  if(h===3)front=`<g fill="${p.hair}">${[[40,40],[48,32],[58,29],[68,30],[77,35],[83,44],[37,50]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9"/>`).join("")}</g>

     <path d="M52 76 Q60 72 68 76" stroke="${p.shade}" stroke-width="2" fill="none"/>`;
  const mouth=h===3?"":`<path d="M53 76 Q60 80 67 76" stroke="#7A3F32" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  const lashes=h===1?`<path d="M45 57 l-3 -2 M75 57 l3 -2" stroke="${p.hair}" stroke-width="1.6" stroke-linecap="round"/>`:"";
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true">
   <defs><radialGradient id="${id}b" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="${p.bg}" stop-opacity=".55"/><stop offset="1" stop-color="${p.bg}"/></radialGradient>

    <circle cx="49.6" cy="59.3" r="2.3" fill="#2A1A10"/><circle cx="71.6" cy="59.3" r="2.3" fill="#2A1A10"/>
    <circle cx="50.4" cy="58.4" r=".8" fill="#fff"/><circle cx="72.4" cy="58.4" r=".8" fill="#fff"/>
    ${lashes}

function portrait(p,size,o){o=o||{};return `<span class="pt" style="display:inline-block;position:relative;width:${size}px;height:${size}px;line-height:0">${charSVG(p.pi,p.hi,size)}${o.crown?crownSVG():""}${o.dealer?'<span class="dealer" title="Dealer">D</span>':""}</span>`;}
function crownSVG(){return `<svg class="crown" viewBox="0 0 28 20" aria-hidden="true"><path d="M2 18 L4 6 L10 12 L14 2 L18 12 L24 6 L26 18Z" fill="#F4C065" stroke="#7A5720" stroke-width="1.2" stroke-linejoin="round"/><circle cx="14" cy="13" r="2" fill="#9E3527"/></svg>`;}

/* d8 seen face-on: a front triangle with three neighbouring facets, shaded like a lit gem */
const ROMAN={1:"I",2:"II",3:"III",4:"IV",5:"V",6:"VI",7:"VII",8:"VIII"};
const DIE_STYLES={
  bone:   {f:"#FBF3E1",f2:"#E7D6B1",r:"#D8C398",l:"#BFA67B",b:"#8C7650",ink:"#2A1D12",edge:"#5E4B2F"},
  garnet: {f:"#D65A4B",f2:"#A1302B",r:"#8E2724",l:"#761E1E",b:"#4B1212",ink:"#FFF1D8",edge:"#360C0C"},
  sapphire:{f:"#5C86C4",f2:"#2E5390",r:"#284A80",l:"#1F3C6A",b:"#132646",ink:"#F4F0E4",edge:"#0D1A30"},
  back:   {f:"#4A3020",f2:"#34211A",r:"#3A2618",l:"#2C1C12",b:"#1C120B",ink:"#C9A45C",edge:"#8A6B35"},
};
function dieSVG(v,style){const st=DIE_STYLES[style]||DIE_STYLES.bone;
  const lab=v?(S.numerals==="roman"?ROMAN[v]:String(v)):"✦";
  const fs=v?(S.numerals==="roman"?({1:32,2:28,3:22,4:17})[lab.length]:34):20;
  return `<svg viewBox="0 0 100 104"><defs><linearGradient id="dg-${style}" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="${st.f}"/><stop offset="1" stop-color="${st.f2}"/></linearGradient></defs>
   <g stroke="${st.edge}" stroke-width="1.8" stroke-linejoin="round">
    <polygon points="50,8 89,31 89,76" fill="${st.r}"/>
    <polygon points="89,76 50,99 11,76" fill="${st.b}"/>
    <polygon points="11,76 11,31 50,8" fill="${st.l}"/>
    <polygon points="50,8 89,76 11,76" fill="url(#dg-${style})"/></g>
   <polygon points="50,15 60,33 40,33" fill="#fff" opacity=".28"/>
   <text x="50" y="58" text-anchor="middle" dominant-baseline="central" font-family="Cinzel,Georgia,serif" font-weight="800" font-size="${fs}" fill="${st.ink}">${lab}</text></svg>`;}
function die(v,style,cls,attr){return `<span class="die ${cls||""}" data-v="${v||0}" data-s="${style||"bone"}" role="img" aria-label="${v?"die showing "+v:"hidden die"}" ${attr||""}>${dieSVG(v,style||"bone")}</span>`;}
function rollFx(){document.querySelectorAll(".die.rolling").forEach(el=>{const v=+el.dataset.v,s=el.dataset.s;if(!v)return;let n=0;
  const id=setInterval(()=>{el.innerHTML=dieSVG(rng(1,8),s);if(++n>=7){clearInterval(id);el.innerHTML=dieSVG(v,s);}},70);});}

function coinsSVG(n){const stacks=Math.max(1,Math.min(3,Math.ceil(n/40)));const h=Math.max(1,Math.min(6,Math.ceil(n/15)));let out="";
  for(let s=0;s<stacks;s++){const x=12+s*16,hh=Math.max(1,h-s);for(let i=0;i<hh;i++){const y=36-i*5-(s===1?3:0);
    out+=`<ellipse cx="${x}" cy="${y+2}" rx="10" ry="4" fill="#8A6420"/><ellipse cx="${x}" cy="${y}" rx="10" ry="4" fill="#E6BC4F" stroke="#7A5720" stroke-width=".8"/>`;}}

/* ---------- sound: tiny WebAudio synth, starts only after a tap ---------- */
const SFX=(()=>{let ctx=null;const on=()=>!(S.ui&&S.ui.muted);
  function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ctx=null;}}if(ctx&&ctx.state==="suspended")ctx.resume();return ctx;}
  function noise(t,dur,f,gain){const c=ac();if(!c)return;const b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=c.createBufferSource();s.buffer=b;
    const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=f;bp.Q.value=1.4;const g=c.createGain();g.gain.value=gain;s.connect(bp).connect(g).connect(c.destination);s.start(c.currentTime+t);}
  function tone(t,f,dur,gain,type){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(0,c.currentTime+t);g.gain.linearRampToValueAtTime(gain,c.currentTime+t+.005);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+dur);
    o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+.05);}
  return {
    unlock(){ac();},
    dice(n){if(!on())return;for(let i=0;i<(n||3)*2;i++)noise(i*0.055+Math.random()*.03,.05,1800+Math.random()*1600,.35);},
    coin(){if(!on())return;tone(0,1760,.18,.12,"triangle");tone(.05,2349,.22,.09,"triangle");},
    card(){if(!on())return;noise(0,.18,900,.25);},
    tap(){if(!on())return;tone(0,660,.06,.05,"sine");},
    win(){if(!on())return;[523,659,784,1047].forEach((f,i)=>tone(i*.11,f,.5,.1,"triangle"));},
    lose(){if(!on())return;tone(0,330,.25,.08,"sine");tone(.12,247,.35,.08,"sine");},
  };})();

/* ---------- ambient: slow embers + coin bursts on a canvas ---------- */
const FX=(()=>{let cv,cx,parts=[],raf=0,w=0,h=0;const reduce=typeof matchMedia!=="undefined"&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){if(!cv)return;const d=window.devicePixelRatio||1;w=cv.clientWidth;h=cv.clientHeight;cv.width=w*d;cv.height=h*d;cx.setTransform(d,0,0,d,0,0);}
  function ember(){return {x:Math.random()*w,y:h+10,vx:(Math.random()-.5)*.25,vy:-(.25+Math.random()*.5),r:.8+Math.random()*1.8,life:1,decay:.0015+Math.random()*.002,kind:"e"};}
  function loop(){cx.clearRect(0,0,w,h);if(!reduce&&parts.filter(p=>p.kind==="e").length<34&&Math.random()<.25)parts.push(ember());
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;if(p.kind==="c"){p.vy+=.18;p.rot+=p.vr;}
      if(p.kind==="e"){cx.globalAlpha=Math.max(0,p.life)*.55;cx.fillStyle="#F4C065";cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();}
      else{cx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));cx.save();cx.translate(p.x,p.y);cx.scale(Math.cos(p.rot),1);cx.fillStyle="#E6BC4F";cx.strokeStyle="#7A5720";cx.lineWidth=1.2;
        cx.beginPath();cx.arc(0,0,p.r,0,6.283);cx.fill();cx.stroke();cx.restore();}});
    cx.globalAlpha=1;parts=parts.filter(p=>p.life>0&&p.y<h+40);raf=requestAnimationFrame(loop);}
  return {init(){cv=document.getElementById("fx");if(!cv)return;cx=cv.getContext("2d");size();addEventListener("resize",size);if(!raf)loop();},
    burst(x,y,n){if(reduce||!cv)return;for(let i=0;i<(n||40);i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*6;
      parts.push({kind:"c",x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:5+Math.random()*4,life:1,decay:.008+Math.random()*.006,rot:Math.random()*6,vr:.2+Math.random()*.3});}}};})();

function tickerHTML(withPowers){return `<div class="ticker">${COMM.map(c=>{const h=S.history[c.k]||[];const cur=S.prices[c.k];const prev=h.length>1?h[h.length-2]:cur;const d=cur-prev;

function rMarket(){const pc=S.pendingChoice;
  return `<div class="wrap rise">
   <div class="section-h" style="margin-top:0"><div><div class="eyebrow">Hand ${S.handNo} of ${S.totalHands} · Before the deal</div><h2 class="h2" style="margin-top:4px">The Market</h2></div>

   <div class="merchants">${S.players.map((p,i)=>`<div class="mcard">

function mpMarketFoot(pc){const me=ME();const r=S.ready[me];

/* ---------------- DEAL (private peeks) ---------------- */
function rDeal(){const i=U.peekQueue[U.peekPos];const p=S.players[i];const next=U.peekQueue[U.peekPos+1];
  if(!U.peekShown)return `<div class="wrap rise" style="max-width:560px"><div class="ledger cover">

  const ev=evalHand(p.priv);U.rollPending=true;
  return `<div class="wrap rise" style="max-width:560px"><div class="ledger cover">
    <div class="eyebrow">${esc(p.name)}'s private dice</div>

    <button class="btn btn-gold" data-act="peekHide">${next!=null?`Hide & pass to ${esc(S.players[next].name)}`:"Hide & start the betting"}</button></div></div>`;}

/* ---------------- TABLE ---------------- */
function seatPos(i,n){if(n===2)return [[50,92],[50,8]][i];const a=Math.PI/2+(i/n)*Math.PI*2;return [50+Math.cos(a)*42,50+Math.sin(a)*42];}
function seatHTML(p,i){const n=S.players.length;const [x,y]=seatPos(i,n);
  const turn=S.phase==="betting"&&(U.tray==="bet"||MP())&&i===S.turn&&!(MP()&&S.window);const tier=p.boast?tierOf(p.boast):null;const nch=(S.challenges[i]||[]).length;
  const st=p.out?"Sat out · no ante":p.folded?"Folded":p.allin?"All-in":p.committed>0?`Bet ${p.committed} this round`:p.acted?"Checked":"Waiting";
  const used=CKEYS.filter(k=>p.powerUsed&&p.powerUsed[k]);
  return `<div class="seat ${turn?"turn":""} ${p.folded?"folded":""}" data-seat="${i}" style="left:${x}%;top:${y}%">
    ${portrait(p,44,{dealer:i===S.dealer})}
    <div class="nm">${esc(p.name)}</div><div class="fl num">${fl(p.fl)}${p.escrow?` <span class="dim" style="font-size:11px">+${p.escrow} staked</span>`:""}</div>
    <div class="st">${MP()&&!S.conn[i]?'<b style="color:var(--down)">Away</b> · ':""}${MP()&&i===ME()?"You · ":""}${st}${used.length?` · ${used.map(k=>icon(k)).join("")}`:""}</div>
    ${tier?`<div class="boast">⚑ ${tier.n} or better · ${p.boastStake} fl${nch?` · ${nch} challenge${nch>1?"s":""}`:""}</div>`:""}</div>`;}
function boardHTML(opts){opts=opts||{};const cd=community();let out="";
  for(let j=0;j<5;j++){if(j<cd.length){const roll=(opts.roll&&j>=U.revealFrom)?" rolling":"";const hl=opts.hl===j?" glow":"";
      const pickable=opts.pick&&(!opts.pickOk||opts.pickOk(j));
      out+=die(cd[j],"bone",roll+hl+(pickable?" pickable":""),(roll?`style="animation-delay:${(j-U.revealFrom)*110}ms" `:"")+(pickable?`data-act="pickBoard" data-arg="${j}" tabindex="0"`:""));}
    else out+=opts.slots===false?"":`<span class="slot">${die(0,"back","dimmed")}</span>`;}
  return `<div class="board">${out}</div>`;}
function rTable(){
  if(!MP()&&S.phase==="betting"&&U.tray==="bet"){const p=S.players[S.turn];if(!p||p.folded||p.allin){setTimeout(continueHand,0);}}
  const L=legal();const p=S.players[S.turn];
  const potSub=S.phase==="betting"&&U.tray==="bet"&&S.currentBet>0?`Bet to match ${S.currentBet}`:"";
  const seats=S.players.map((q,i)=>seatHTML(q,i)).join("");
  return `<div class="table-screen">
   <div class="arena">
     <div class="seats-strip">${seats}</div>
     <div class="felt"><div class="street">${STREET_NAMES[S.street]} · hand ${S.handNo}</div>
       ${boardHTML({roll:U.rollPending})}
       <div class="pot">${coinsSVG(S.pot)}<div><b class="num">Pot ${S.pot}</b><span class="sub">${potSub||"&nbsp;"}</span></div></div></div>
   </div>
   ${MP()?mpTrayHTML(L):trayHTML(L,p)}</div>`;}
function trayHTML(L,p){
  if(U.tray==="reveal")return `<div class="tray turn-banner"><div class="who"><div style="flex:1;min-width:200px"><div class="eyebrow">${STREET_NAMES[S.street]}</div><div class="nm" style="font-family:var(--display);font-weight:900;font-size:22px">${REVEAL_LINES[S.street]}</div></div>
      <button class="btn btn-gold" data-act="continue">Continue →</button></div></div>`;
  if(U.tray==="allin"){const pend=allinPending();
    return `<div class="tray turn-banner"><div><div class="eyebrow">${STREET_NAMES[S.street]}</div><div style="font-family:var(--display);font-weight:900;font-size:20px">All-in merchants may spend a commodity</div>
      <p class="soft" style="margin:4px 0 0;font-size:14px">They can't bet any more, but they can still bend the dice once per hand.</p></div>
      <div class="actions">${pend.map(i=>`<button class="btn btn-line" data-act="power" data-arg="${i}">⚒ ${esc(S.players[i].name)}: use a power</button>`).join("")}
      <button class="btn btn-gold" data-act="allinDone">Continue →</button></div></div>`;}
  if(!p||L.fl===undefined)return `<div class="tray"><p class="soft" style="margin:0">Waiting…</p></div>`;
  const allinCall=L.canCall&&L.callAmt<L.toCall;const callLbl=allinCall?`All-in · ${L.callAmt} fl`:`Call ${L.callAmt} fl`;
  const chal=L.boastTargets.map(i=>`<button class="btn btn-line btn-sm" data-act="challenge" data-arg="${i}">Challenge ${esc(S.players[i].name)}</button>`).join("");
  const powersLeft=6-CKEYS.filter(k=>p.powerUsed&&p.powerUsed[k]).length;
  return `<div class="tray turn-banner" data-turn="${S.turn}">${MP()?mineHTML():""}
    <div class="who">${portrait(p,56)}
      <div style="flex:1;min-width:160px"><div class="nm">${MP()?"Your turn":esc(p.name)+" to act"}</div>
        <div class="meta">Chips <b class="num">${fl(p.fl)}</b> · in this round <b class="num">${p.committed}</b>${L.toCall>0?` · to call <b class="num">${L.toCall}</b>`:""}${p.priv.length>2?" · 3 private dice":""}</div></div>
      ${MP()?"":`<button class="btn btn-line peek-btn" data-peek="${S.turn}" aria-label="Hold to see your private dice">${uiIcon("eye").replace("<svg",'<svg width="18" height="18"')} My dice</button>`}</div>
    <div class="actions">
      ${L.canCheck?`<button class="btn btn-line" data-act="check">Check</button>`:""}
      ${L.canCall?`<button class="btn ${allinCall?"btn-wax":"btn-line"} ${U.armed==="call"?"armed":""}" data-act="call">${allinCall&&U.armed==="call"?"Tap again: go all-in":callLbl}</button>`:""}
      ${L.canRaise?`<button class="btn btn-gold" data-act="raise">${S.currentBet>0?"Raise":"Bet"} →</button>`:""}
      ${L.canFold?`<button class="btn btn-wax ${U.armed==="fold"?"armed":""}" data-act="fold">${U.armed==="fold"?"Tap again to fold":"Fold"}</button>`:""}
    </div>
    <div class="minor">
      ${L.canBoast?`<button class="btn btn-line btn-sm" data-act="boast">⚑ Boast</button>`:""}
      ${chal}
      ${L.canAbility?`<button class="btn btn-line btn-sm" data-act="power" data-arg="${S.turn}">⚒ Use a power · ${powersLeft} left</button>`:`<span class="dim it" style="font-size:13px;align-self:center">${p.usedThisHand?"Power used this hand":"No power available now"}</span>`}
      ${L.canPledge?`<button class="btn btn-wax btn-sm" data-act="pledge">Pledge goods at 50%</button>`:""}
    </div></div>`;}

/* ---------------- RESULT ---------------- */
function rResult(){const sh=S._show||{winners:[],pots:[],boasts:[]};
  if(sh.nobody)return `<div class="wrap rise" style="max-width:720px"><div class="ledger" style="display:grid;gap:14px;text-align:center">
    <div class="eyebrow">Hand ${S.handNo}</div><h2 class="h2">Nobody could cover the ante</h2><p class="soft">The dice stay in the cup this hand. Sell goods in the next market to buy back in.</p>
    <div class="row c"><button class="btn btn-gold" data-act="toScore">Tally the ledger →</button></div></div></div>`;
  const names=sh.winners.map(i=>esc(S.players[i].name));
  const head=sh.winners.length>1?`${names.join(" & ")} split the pot`:`${names[0]} takes the pot`;
  const rows=S.players.map((p,i)=>{const win=sh.winners.includes(i);const net=p.fl+(p.escrow||0)-(p.flAtDeal==null?p.fl:p.flAtDeal)-(p.pledged||0);
    let mid;if(p.out)mid=`<span class="dt">Sat out this hand</span>`;
    else if(p.folded)mid=`<span class="dt">Folded</span>`;
    else if(sh.byFold)mid=`<span class="dt">Dice stay hidden. Everyone else folded.</span>`;
    else{const ev=bestOf(p);mid=`<div class="dice">${bestFiveDice(p,ev,"sm")}</div><div><span class="hn">${ev.name}</span> <span class="dt">· ${ev.detail}</span></div>`;}
    return `<div class="srow ${win?"win":""} ${p.folded?"out":""}" data-row="${i}">${portrait(p,46,{crown:win})}
      <div style="min-width:0;display:grid;gap:4px"><span class="nm">${esc(p.name)}</span>${mid}</div>
      <span class="gain num ${net<0?"neg":""}">${net>0?"+":net<0?"−":""}${Math.abs(net)} fl</span></div>`;}).join("");
  const pots=(sh.pots||[]).length>1?sh.pots.map((pt,j)=>`<div class="note gold">${j===0?"Main pot":"Side pot "+j}: ${pt.amount} fl → ${pt.winners.map(w=>esc(S.players[w].name)).join(" & ")}</div>`).join(""):"";
  const boasts=(sh.boasts||[]).map(b=>{const bp=S.players[b.bi];const t=tierOf(b.tier);
    if(!b.chals.length)return `<div class="note">⚑ ${esc(bp.name)} boasted ${t.n}. Nobody challenged. ${b.made?"They made it.":"A bluff that went unpunished."}</div>`;
    const who=b.chals.map(c=>esc(S.players[c.c].name)).join(", ");
    return `<div class="note">⚑ ${esc(bp.name)}'s boast of ${t.n} ${b.made?"<b>held</b>":b.folded?"<b>fell</b> when they folded":"<b>fell short</b>"} (${b.ev.name}). ${b.made?`They win ${b.net} fl from ${who}.`:`${who} collect${b.chals.length>1?"":"s"} ${-b.net} fl.`}</div>`;}).join("");
  const over=gameOverReason();
  return `<div class="wrap rise" style="max-width:860px"><div class="ledger" style="display:grid;gap:14px">
    <div><div class="eyebrow">Hand ${S.handNo} · ${sh.byFold?"Everyone else folded":"Showdown"}</div><h2 class="h2" style="margin-top:4px">${head}</h2>
      <p class="soft" style="margin:4px 0 0">${(sh.pots||[]).reduce((a,p)=>a+p.amount,0)} fl in the pot.</p></div>
    <div class="board-mini">${(S.rollout?S.board:community()).map((d,j)=>die(d,"bone",j>=S.reveal?"md glow":"md")).join("")}</div>
    ${S.rollout&&S.reveal<5?`<p class="soft it" style="margin:-4px 0 0;text-align:center;font-size:14px">The unrevealed dice were rolled out to settle boasts. They don't affect the pot.</p>`:""}
    <div class="show">${rows}</div>${pots}${boasts}
    <div class="row c"><button class="btn btn-gold" data-act="toScore">${over?"Final tally →":"Tally the ledger →"}</button></div></div></div>`;}

/* ---------------- SCORE ---------------- */
function rScore(){const rk=ranking();const over=gameOverReason();
  return `<div class="wrap rise" style="max-width:860px"><div class="ledger" style="display:grid;gap:14px">
   <div><div class="eyebrow">After hand ${S.handNo} of ${S.totalHands} · first to ${S.target} wins</div><h2 class="h2" style="margin-top:4px">The Ledger</h2></div>
   <div class="rank-list">${rk.map((r,j)=>{const pct=Math.min(100,Math.round(r.v/S.target*100));
     return `<div class="rrow ${j===0?"lead":""}"><span class="rk">${j+1}</span>${portrait(r.p,40,{crown:j===0})}
       <div style="min-width:0"><div class="nm">${esc(r.p.name)}</div><div class="br num">${fl(r.p.fl)} + ${fl(holdingsValue(r.p))} in goods · ${pct}% of target</div><div class="bar"><i style="width:${pct}%"></i></div></div>
       <span class="v num">${r.v}</span></div>`;}).join("")}</div>
   ${over==="target"?`<div class="note gold">${esc(rk[0].p.name)} has reached ${S.target}.</div>`:over==="cap"?`<div class="note gold">That was the last hand. The closing bell rings once more before the final count.</div>`:""}
   ${MP()?`<div style="display:grid;gap:10px;justify-items:center">${readyRowHTML()}<div class="row c"><button class="btn ${S.ready[ME()]?"btn-ink":"btn-gold"}" data-act="mpReady">${S.ready[ME()]?"Ready ✓ (tap to undo)":over?"Ready for the final count":"Ready for the next hand"}</button>
     ${NET.role==="host"?`<button class="btn btn-ink btn-sm" data-act="mpForce">Continue now</button>`:""}<button class="btn btn-ink btn-sm" data-act="toResultLocal">Back to the hand</button></div></div>`
   :`<div class="row c"><button class="btn btn-gold" data-act="${over?"finish":"nextHand"}">${over?"Crown the victor →":"Next hand →"}</button></div>`}</div></div>`;}

/* ---------------- END ---------------- */
function rEnd(){const rk=ranking();const w=rk[0];const byT=S._endReason==="target";const fm=(!byT&&S._finalMove)||null;
  return `<div class="wrap rise" style="max-width:860px;display:grid;gap:16px">
   <div class="end-hero">${portrait(w.p,150,{crown:true})}<div class="eyebrow">The table closes · ${WORLD}</div>
     <h1 class="h1" style="font-size:clamp(30px,6vw,56px)">${esc(w.p.name)} rules the Merchant's Table</h1>
     <p class="lede">${byT?`${esc(w.p.name)} crossed ${S.target} in total wealth after ${S.handNo} hands.`:`After ${S.totalHands} hands nobody reached ${S.target}. The richest lord takes the high seat.`}</p></div>
