<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#110C08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Merchant's Table">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>The Merchant's Table</title>
<style>
@font-face{font-family:'Cinzel';font-style:normal;font-weight:400 900;font-display:swap;src:url(cinzel-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Cinzel Decorative';font-style:normal;font-weight:700;font-display:swap;src:url(cinzel-decorative-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Cinzel Decorative';font-style:normal;font-weight:900;font-display:swap;src:url(cinzel-decorative-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Spectral';font-style:normal;font-weight:400;font-display:swap;src:url(spectral-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Spectral';font-style:normal;font-weight:500;font-display:swap;src:url(spectral-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Spectral';font-style:normal;font-weight:600;font-display:swap;src:url(spectral-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Spectral';font-style:normal;font-weight:700;font-display:swap;src:url(spectral-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Spectral';font-style:italic;font-weight:400;font-display:swap;src:url(spectral-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'Spectral';font-style:italic;font-weight:500;font-display:swap;src:url(spectral-latin-500-italic.woff2) format('woff2')}
@font-face{font-family:'Orbitron';font-style:normal;font-weight:400 900;font-display:swap;src:url(orbitron-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:400;font-display:swap;src:url(chakra-petch-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:500;font-display:swap;src:url(chakra-petch-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:600;font-display:swap;src:url(chakra-petch-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:700;font-display:swap;src:url(chakra-petch-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:italic;font-weight:400;font-display:swap;src:url(chakra-petch-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:italic;font-weight:500;font-display:swap;src:url(chakra-petch-latin-500-italic.woff2) format('woff2')}
</style>
<style>
:root{
  color-scheme:dark;
  --night:#110C08; --walnut:#2A1A10; --walnut-2:#3B2618; --walnut-3:#523522;
  --baize:#1E3B32; --baize-lit:#2F5B4C; --baize-deep:#10231D;
  --brass:#C9A45C; --brass-hi:#EDD394; --brass-lo:#86672F;
  --candle:#F4C065; --wax:#9E3527; --wax-hi:#C75640;
  --parch:#F0E5CC; --parch-2:#E2D1AC; --parch-3:#CDB887; --ink:#2A1D12; --ink-soft:#6A563F;
  --text:#F2E7D0; --text-soft:#BCA986; --text-dim:#8D7C60;
  --up:#86BD6E; --down:#EC7A62; --up-ink:#3E7536; --down-ink:#A5392A;
  --display:'Cinzel',Georgia,'Times New Roman',serif;
  --deco:'Cinzel Decorative','Cinzel',Georgia,serif;
  --body:'Spectral',Georgia,'Times New Roman',serif;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
input{font:inherit}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:
   radial-gradient(ellipse 70% 55% at 50% 42%,rgba(244,192,101,.10),transparent 70%),
   radial-gradient(ellipse 120% 100% at 50% 0%,#3A2517 0%,#1E140D 55%,#0E0906 100%)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#bar{position:relative;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,rgba(20,13,8,.92),rgba(20,13,8,.55));border-bottom:1px solid rgba(201,164,92,.22)}
#bar[hidden]{display:none!important}
.mark{font-family:var(--deco);font-weight:900;font-size:15px;color:var(--brass-hi);letter-spacing:.02em;white-space:nowrap}
.bar-meta{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar-meta b{color:var(--brass-hi);font-weight:700}
.bar-sp{flex:1}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(201,164,92,.35);
  font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-hi);background:rgba(201,164,92,.07)}
.ibtn:hover{background:rgba(201,164,92,.16)}
.ibtn svg{width:16px;height:16px}
.ibtn .lbl{display:inline}
@media (max-width:620px){.ibtn .lbl{display:none}.ibtn{padding:0 10px}.mark{display:none}}

#view{position:relative;z-index:5;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1040px;margin:0 auto}

/* ---------- type ---------- */
.eyebrow{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--brass)}
.h1{font-family:var(--deco);font-weight:900;font-size:clamp(30px,9vw,84px);overflow-wrap:anywhere;line-height:.98;letter-spacing:.01em;margin:0;color:var(--text);text-wrap:balance;
  text-shadow:0 2px 0 #0008,0 0 40px rgba(244,192,101,.25)}
.h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.6vw,32px);line-height:1.1;margin:0;text-wrap:balance}
.h3{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;margin:0}
.soft{color:var(--text-soft)} .dim{color:var(--text-dim)}
.it{font-style:italic}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- buttons ---------- */
.btn{max-width:100%;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:10px;
  font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;transition:transform .08s,filter .15s,box-shadow .15s}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{opacity:.38;filter:saturate(.5)}
.btn-gold{color:#2B1A08;background:linear-gradient(180deg,#F7D98C,#E0AE4E 55%,#C38E33);box-shadow:inset 0 1px 0 #fff8,0 4px 0 #7A5720,0 10px 22px -8px #000}
.btn-gold:hover:not(:disabled){filter:brightness(1.06)}
.btn-wax{color:#FBEBD8;background:linear-gradient(180deg,#C85B45,#9E3527);box-shadow:inset 0 1px 0 #fff4,0 4px 0 #5E1C13,0 10px 22px -8px #000}
.btn-line{color:var(--brass-hi);border:1px solid rgba(201,164,92,.45);background:rgba(201,164,92,.06)}
.btn-line:hover:not(:disabled){background:rgba(201,164,92,.15)}
.btn-ink{color:var(--ink);border:1px solid rgba(42,29,18,.35);background:rgba(42,29,18,.06)}
.btn-ink:hover:not(:disabled){background:rgba(42,29,18,.12)}
.btn-sm{min-height:36px;padding:0 14px;font-size:12px}
.btn.armed{animation:armpulse .8s ease-in-out infinite;filter:brightness(1.12)}
@keyframes armpulse{50%{box-shadow:0 0 0 4px rgba(244,192,101,.45),0 4px 0 #5E1C13}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}

/* ---------- parchment ledger panels ---------- */
.ledger{background:
   radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),transparent 60%),
   linear-gradient(180deg,var(--parch),var(--parch-2));
  color:var(--ink);border-radius:14px;padding:22px;position:relative;
  box-shadow:0 30px 60px -24px #000,inset 0 0 0 1px rgba(134,103,47,.35),inset 0 0 60px rgba(134,103,47,.18)}
.ledger::before{content:"";position:absolute;inset:7px;border:1px solid rgba(134,103,47,.35);border-radius:9px;pointer-events:none}
.ledger .eyebrow{color:var(--wax)}
.ledger .soft{color:var(--ink-soft)}
.rise{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- dice ---------- */
.die{display:inline-block;width:52px;height:54px;position:relative;flex:none;filter:drop-shadow(0 5px 4px rgba(0,0,0,.45))}
.die svg{width:100%;height:100%;display:block;overflow:visible}
.die.sm{width:30px;height:31px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.die.md{width:40px;height:42px}
.die.lg{width:76px;height:79px}
.die.dimmed{opacity:.35;filter:grayscale(.6)}
.die.glow{filter:drop-shadow(0 0 6px rgba(244,192,101,.9)) drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.die.pickable{cursor:pointer;transition:transform .12s}
.die.pickable:hover{transform:translateY(-4px) scale(1.06)}
.die.rolling{animation:tumble .7s cubic-bezier(.25,.9,.35,1.15) both}
@keyframes tumble{
  0%{transform:translate(-60px,-50px) rotate(-260deg) scale(.4);opacity:0}
  55%{transform:translate(4px,4px) rotate(18deg) scale(1.12);opacity:1}
  75%{transform:translate(-2px,-3px) rotate(-8deg) scale(.97)}
  100%{transform:none;opacity:1}}
.slot{width:52px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(0,0,0,.28),rgba(0,0,0,.08) 60%,transparent 70%)}
.dice{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}

/* ---------- commodity chips & icons ---------- */
.ic{display:inline-block;width:20px;height:20px;vertical-align:-4px;flex:none}
.ic svg{width:100%;height:100%;display:block}

/* ---------- title ---------- */
.title-screen{min-height:100%;display:grid;place-items:center;text-align:center}
.title-screen .inner{max-width:720px;display:grid;gap:22px;justify-items:center;padding:24px 0}
.title-dice{display:flex;gap:12px;justify-content:center;min-height:80px}
.lede{font-size:clamp(16px,2.1vw,19px);color:var(--text-soft);max-width:60ch;margin:0 auto}
.seal{width:84px;height:84px}

/* ---------- setup ---------- */
.setup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:12px}
.pcard{background:rgba(255,255,255,.35);border:1px solid rgba(134,103,47,.3);border-radius:12px;padding:14px;display:grid;gap:10px;justify-items:center}
.pcard input{width:100%;text-align:center;font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid rgba(134,103,47,.45);padding:6px 4px}
.pcard input:focus{outline:none;border-bottom-color:var(--wax)}
.pick-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pick-row button{border-radius:50%;padding:2px;border:2px solid transparent;line-height:0}
.pick-row button[aria-pressed="true"]{border-color:var(--wax)}
.sw{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}
.chips-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:48px;height:44px;padding:0 14px;border-radius:10px;font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink);
  border:1px solid rgba(134,103,47,.45);background:rgba(255,255,255,.3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--parch);border-color:var(--ink)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.cfg-box{border:1px solid rgba(134,103,47,.35);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:rgba(255,255,255,.18)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(134,103,47,.5);font-size:20px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.35)}
.stepper b{font-family:var(--display);font-weight:900;font-size:24px;min-width:70px;text-align:center;color:var(--wax)}
.label{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.toggle{display:inline-flex;border:1px solid rgba(134,103,47,.5);border-radius:10px;overflow:hidden}
.toggle button{padding:8px 14px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--ink)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--parch)}

/* ---------- market ---------- */
.market-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.market-top{grid-template-columns:1fr}}
.ecard{perspective:900px}
.ecard .face{background:linear-gradient(180deg,#F5EBD3,#E4D2AA);color:var(--ink);border-radius:14px;padding:18px 20px 16px;position:relative;
  box-shadow:0 24px 50px -20px #000,inset 0 0 0 1px rgba(134,103,47,.4),inset 0 0 0 6px rgba(240,229,204,.7),inset 0 0 0 7px rgba(134,103,47,.35);
  animation:flipin .6s cubic-bezier(.2,.8,.3,1) both;transform-origin:50% 50%}
@keyframes flipin{from{transform:rotateY(80deg) translateY(-10px);opacity:.001}to{transform:none;opacity:1}}
.ecard .kind{display:flex;align-items:center;gap:10px}
.ecard .glyph{width:54px;height:54px;flex:none}
.ecard .t{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.ecard .etext{font-style:italic;font-size:15.5px;margin:10px 0 0;color:#3E2C1B}
.ecard .eff{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(134,103,47,.55);font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--wax)}
.moves{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mv{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;padding:2px 8px;border-radius:999px;background:rgba(42,29,18,.07)}
.mv.u{color:var(--up-ink)} .mv.d{color:var(--down-ink)}
.choice{display:grid;gap:8px;margin-top:12px}
.choice button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,.45);
  border:1px solid rgba(134,103,47,.4);color:var(--ink);font-family:var(--display);font-weight:700;font-size:14px;text-align:left}
.choice button:hover{background:rgba(255,255,255,.75);border-color:var(--wax)}
.choice .s{font-family:var(--body);font-style:italic;font-weight:500;font-size:13px;color:var(--ink-soft)}

.ticker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.ticker{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tk{border-radius:12px;padding:10px 12px 8px;background:linear-gradient(180deg,rgba(59,38,24,.92),rgba(42,26,16,.92));border:1px solid rgba(201,164,92,.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tk .hd{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--text)}
.tk .pr{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.tk .pr b{font-family:var(--display);font-weight:900;font-size:26px;color:var(--brass-hi)}
.tk .pr .u{color:var(--up);font-weight:700;font-size:13px} .tk .pr .d{color:var(--down);font-weight:700;font-size:13px} .tk .pr .z{color:var(--text-dim);font-size:13px}
.tk .trend{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);font-family:var(--display);font-weight:700}
.tk .pw{margin-top:6px;padding-top:6px;border-top:1px solid rgba(201,164,92,.18);font-size:12px;color:var(--text-soft)}
.tk .pw b{color:var(--candle);font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.04em}
.spark{display:block;width:100%;height:34px;margin-top:4px}

.merchants{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px;margin-top:16px}
.mcard{border-radius:12px;background:rgba(42,26,16,.85);border:1px solid rgba(201,164,92,.22);padding:10px 12px;display:grid;gap:8px}
.mcard .top{display:flex;align-items:center;gap:10px}
.mcard .nm{font-family:var(--display);font-weight:800;font-size:15px}
.mcard .w{font-size:12.5px;color:var(--text-soft)}
.mcard .w b{color:var(--brass-hi);font-family:var(--display)}
.holdrow{display:flex;gap:8px;flex-wrap:wrap}
.holdrow span{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px;color:var(--text)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.tag.ok{background:rgba(134,189,110,.16);color:var(--up)}
.tag.warn{background:rgba(236,122,98,.16);color:var(--down)}
.tag.gold{background:rgba(244,192,101,.16);color:var(--candle)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.foot-cta{position:sticky;bottom:0;margin-top:18px;padding:14px 0 4px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;
  background:linear-gradient(180deg,transparent,rgba(17,12,8,.94) 40%)}
.foot-cta p{margin:0;font-size:13.5px;color:var(--text-soft);max-width:52ch;text-align:center}

/* ---------- table ---------- */
.table-screen{display:grid;gap:14px;max-width:1080px;margin:0 auto}
.arena{position:relative;height:clamp(460px,62vh,600px)}
.felt{position:absolute;z-index:1;left:17%;right:17%;top:18%;bottom:18%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,var(--baize-lit),var(--baize) 55%,var(--baize-deep) 100%);
  box-shadow:0 0 0 10px #4A2F1C,0 0 0 12px var(--brass-lo),0 0 0 22px #2E1D11,0 0 0 23px rgba(201,164,92,.4),0 40px 80px -20px #000,inset 0 0 60px rgba(0,0,0,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.felt::before{content:"";position:absolute;inset:18px;border-radius:50%;border:1px dashed rgba(237,211,148,.22);pointer-events:none}
.felt .street{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(237,211,148,.8)}
.felt .board{display:flex;gap:10px;align-items:center;justify-content:center}
.pot{display:flex;align-items:center;gap:10px;justify-content:center}
.pot .coins{width:54px;height:44px}
.pot b{font-family:var(--display);font-weight:900;font-size:clamp(22px,3vw,30px);color:var(--brass-hi);text-shadow:0 2px 0 #0007}
.pot .sub{display:block;font-size:12px;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;color:rgba(242,231,208,.7)}
.seat{position:absolute;z-index:3;width:156px;transform:translate(-50%,-50%);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;
  background:linear-gradient(180deg,rgba(52,33,21,.96),rgba(33,21,13,.96));border:1px solid rgba(201,164,92,.28);box-shadow:0 10px 24px -10px #000;transition:box-shadow .2s,opacity .2s}
.seat .pt{grid-row:span 3;line-height:0;position:relative}
.seat .nm{font-family:var(--display);font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .fl{font-family:var(--display);font-weight:800;font-size:14px;color:var(--brass-hi)}
.seat .st{font-size:11.5px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chat-panel[hidden]{display:none}
@keyframes chatpop{from{opacity:.001;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;background:linear-gradient(180deg,#3B2618,#2A1A10);border-bottom:1px solid rgba(201,164,92,.25);flex:none}
.ch-title{flex:1;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em;color:var(--text)}
.ch-who{flex:1;min-width:0;display:grid;line-height:1.2}.ch-who b{font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch-who small{font-size:12px;color:var(--text-soft)}
.chat-x,.chat-back{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text-soft);background:rgba(255,255,255,.06);flex:none;font-size:16px}
.chat-back{font-size:26px;line-height:1;padding-bottom:3px;margin-left:-6px}
.chat-x:hover,.chat-back:hover{background:rgba(255,255,255,.14);color:var(--text)}
.cc-pt{position:relative;line-height:0;flex:none}.cc-pt .dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#6D5E48;box-shadow:0 0 0 2px #1E140D}.cc-pt .dot.on{background:#6CC25A}
.chat-list{flex:1;overflow-y:auto;padding:6px}
.chat-contact{width:100%;display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;text-align:left}
.chat-contact:hover{background:rgba(255,255,255,.05)}
.cc-mid{flex:1;min-width:0;display:grid;line-height:1.3}.cc-mid b{font-family:var(--display);font-size:14.5px;color:var(--text)}
.cc-mid>span{font-size:13.5px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-contact.unread .cc-mid>span{color:var(--text);font-weight:600}
.cc-end{display:grid;justify-items:end;gap:4px}.cc-end small{font-size:11px;color:var(--text-dim)}.cc-end .badge{position:static;box-shadow:none}
.chat-note{margin:0;padding:10px 16px 14px;font-size:12px;color:var(--text-dim);text-align:center;font-style:italic}
.chat-msgs{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain;
  background:radial-gradient(ellipse at 50% 0%,rgba(244,192,101,.06),transparent 60%),#18100A}
.chat-empty{margin:auto;max-width:240px;text-align:center;font-size:13.5px;color:var(--text-dim);font-style:italic}
.chat-stamp{align-self:center;font-size:11px;color:var(--text-dim);margin:10px 0 4px;letter-spacing:.04em}
.bub{max-width:78%;padding:8px 12px;border-radius:18px;font-size:15px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap;animation:bubin .18s ease both}
@keyframes bubin{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.me{align-self:flex-end;color:#2B1A08;background:linear-gradient(180deg,#F5D488,#E1B253);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;color:var(--ink);background:#EFE3C8;border-bottom-left-radius:6px}
.bub.grouped.me{border-bottom-right-radius:18px;border-top-right-radius:6px}
.bub.grouped.them{border-bottom-left-radius:18px;border-top-left-radius:6px}
.bub:not(.grouped){margin-bottom:5px}
.chat-quick{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;flex:none;scrollbar-width:none;background:#1E140D}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid rgba(201,164,92,.35);color:var(--brass-hi);font-size:13px;background:rgba(201,164,92,.06);white-space:nowrap}
.chat-quick button:hover{background:rgba(201,164,92,.16)}
.chat-compose{display:flex;gap:8px;align-items:center;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#1E140D;flex:none}
.chat-compose input{flex:1;min-width:0;height:42px;border-radius:999px;border:1px solid rgba(201,164,92,.3);background:#2A1B11;color:var(--text);padding:0 16px;font-size:16px}
.chat-compose input:focus{outline:none;border-color:var(--candle)}
.chat-send{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:#2B1A08;background:linear-gradient(180deg,#F7D98C,#D9A53F)}
.chat-toast{position:fixed;z-index:67;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:min(320px,calc(100% - 32px))}
.chat-toast[hidden]{display:none}
.chat-toast.show{animation:chatpop .25s cubic-bezier(.2,.9,.3,1.2) both}
.chat-toast button{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:16px;text-align:left;background:#EFE3C8;color:var(--ink);box-shadow:0 16px 40px -12px #000;border:1px solid rgba(134,103,47,.4)}
.chat-toast button>span{display:grid;min-width:0;line-height:1.3}.chat-toast b{font-family:var(--display);font-size:13.5px}
.chat-toast button>span>span{font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:520px){
  .chat-panel{left:8px;right:8px;bottom:8px;width:auto;height:min(82dvh,640px);border-radius:18px;transform-origin:50% 100%}
  .chat-fab{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:54px;height:54px}
  .chat-toast{right:12px;left:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:none}
}

/* ---------- theme picker ---------- */
.themes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.theme-opt{display:grid;justify-items:center;gap:3px;width:148px;padding:10px 10px 9px;border-radius:12px;border:1px solid rgba(201,164,92,.35);background:rgba(42,26,16,.55);color:var(--text)}
.ledger .theme-opt{background:rgba(255,255,255,.3);color:var(--ink);border-color:rgba(134,103,47,.4)}
.theme-opt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--candle);border-color:transparent}
.theme-opt b{font-family:var(--display);font-size:14px;letter-spacing:.06em}
.theme-opt small{font-size:11.5px;opacity:.75;text-align:center;line-height:1.2}
.tprev{display:flex;gap:6px;height:34px;align-items:center}
.tprev .d{width:30px;height:30px;display:block;clip-path:polygon(50% 0,100% 30%,100% 75%,50% 100%,0 75%,0 30%)}
.tprev .md1{background:linear-gradient(160deg,#FBF3E1,#BFA67B)}.tprev .md2{background:linear-gradient(160deg,#D65A4B,#761E1E)}
.tprev .sf1{background:linear-gradient(160deg,#D8FBFF,#2A8CB5);box-shadow:0 0 10px #46D7FF}.tprev .sf2{background:linear-gradient(160deg,#FFE0A8,#B85A1C);box-shadow:0 0 10px #FF9A3D}

/* =================== SCI-FI SKIN =================== */
html[data-skin="scifi"]{
  --night:#04070D; --walnut:#0B1422; --walnut-2:#101C2E; --walnut-3:#18293F;
  --baize:#0A2233; --baize-lit:#113A52; --baize-deep:#051320;
  --brass:#46D7FF; --brass-hi:#A6EEFF; --brass-lo:#1C6C8A;
  --candle:#FFB24A; --wax:#FF9A3D; --wax-hi:#FFB870;
  --parch:#0F1B2D; --parch-2:#0A1424; --parch-3:#16273E; --ink:#E4EEFF; --ink-soft:#91A9C9;
  --text:#E4EEFF; --text-soft:#9DB4D2; --text-dim:#617A9B;
  --up:#57E39A; --down:#FF6B7A; --up-ink:#57E39A; --down-ink:#FF7A86;
  --display:'Orbitron','Chakra Petch',system-ui,sans-serif; --deco:'Orbitron','Chakra Petch',system-ui,sans-serif; --body:'Chakra Petch',system-ui,'Segoe UI',sans-serif;
  --glass:rgba(12,24,42,.82); --line:rgba(70,215,255,.28); --line-hi:rgba(70,215,255,.6); --row:rgba(70,215,255,.05);
}
html[data-skin="scifi"] body{background:var(--night)}
html[data-skin="scifi"] #app{background:
  radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 12%,#fff6,transparent),radial-gradient(1.5px 1.5px at 38% 72%,#cfefff88,transparent),
  radial-gradient(1px 1px at 88% 64%,#fff7,transparent),radial-gradient(1px 1px at 22% 88%,#fff5,transparent),radial-gradient(1.2px 1.2px at 56% 40%,#fff5,transparent),
  radial-gradient(ellipse 70% 45% at 85% 110%,rgba(255,154,61,.22),transparent 70%),
  radial-gradient(ellipse 80% 60% at 10% -10%,rgba(70,215,255,.16),transparent 70%),
  radial-gradient(ellipse 120% 100% at 50% 40%,#0A1526 0%,#060B16 55%,#02040A 100%)}
html[data-skin="scifi"] #bar{background:linear-gradient(180deg,rgba(6,12,22,.95),rgba(6,12,22,.6));border-bottom:1px solid var(--line)}
html[data-skin="scifi"] .mark{font-family:'Orbitron',sans-serif;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--brass-hi)}
html[data-skin="scifi"] .h1{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(28px,7.5vw,72px);
  background:linear-gradient(180deg,#F2FBFF 30%,#7FDFFF 70%,#46A9D8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(70,215,255,.35))}
html[data-skin="scifi"] .h2,html[data-skin="scifi"] .h3{letter-spacing:.05em}
html[data-skin="scifi"] .h2{font-weight:700}
html[data-skin="scifi"] .eyebrow{color:var(--brass);letter-spacing:.3em}
html[data-skin="scifi"] .ledger .eyebrow{color:var(--candle)}
html[data-skin="scifi"] .it{font-style:italic}
/* glass HUD panels with corner brackets */
html[data-skin="scifi"] .ledger,html[data-skin="scifi"] .ecard .face{background:linear-gradient(180deg,rgba(16,30,52,.94),rgba(8,15,28,.96));color:var(--ink);
  box-shadow:0 30px 60px -24px #000,inset 0 0 0 1px var(--line),inset 0 0 40px rgba(70,215,255,.05);border-radius:10px;backdrop-filter:blur(6px)}
html[data-skin="scifi"] .ledger::before,html[data-skin="scifi"] .ecard .face::before{content:"";position:absolute;inset:6px;border:0;border-radius:6px;pointer-events:none;
  background:linear-gradient(var(--brass),var(--brass)) top left/16px 2px,linear-gradient(var(--brass),var(--brass)) top left/2px 16px,
  linear-gradient(var(--brass),var(--brass)) top right/16px 2px,linear-gradient(var(--brass),var(--brass)) top right/2px 16px,
  linear-gradient(var(--brass),var(--brass)) bottom left/16px 2px,linear-gradient(var(--brass),var(--brass)) bottom left/2px 16px,
  linear-gradient(var(--brass),var(--brass)) bottom right/16px 2px,linear-gradient(var(--brass),var(--brass)) bottom right/2px 16px;background-repeat:no-repeat;opacity:.8}
html[data-skin="scifi"] .ecard .face{position:relative}
html[data-skin="scifi"] .ecard .etext{color:var(--text-soft)}
html[data-skin="scifi"] .ecard .eff{border-top-color:var(--line);color:var(--candle)}
html[data-skin="scifi"] .mv{background:var(--row)}
/* rows, tiles and controls inside panels */
html[data-skin="scifi"] :is(.pcard,.cfg-box,.ctile,.qrow,.power,.tier,.slider,.srow,.rrow,.hold-card,.trow,.tp-row,.choice button,.theme-opt,.quote,.tsum){background:var(--row);border:1px solid var(--line);color:var(--ink)}
html[data-skin="scifi"] :is(.choice button,.power,.ctile,.tier):hover:not(:disabled){background:rgba(70,215,255,.12);border-color:var(--line-hi)}
html[data-skin="scifi"] :is(.tier,.ctile,.chip,.theme-opt)[aria-pressed="true"]{background:rgba(70,215,255,.18);color:var(--brass-hi);border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 18px rgba(70,215,255,.25)}
html[data-skin="scifi"] :is(.stepper button,.tstep button,.x,.chip){background:rgba(70,215,255,.07);border:1px solid var(--line);color:var(--ink)}
html[data-skin="scifi"] .toggle{border-color:var(--line)}html[data-skin="scifi"] .toggle button{color:var(--ink)}
html[data-skin="scifi"] .toggle button[aria-pressed="true"]{background:var(--brass);color:#032034}
html[data-skin="scifi"] .pcard input,html[data-skin="scifi"] .codein{color:var(--ink);border-color:var(--line-hi);background:rgba(4,10,20,.6)}
html[data-skin="scifi"] .codein{font-family:'Orbitron',sans-serif}
html[data-skin="scifi"] .stepper b,html[data-skin="scifi"] .slider .read,html[data-skin="scifi"] .rrow .rk,html[data-skin="scifi"] .roomcode{color:var(--candle)}
html[data-skin="scifi"] .roomcode{font-family:'Orbitron',sans-serif;text-shadow:0 0 24px rgba(255,178,74,.4)}
html[data-skin="scifi"] .quote b,html[data-skin="scifi"] .tsum .net b,html[data-skin="scifi"] .dash .net .v,html[data-skin="scifi"] .dash .net .c{color:var(--candle)}
html[data-skin="scifi"] .srow.win,html[data-skin="scifi"] .rrow.lead{background:linear-gradient(90deg,rgba(255,178,74,.2),rgba(70,215,255,.05));box-shadow:inset 0 0 0 1px var(--candle)}
html[data-skin="scifi"] .trow.buy{background:rgba(87,227,154,.08);border-color:rgba(87,227,154,.4)}html[data-skin="scifi"] .trow.sell{background:rgba(255,107,122,.08);border-color:rgba(255,107,122,.4)}
html[data-skin="scifi"] .note{background:rgba(255,107,122,.08);border-color:rgba(255,107,122,.35);color:#FFC2C8}
html[data-skin="scifi"] .note.gold,html[data-skin="scifi"] .tip{background:rgba(255,178,74,.08);border-color:rgba(255,178,74,.4);color:#FFE2B8}
html[data-skin="scifi"] .tip .tag.gold{color:#032034;background:var(--candle)}
html[data-skin="scifi"] .bar{background:rgba(70,215,255,.12)}html[data-skin="scifi"] .bar i{background:linear-gradient(90deg,var(--brass-lo),var(--brass));box-shadow:0 0 8px var(--brass)}
html[data-skin="scifi"] .dash .t{border-color:var(--line)}
html[data-skin="scifi"] .rtable td,html[data-skin="scifi"] .rtable th{border-color:var(--line)}
html[data-skin="scifi"] .scrim{background:rgba(2,5,12,.78)}
html[data-skin="scifi"] .board-mini{background:radial-gradient(ellipse at 50% 30%,#113A52,#071A28 70%);box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 0 0 1px var(--line-hi)}
/* buttons */
html[data-skin="scifi"] .btn{border-radius:6px;letter-spacing:.12em;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
html[data-skin="scifi"] .btn-gold{color:#1A0C00;background:linear-gradient(180deg,#FFD08A,#FF9A3D);box-shadow:0 0 22px -4px rgba(255,154,61,.7)}
html[data-skin="scifi"] .btn-wax{color:#fff;background:linear-gradient(180deg,#FF5C74,#B3203D);box-shadow:0 0 22px -6px rgba(255,92,116,.7)}
html[data-skin="scifi"] .btn-line{color:var(--brass-hi);border:1px solid var(--line-hi);background:rgba(70,215,255,.06)}
html[data-skin="scifi"] .btn-line:hover:not(:disabled){background:rgba(70,215,255,.16)}
html[data-skin="scifi"] .btn-ink{color:var(--ink);border:1px solid var(--line);background:rgba(70,215,255,.04)}

/* market cards, seats, tray */
html[data-skin="scifi"] :is(.tk,.mcard,.seat,.tray,.mode){background:linear-gradient(180deg,rgba(14,28,48,.9),rgba(8,16,30,.92));border:1px solid var(--line);box-shadow:0 12px 30px -14px #000,inset 0 1px 0 rgba(166,238,255,.06);border-radius:10px}

html[data-skin="scifi"] .seat.turn{box-shadow:0 0 0 1px var(--candle),0 0 26px rgba(255,178,74,.45)}
html[data-skin="scifi"] .seat .fl,html[data-skin="scifi"] .tray .who .meta b,html[data-skin="scifi"] .mcard .w b{color:var(--brass-hi)}
html[data-skin="scifi"] .seat .boast{background:rgba(255,92,116,.18);border-color:rgba(255,92,116,.55);color:#FFD1D8}
html[data-skin="scifi"] .dealer{background:linear-gradient(180deg,#A6EEFF,#46D7FF);color:#032034}
html[data-skin="scifi"] .mine{background:rgba(70,215,255,.06);border-color:var(--line)}
html[data-skin="scifi"] .foot-cta{background:linear-gradient(180deg,transparent,rgba(4,7,13,.95) 40%)}
/* holographic tactical table */

   repeating-linear-gradient(0deg,rgba(70,215,255,.08) 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,rgba(70,215,255,.08) 0 1px,transparent 1px 26px),
   radial-gradient(ellipse at 50% 45%,rgba(70,215,255,.22),rgba(10,34,51,.95) 55%,#030C16 100%);
  box-shadow:0 0 0 2px var(--brass-lo),0 0 0 8px rgba(10,20,34,.95),0 0 0 9px var(--line-hi),0 0 60px rgba(70,215,255,.25),0 40px 80px -20px #000,inset 0 0 60px rgba(0,0,0,.6)}

html[data-skin="scifi"] .felt .street{color:var(--brass-hi);font-family:'Orbitron',sans-serif;letter-spacing:.3em}
html[data-skin="scifi"] .pot b{color:var(--candle);text-shadow:0 0 18px rgba(255,178,74,.45)}
@media (max-width:760px){html[data-skin="scifi"] .felt{box-shadow:0 0 0 2px var(--brass-lo),0 0 0 5px rgba(10,20,34,.95),0 0 0 6px var(--line-hi),0 0 40px rgba(70,215,255,.2),inset 0 0 40px rgba(0,0,0,.6)}}

html[data-skin="scifi"] .die.dimmed{filter:none;opacity:.35}
html[data-skin="scifi"] .die.glow{filter:drop-shadow(0 0 10px #FFB24A) drop-shadow(0 0 3px #fff)}
html[data-skin="scifi"] .die text{font-family:'Orbitron',sans-serif}
/* chat + toast */
html[data-skin="scifi"] .chat-panel{background:#060D18;border-color:var(--line-hi);border-radius:12px}
html[data-skin="scifi"] .chat-head,html[data-skin="scifi"] .chat-compose,html[data-skin="scifi"] .chat-quick{background:#0A1526}
html[data-skin="scifi"] .chat-msgs{background:radial-gradient(ellipse at 50% 0%,rgba(70,215,255,.08),transparent 60%),#050B15}
html[data-skin="scifi"] .bub.me{background:linear-gradient(180deg,#FFD08A,#FF9A3D);color:#1A0C00}
html[data-skin="scifi"] .bub.them{background:#16283F;color:var(--ink);border:1px solid var(--line)}
html[data-skin="scifi"] .chat-fab,html[data-skin="scifi"] .chat-send{background:linear-gradient(180deg,#A6EEFF,#46D7FF);color:#032034;box-shadow:0 0 22px -4px rgba(70,215,255,.8)}
html[data-skin="scifi"] .chat-compose input{background:#0E1B2E;border-color:var(--line)}
html[data-skin="scifi"] .chat-toast button{background:#0F1B2D;color:var(--ink);border-color:var(--line-hi)}
html[data-skin="scifi"] #toast{background:linear-gradient(180deg,#A6EEFF,#46D7FF);color:#032034;font-family:var(--body)}
html[data-skin="scifi"] #netbar{background:#0A1526;border-color:var(--line-hi);color:var(--brass-hi)}
html[data-skin="scifi"] input[type=range]{background:linear-gradient(90deg,var(--brass-lo),var(--brass))}
html[data-skin="scifi"] input[type=range]::-webkit-slider-thumb{border-color:var(--candle);background:#0A1526}
html[data-skin="scifi"] .qr{box-shadow:0 0 0 6px #FBF3E1,0 0 0 7px var(--brass)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}

<script>/* ======================================================================

const COMM=[
 {k:"wheat", n:"Wheat",  col:"#D9A93A", cost:2, ab:"Spoil the Stock", abd:"Re-roll one community die.",               scope:"public"},
 {k:"wood",  n:"Wood",   col:"#8E5B33", cost:2, ab:"Whittle",         abd:"Nudge one community die up or down 1.",    scope:"publicSign"},
 {k:"brick", n:"Brick",  col:"#B4513A", cost:2, ab:"Recast",          abd:"Re-roll one of your private dice.",        scope:"private"},
 {k:"ore",   n:"Ore",    col:"#6F7C8A", cost:2, ab:"Temper",          abd:"Nudge one of your private dice up or down 1.",scope:"privateSign"},
 {k:"silver",n:"Silver", col:"#B9C2CC", cost:1, ab:"Insider Word",    abd:"Secretly preview the next community die.", scope:"peek"},
 {k:"gold",  n:"Gold",   col:"#E6BC4F", cost:2, ab:"Sellsword",       abd:"Gain a third private die this hand.",      scope:"adddie"},
];
const CKEYS=COMM.map(c=>c.k);
const CMAP={};COMM.forEach(c=>CMAP[c.k]=c);
let WORLD="Mercantila";
const START_FL=100;
const START_PORT={wheat:5,wood:5,brick:5,ore:5,silver:5,gold:5};
const ANTE=5, MINBET=5;
const SELL_FEE=0.05, BROKE_FEE=0.10, PLEDGE_RATE=0.50, BOAST_CAP=0.25;

/* Hand ranks, weakest → strongest, ordered by how rare each is with 7d8.
   v2 change: Straight (11% of 7-dice hands) now beats Full House (22%). */
const RANK_NAMES=["High Die","One Pair","Two Pair","Three of a Kind","Full House","Straight","Four of a Kind","Five of a Kind"];
const RK={HIGH:0,PAIR:1,TWO:2,TRIPS:3,FULL:4,STRAIGHT:5,QUADS:6,FIVE:7};
/* Boast tiers. pay=[a,b]: a challenger who loses pays stake × a/b. The odds
   are near-fair for a blind boast (at-least chance with 7 dice shown as pct). */
const HAND_TIERS=[
 {t:RK.TRIPS,   n:"Three of a Kind", pay:[1,1], pct:46},
 {t:RK.FULL,    n:"a Full House",    pay:[3,2], pct:36},
 {t:RK.STRAIGHT,n:"a Straight",      pay:[4,1], pct:16},
 {t:RK.QUADS,   n:"Four of a Kind",  pay:[15,1],pct:5},
];
const tierOf=t=>HAND_TIERS.find(x=>x.t===t);

let S={screen:"title",players:[],count:3,totalHands:10,target:525,targetAuto:true,handNo:0,dealer:0,
  prices:{},trend:{},history:{},board:[],reveal:0,street:0,currentBet:0,lastRaiser:0,turn:-1,pot:0,
  challenges:{},_injected:0,_show:null,_endReason:null,_finalMove:null,eventCard:null,pendingChoice:null,
  eventOrder:null,eventPos:0,phase:"idle",numerals:"arabic"};

const sum=a=>a.reduce((x,y)=>x+y,0);
const rng=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rollDie=()=>rng(1,8);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clampDie=v=>Math.max(1,Math.min(8,v));
const holdingsValue=p=>sum(CKEYS.map(k=>(p.port[k]||0)*S.prices[k]));
const wealth=p=>p.fl+(p.escrow||0)+holdingsValue(p);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------------------------- MARKET ---------------------------- */
const PMIN=5, PMAX=15, PERSIST=0.62;
const REGIMES=["rising","falling","calm","swingy"];
function regimeStep(r){
  if(r==="rising")return rng(1,3);
  if(r==="falling")return -rng(1,3);
  if(r==="swingy")return rng(-3,3);
  return rng(-1,1);
}
function nextRegime(){const x=Math.random();return x<0.25?"calm":x<0.525?"rising":x<0.80?"falling":"swingy";}
function clampPrice(v){return Math.max(PMIN,Math.min(PMAX,Math.round(v)));}
function evolveMarket(){
  CKEYS.forEach(k=>{
    let r=S.trend[k];const pr=S.prices[k];
    const atTop=pr>=PMAX-1&&r==="rising", atBot=pr<=PMIN+1&&r==="falling";
    const flip=(atTop||atBot)?0.7:(1-PERSIST);
    if(Math.random()<flip){let nr=nextRegime();if(atTop&&nr==="rising")nr="falling";if(atBot&&nr==="falling")nr="rising";r=nr;}
    S.trend[k]=r;S.prices[k]=clampPrice(pr+regimeStep(r));S.history[k].push(S.prices[k]);
  });
}
function syncHistory(k){const h=S.history[k];if(h&&h.length)h[h.length-1]=S.prices[k];}
function shiftPrice(k,a){S.prices[k]=clampPrice(S.prices[k]+a);syncHistory(k);}

/* ---------------------------- EVENTS ---------------------------- */
const GROUPS={staples:["wheat","wood"],metals:["brick","ore"],luxuries:["silver","gold"]};
const GRPNAME={staples:"Staples (wheat & wood)",metals:"Metals (brick & ore)",luxuries:"Luxuries (silver & gold)"};
const EVENTS=[
  {t:"Dragon's Awakening",k:"one",c:"gold",a:4,x:"A wyrm wakes beneath the Brass Quarter and hoards every ingot it can find. Gold grows scarce and dear."},
  {t:"Goldsmiths' Strike",k:"one",c:"gold",a:3,x:"The goldsmiths down their tools and finished gold vanishes from the stalls."},
  {t:"Wheat Blight",k:"one",c:"wheat",a:-4,x:"A black rot creeps through the granaries. Wheat is dumped before it spoils."},
  {t:"Bumper Harvest",k:"one",c:"wheat",a:-3,x:"Fields groan with grain after a golden summer, and wheat floods every market."},
  {t:"Silver Vein Struck",k:"one",c:"silver",a:-4,x:"Prospectors hit a vast vein in the northern hills. Silver pours downriver."},
  {t:"King's Armorers",k:"one",c:"ore",a:4,x:"The crown's armorers buy ore by the cartload ahead of a campaign."},
  {t:"Iron Glut",k:"one",c:"ore",a:-3,x:"A war winds down and leaves the foundries overstocked. Ore prices sag."},
  {t:"The Great Fire",k:"one",c:"wood",a:4,x:"Half the timber yards burn in a night. Sound wood commands a premium."},
  {t:"Quarry Collapse",k:"one",c:"brick",a:4,x:"The river floods the great quarry and brick turns scarce overnight."},

  {t:"War Drums",k:"grp",g:"metals",a:3,x:"Drums sound on the frontier. Every smith and quartermaster scrambles for metal."},
  {t:"Peace Accord",k:"grp",g:"metals",a:-3,x:"A truce is signed and the great armories sell off their metal reserves."},
  {t:"Sumptuary Laws",k:"grp",g:"luxuries",a:-3,x:"The crown forbids common folk from flaunting finery. Luxuries lose their lustre."},
  {t:"Royal Wedding",k:"grp",g:"luxuries",a:3,x:"A lavish royal wedding sets every noble house bidding for silver and gold."},
  {t:"Famine",k:"grp",g:"staples",a:3,x:"A failed harvest grips the realm. Bread and timber turn precious."},
  {t:"Season of Plenty",k:"grp",g:"staples",a:-3,x:"Mild weather and full barns send staple prices tumbling."},
  {t:"A Golden Age",k:"allU",a:2,x:"A decade of peace and plenty lifts every market in the realm alike."},
  {t:"The Great Plague",k:"allU",a:-2,x:"Pestilence empties the streets and demand collapses evenly across the board."},
  {t:"Royal Jubilee",k:"allU",a:1,x:"The crown's jubilee loosens every purse. All goods tick upward together."},
  {t:"Hard Winter",k:"allU",a:-1,x:"A cruel winter slows every road and dampens every trade alike."},
  {t:"Market Boom",k:"allV",d:1,lo:1,hi:4,x:"Speculative fever sweeps the markets. Every commodity climbs, though none alike."},
  {t:"Market Panic",k:"allV",d:-1,lo:1,hi:4,x:"A bank fails at dawn and panic spreads. Prices tumble unevenly across the board."},
  {t:"Speculative Frenzy",k:"allV",d:1,lo:1,hi:3,x:"Rumor and greed inflate the whole market in ragged fits and starts."},
  {t:"Moneylenders' Squeeze",k:"allV",d:-1,lo:1,hi:3,x:"Lenders call in their debts and the market sags in uneven steps."},
  {t:"Spoilage",k:"resAll",g:"staples",a:-3,x:"Damp rot tears through the warehouses. Perishable stock is lost by the cartload."},
  {t:"Black Frost",k:"resAll",g:"any",a:-3,x:"A killing frost ruins goods in every storehouse across the realm."},
  {t:"Bountiful Shipment",k:"resAll",g:"any",a:3,x:"A fat merchant convoy arrives and every house takes delivery of fresh stock."},
  {t:"Smuggler's Cache",k:"resRole",r:"poor",g:"luxuries",a:4,x:"A smuggler slips the poorest merchant a heavy crate of contraband finery."},
  {t:"Warehouse Fire",k:"resRole",r:"rich",g:"any",a:-4,x:"Flames gut a wing of the richest merchant's warehouse."},
  {t:"Caravan Tribute",k:"resGive",r:"rich",val:45,take:false,x:"The wealthiest house must load a rival's wagons with a small fortune in one commodity."},
  {t:"Privateer's Raid",k:"resGive",r:"poor",val:45,take:true,x:"The leanest merchant turns corsair and plunders a fortune of one commodity from a chosen rival."},
  {t:"Levy in Kind",k:"resGive",r:"rich",val:35,take:false,x:"The guild collects its dues in goods. The richest ships a chosen merchant a haul of stock."},
  {t:"Caravan Waylaid",k:"resGive",r:"poor",val:35,take:true,x:"Bandits in the poorest merchant's pay waylay a rival's caravan and haul off its goods."},
  {t:"Crown Patent",k:"decree",r:"rich",dir:1,amt:4,x:"The wealthiest lord secures a royal patent and drives one commodity of their choice sharply upward."},
  {t:"Cornering the Market",k:"decree",r:"rich",dir:1,amt:3,x:"The richest merchant quietly hoards a chosen good until its price leaps."},
  {t:"Market Sabotage",k:"decree",r:"poor",dir:-1,amt:4,x:"The leanest merchant floods the stalls with cheap stock and crashes a commodity of their choice."},
  {t:"Guild Undercut",k:"decree",r:"poor",dir:-1,amt:3,x:"The poorest house undercuts every price on one chosen commodity."},
];
const TARGETING={resRole:1,resGive:1,decree:1};
function shuffleEvents(){S.eventOrder=shuffle(EVENTS.map((_,i)=>i));S.eventPos=0;}
function drawEvent(){
  if(!S.eventOrder||S.eventPos>=S.eventOrder.length)shuffleEvents();
  if(S.handNo<2){ // hand 1: everyone is tied, so skip cards that single out one merchant
    let j=S.eventPos;while(j<S.eventOrder.length&&TARGETING[EVENTS[S.eventOrder[j]].k])j++;
    if(j<S.eventOrder.length&&j!==S.eventPos){const t=S.eventOrder[S.eventPos];S.eventOrder[S.eventPos]=S.eventOrder[j];S.eventOrder[j]=t;}
  }
  return EVENTS[S.eventOrder[S.eventPos++]];
}
/* ties broken at random so seat 0 is not always the victim */
function extremeIdx(dir){let best=null,ids=[];S.players.forEach((p,i)=>{const w=wealth(p);
  if(best===null||(dir>0?w>best:w<best)){best=w;ids=[i];}else if(w===best)ids.push(i);});return pick(ids);}
function richestIdx(){return extremeIdx(1);}
function poorestIdx(){return extremeIdx(-1);}
function applyRes(p,k,a){p.port[k]=Math.max(0,p.port[k]+a);}
function applyEvent(card){
  S.eventCard={t:card.t,x:card.x,t0:card.t,x0:card.x,k:card.k,moves:{}};S.pendingChoice=null;let eff="";
  const before={};CKEYS.forEach(k=>before[k]=S.prices[k]);
  if(card.k==="one"){shiftPrice(card.c,card.a);eff=`${CMAP[card.c].n} ${card.a>0?"+":""}${card.a} fl`;}

  else if(card.k==="allV"){CKEYS.forEach(k=>shiftPrice(k,card.d*rng(card.lo,card.hi)));eff=`All commodities ${card.d>0?"rise":"fall"}, unevenly`;}
  else if(card.k==="resAll"){const k=card.g==="any"?pick(CKEYS):pick(GROUPS[card.g]);S.players.forEach(p=>applyRes(p,k,card.a));
    eff=`Every merchant ${card.a>0?"gains":"loses"} ${Math.abs(card.a)} ${CMAP[k].n}`;S.eventCard.res=k;}
  else if(card.k==="resRole"){const i=card.r==="rich"?richestIdx():poorestIdx();const k=card.g==="any"?pick(CKEYS):pick(GROUPS[card.g]);
    applyRes(S.players[i],k,card.a);eff=`${S.players[i].name} ${card.a>0?"gains":"loses"} ${Math.abs(card.a)} ${CMAP[k].n}`;S.eventCard.res=k;S.eventCard.who=i;}
  else if(card.k==="resGive"){const i=card.r==="rich"?richestIdx():poorestIdx();const k=pick(CKEYS);
    const units=Math.max(1,Math.round(card.val/S.prices[k]));
    S.pendingChoice={chooser:i,units,res:k,take:!!card.take,val:card.val};S.eventCard.res=k;S.eventCard.who=i;
    eff=card.take?`${S.players[i].name} seizes ${units} ${CMAP[k].n} (about ${card.val} fl) from a rival of their choice`
                 :`${S.players[i].name} ships ${units} ${CMAP[k].n} (about ${card.val} fl) to a rival of their choice`;}
  else if(card.k==="decree"){const i=card.r==="rich"?richestIdx():poorestIdx();
    S.pendingChoice={chooser:i,decree:true,dir:card.dir,amt:card.amt};S.eventCard.who=i;
    eff=`${S.players[i].name} ${card.dir>0?"drives a commodity of their choice up":"crashes a commodity of their choice"} by ${card.amt}`;}
  CKEYS.forEach(k=>{const d=S.prices[k]-before[k];if(d)S.eventCard.moves[k]=d;});

function resolveEventChoice(choice){const pc=S.pendingChoice;if(!pc)return false;
  if(pc.decree){if(!CMAP[choice])return false;const b=S.prices[choice];shiftPrice(choice,pc.dir*pc.amt);
    S.eventCard.moves[choice]=(S.eventCard.moves[choice]||0)+(S.prices[choice]-b);
    S.eventCard.resolved=`${S.players[pc.chooser].name} chose ${CMAP[choice].n}: ${b} → ${S.prices[choice]} fl`;S.pendingChoice=null;return true;}
  const target=S.players[choice],chooser=S.players[pc.chooser];if(!target||choice===pc.chooser)return false;
  const src=pc.take?target:chooser,dst=pc.take?chooser:target;const q=Math.min(pc.units,src.port[pc.res]||0);
  src.port[pc.res]-=q;dst.port[pc.res]+=q;
  S.eventCard.resolved=`${src.name} → ${dst.name}: ${q} ${CMAP[pc.res].n}`;S.pendingChoice=null;return true;
}

/* ---------------------------- GAME FLOW ---------------------------- */
/* Auto target: tuned by simulation so roughly half of games end on the target. */
function autoTarget(n){return ({2:475,3:525,4:575,5:625,6:700})[n]||525;}
function newGame(){
  S.prices={};S.trend={};S.history={};
  CKEYS.forEach(k=>{const p=rng(PMIN,8);S.prices[k]=p;S.trend[k]=pick(REGIMES);S.history[k]=[p];});
  S.players.forEach(p=>{p.fl=START_FL;p.port=Object.assign({},START_PORT);p.escrow=0;
    p.folded=false;p.allin=false;p.out=false;p.committed=0;p.acted=false;p.boast=null;p.boastStake=0;
    p.priv=[];p.powerUsed={};p.usedThisHand=false;p.traded=false;p.totalIn=0;p.preview=null;p.stats={won:0,boastsMade:0,boastsWon:0};});
  if(S.targetAuto)S.target=autoTarget(S.players.length);
  S.handNo=0;S.dealer=rng(0,Math.max(0,S.players.length-1));
  S.eventCard=null;S.pendingChoice=null;S._show=null;S._endReason=null;S._finalMove=null;S.phase="idle";shuffleEvents();

function startHand(){
  S.handNo++;

    p.boast=null;p.boastStake=0;p.escrow=0;if(!p.powerUsed)p.powerUsed={};p.usedThisHand=false;p.traded=false;
    p.totalIn=0;p.preview=null;p.priv=[rollDie(),rollDie()];});
  S.board=[rollDie(),rollDie(),rollDie(),rollDie(),rollDie()];S.reveal=0;
  S.pot=0;S.challenges={};S._injected=0;S._show=null;S.rollout=false;
  S.dealer=(S.dealer+1)%S.players.length;S.street=0;S.currentBet=0;S.turn=-1;S.phase="market";

function postAntes(){
  S.players.forEach(p=>{if(p.fl>=ANTE){p.fl-=ANTE;S.pot+=ANTE;p.totalIn+=ANTE;}else{p.out=true;p.folded=true;}});
  S.phase="betting";initBetting();
}
const community=()=>S.board.slice(0,S.reveal);
function activeIdx(){return S.players.map((p,i)=>(!p.folded&&!p.allin)?i:-1).filter(i=>i>=0);}
function liveIdx(){return S.players.map((p,i)=>!p.folded?i:-1).filter(i=>i>=0);}
function firstActive(after){const N=S.players.length;
  for(let s=1;s<=N;s++){const i=(after+s)%N;if(!S.players[i].folded&&!S.players[i].allin)return i;}return -1;}
const nextActor=firstActive;
function initBetting(){
  S.players.forEach(p=>{p.committed=0;p.acted=false;});
  S.currentBet=0;S.turn=firstActive(S.dealer);S.lastRaiser=S.turn;
  // a lone player who can still bet has nobody to bet against: nothing to decide this street
  if(activeIdx().length<=1||liveIdx().length<=1)activeIdx().forEach(i=>S.players[i].acted=true);
}
function streetDone(){
  if(liveIdx().length<=1)return true;
  const act=activeIdx();if(act.length===0)return true;
  return act.every(i=>S.players[i].acted&&S.players[i].committed===S.currentBet);
}
function canPledge(p,toCall){return holdingsValue(p)>0&&(p.fl===0||(toCall>0&&p.fl<toCall));}
function boastCap(p){return Math.max(1,Math.min(p.fl,Math.round(p.fl*BOAST_CAP)));}
function challengeTerms(b,c){ // what each side puts in escrow if c challenges b
  const tier=tierOf(b.boast);const full=Math.round(b.boastStake*tier.pay[0]/tier.pay[1]);
  const cRisk=Math.max(0,Math.min(full,c.fl));
  const bRisk=cRisk>=full?b.boastStake:Math.max(1,Math.min(b.boastStake,Math.round(cRisk*tier.pay[1]/tier.pay[0])));
  return {cRisk,bRisk,full};
}
function legal(){
  const p=S.players[S.turn];if(!p||p.folded||p.allin||S.phase!=="betting")return {};
  const toCall=Math.max(0,S.currentBet-p.committed),fl=p.fl;
  const lone=activeIdx().filter(i=>i!==S.turn).length===0;
  const boastTargets=liveIdx().filter(i=>{if(i===S.turn)return false;const b=S.players[i];if(!b.boast)return false;
    if((S.challenges[i]||[]).some(c=>c.c===S.turn))return false;if(b.fl<b.boastStake)return false;
    return challengeTerms(b,p).cRisk>=1;});
  return {toCall,fl,canCheck:toCall===0,canCall:toCall>0,callAmt:Math.min(toCall,fl),canFold:toCall>0,
    canRaise:fl>toCall&&!lone,minRaise:(S.currentBet>0?S.currentBet:0)+MINBET,maxRaise:p.committed+fl,
    canBoast:!p.boast&&S.street<3&&fl>=1,boastCap:boastCap(p),boastTargets,
    canAbility:!p.usedThisHand&&CKEYS.some(k=>abilityReady(p,k)),canPledge:canPledge(p,toCall)};
}
function apply(act){
  const p=S.players[S.turn];const L=legal();if(!p||L.fl===undefined)return "invalid";
  if(act.type==="boast"){const tier=tierOf(act.tier);const stake=Math.round(act.stake);
    if(!L.canBoast||!tier||!(stake>=1&&stake<=L.boastCap))return "invalid";
    p.boast=act.tier;p.boastStake=stake;return false;}
  if(act.type==="challenge"){const bi=act.target;if(!L.boastTargets.includes(bi))return "invalid";const b=S.players[bi];
    const t=challengeTerms(b,p);b.fl-=t.bRisk;b.escrow+=t.bRisk;p.fl-=t.cRisk;p.escrow+=t.cRisk;
    (S.challenges[bi]=S.challenges[bi]||[]).push({c:S.turn,bRisk:t.bRisk,cRisk:t.cRisk});
    if(b.fl===0&&!b.folded)b.allin=true;
    if(p.fl===0){p.allin=true;p.acted=true;return afterAction();}
    return false;}
  if(act.type==="fold"){p.folded=true;p.acted=true;}
  else if(act.type==="check"){if(!L.canCheck)return "invalid";p.acted=true;}
  else if(act.type==="call"){if(!L.canCall)return "invalid";const pay=L.callAmt;
    p.fl-=pay;S.pot+=pay;p.committed+=pay;p.totalIn+=pay;if(p.fl===0)p.allin=true;p.acted=true;}
  else if(act.type==="raise"){if(!L.canRaise)return "invalid";const target=Math.round(act.amount);
    const lo=Math.min(L.minRaise,L.maxRaise);if(!(target>=lo&&target<=L.maxRaise&&target>S.currentBet))return "invalid";
    const need=target-p.committed;p.fl-=need;S.pot+=need;p.committed=target;p.totalIn+=need;S.currentBet=target;
    if(p.fl===0)p.allin=true;

function afterAction(){
  if(liveIdx().length<=1)return endHandByFold();
  if(streetDone())return advanceStreet();
  const nx=nextActor(S.turn);if(nx<0)return advanceStreet();
  S.turn=nx;return false;
}
function advanceStreet(){
  if(S.street<3){S.reveal=[3,4,5][S.street];S.street++;initBetting();return "reveal";}
  return doShowdown();
}
/* ---------------------------- EVALUATION ---------------------------- */
function evalHand(dice){
  const cnt=new Array(9).fill(0);dice.forEach(d=>cnt[d]++);
  const FACES=[8,7,6,5,4,3,2,1];
  let straightTop=0;for(let top=5;top<=8;top++){let ok=true;for(let f=top-4;f<=top;f++)if(!cnt[f]){ok=false;break;}if(ok)straightTop=top;}
  const at=n=>FACES.filter(f=>cnt[f]>=n);
  const fives=at(5),quads=at(4),trips=at(3),pairs=at(2);
  const pool=dice.slice().sort((a,b)=>b-a);
  const kick=(excl,n)=>pool.filter(d=>!excl.includes(d)).slice(0,n);
  const fhPair=trips.length?FACES.filter(f=>f!==trips[0]&&cnt[f]>=2):[];
  let rank,score;
  if(fives.length){rank=RK.FIVE;score=[rank,fives[0]];}
  else if(quads.length){rank=RK.QUADS;score=[rank,quads[0],...kick([quads[0]],1)];}
  else if(straightTop){rank=RK.STRAIGHT;score=[rank,straightTop];}
  else if(trips.length&&fhPair.length){rank=RK.FULL;score=[rank,trips[0],fhPair[0]];}
  else if(trips.length){rank=RK.TRIPS;score=[rank,trips[0],...kick([trips[0]],2)];}
  else if(pairs.length>=2){rank=RK.TWO;score=[rank,pairs[0],pairs[1],...kick([pairs[0],pairs[1]],1)];}
  else if(pairs.length===1){rank=RK.PAIR;score=[rank,pairs[0],...kick([pairs[0]],3)];}
  else{rank=RK.HIGH;score=[rank,...pool.slice(0,5)];}
  const s=score;let best,detail;
  if(rank===RK.FIVE){best=[s[1],s[1],s[1],s[1],s[1]];detail=`five ${s[1]}s`;}
  else if(rank===RK.QUADS){best=[s[1],s[1],s[1],s[1]].concat(s[2]?[s[2]]:[]);detail=s[2]?`four ${s[1]}s, ${s[2]} kicker`:`four ${s[1]}s`;}
  else if(rank===RK.STRAIGHT){best=[s[1],s[1]-1,s[1]-2,s[1]-3,s[1]-4];detail=`${s[1]-4}–${s[1]} run`;}
  else if(rank===RK.FULL){best=[s[1],s[1],s[1],s[2],s[2]];detail=`${s[1]}s over ${s[2]}s`;}
  else if(rank===RK.TRIPS){best=[s[1],s[1],s[1]].concat(s.slice(2));detail=`three ${s[1]}s`;}
  else if(rank===RK.TWO){best=[s[1],s[1],s[2],s[2]].concat(s.slice(3));detail=`${s[1]}s & ${s[2]}s`+(s[3]?`, ${s[3]} kicker`:"");}
  else if(rank===RK.PAIR){best=[s[1],s[1]].concat(s.slice(2));detail=`pair of ${s[1]}s`;}
  else{best=s.slice(1,6);detail=`${s[1]} high`;}
  return {rank,name:RANK_NAMES[rank],score,best,detail};
}
function cmp(a,b){for(let i=0;i<Math.max(a.score.length,b.score.length);i++){const x=a.score[i]||0,y=b.score[i]||0;if(x!==y)return y-x;}return 0;}
function bestOf(p){return evalHand(p.priv.concat(S.board.slice(0,S.reveal)));}
function bestFull(p){return evalHand(p.priv.concat(S.board));}
function bestAmong(idxs){const ev=idxs.map(i=>({i,e:bestOf(S.players[i])}));ev.sort((a,b)=>cmp(a.e,b.e));
  return ev.filter(x=>cmp(x.e,ev[0].e)===0).map(x=>x.i);}
/* ---------------------------- POTS ---------------------------- */
function buildPots(){
  const contrib=S.players.map(p=>p.totalIn||0);
  const levels=[...new Set(contrib.filter(c=>c>0))].sort((a,b)=>a-b);
  const pots=[];let prev=0;
  for(const L of levels){let amount=0;const eligible=[];
    S.players.forEach((p,i)=>{if(contrib[i]>=L){amount+=(L-prev);if(!p.folded)eligible.push(i);}});
    if(pots.length&&pots[pots.length-1].eligible.join()===eligible.join())pots[pots.length-1].amount+=amount; // merge identical layers
    else pots.push({amount,eligible});prev=L;}
  return pots;
}
function settlePots(){
  const pots=buildPots();const results=[];
  pots.forEach(pot=>{const elig=pot.eligible.length?pot.eligible:liveIdx();
    const winners=bestAmong(elig);const share=Math.floor(pot.amount/winners.length);let rem=pot.amount-share*winners.length;
    // odd florins go to the tied winner(s) nearest the dealer's left
    const order=winners.slice().sort((a,b)=>((a-S.dealer-1+99*S.players.length)%S.players.length)-((b-S.dealer-1+99*S.players.length)%S.players.length));
    order.forEach(wi=>{S.players[wi].fl+=share+(rem>0?1:0);if(rem>0)rem--;});
    results.push({amount:pot.amount,winners});});
  S.pot=0;return results;
}
function settleBoasts(){
  const out=[];
  S.players.forEach((b,bi)=>{if(!b.boast)return;
    const ev=bestFull(b);const made=!b.folded&&ev.rank>=b.boast;const chals=S.challenges[bi]||[];let net=0;
    chals.forEach(ch=>{const c=S.players[ch.c];const pot=ch.bRisk+ch.cRisk;b.escrow-=ch.bRisk;c.escrow-=ch.cRisk;
      if(made){b.fl+=pot;net+=ch.cRisk;}else{c.fl+=pot;net-=ch.bRisk;}});
    if(b.stats){b.stats.boastsMade++;if(made&&chals.length)b.stats.boastsWon++;}
    out.push({bi,tier:b.boast,made,folded:b.folded,chals:chals.map(x=>({c:x.c,bRisk:x.bRisk,cRisk:x.cRisk})),net,ev});});

}
function endHandByFold(){
  const w=liveIdx()[0];const amt=S.pot;S.players[w].fl+=S.pot;S.pot=0;
  const anyBoast=S.players.some(p=>p.boast);if(anyBoast)S.rollout=true; // remaining dice are rolled out to settle boasts
  const boasts=settleBoasts();if(S.players[w].stats)S.players[w].stats.won++;
  S._show={winners:[w],byFold:true,pots:[{amount:amt,winners:[w]}],boasts};S.phase="result";return "result";
}
function doShowdown(){
  const potResults=settlePots();const boasts=settleBoasts();
  const winners=[...new Set(potResults.flatMap(r=>r.winners))];
  winners.forEach(i=>{if(S.players[i].stats)S.players[i].stats.won++;});
  S._show={winners,byFold:false,pots:potResults,boasts};S.phase="result";return "result";
}
function transfer(from,to,value){const v=Math.min(value,from.fl);from.fl-=v;to.fl+=v;return v;}
function doPledge(p,sel){let value=0;CKEYS.forEach(k=>{const q=Math.floor(sel[k]||0);if(q>0&&p.port[k]>=q){p.port[k]-=q;value+=q*S.prices[k];}});
  const gain=Math.round(value*PLEDGE_RATE);p.fl+=gain;S._injected+=gain;return gain;}
/* ---------------------------- TRADE ---------------------------- */
/* One trade per market phase. mode "order" = any mix of buys and sells, executed together:
   sale proceeds can fund purchases; selling 2+ kinds costs the sell fee (10% if you start with 0 florins);
   buying is free; you can't buy and sell the same commodity in one order. */
function tradeQuote(p,t){
  if(t.mode==="order"){const buy=t.buy||{},sell=t.sell||{};let sales=0,buys=0,kinds=0,any=false,ok=true;
    CKEYS.forEach(k=>{const b=Math.floor(buy[k]||0),s=Math.floor(sell[k]||0);if(b<0||s<0||(b>0&&s>0))ok=false;
      if(s>0){any=true;kinds++;sales+=s*S.prices[k];if(s>(p.port[k]||0))ok=false;}if(b>0){any=true;buys+=b*S.prices[k];}});
    Object.keys(buy).concat(Object.keys(sell)).forEach(k=>{if(!CMAP[k])ok=false;});
    const rate=kinds>=2?(p.fl===0?BROKE_FEE:SELL_FEE):0;const fee=Math.round(sales*rate);const net=sales-fee-buys;
    return {sales,buys,gross:sales,fee,rate,net,kinds,ok:ok&&any&&p.fl+net>=0};}
  if(t.mode==="buy"){const q=Math.floor(t.q||0),pr=S.prices[t.k];return {gross:q*pr,fee:0,net:q*pr,ok:q>=1&&p.fl>=q*pr,kinds:1};}
  const sel=t.mode==="sell"?{[t.k]:t.q}:(t.sel||{});
  let gross=0,kinds=0,ok=true;CKEYS.forEach(k=>{const q=Math.floor(sel[k]||0);if(q>0){kinds++;gross+=q*S.prices[k];if(q>p.port[k])ok=false;}});
  const rate=kinds>=2?(p.fl===0?BROKE_FEE:SELL_FEE):0;const fee=Math.round(gross*rate);
  return {gross,fee,rate,net:gross-fee,ok:ok&&kinds>0,kinds};
}
function doTrade(p,t){
  if(p.traded||S.phase!=="market")return {ok:false,why:"One trade per market phase."};
  const q=tradeQuote(p,t);if(!q.ok)return {ok:false,why:"That trade is not possible."};
  if(t.mode==="order"){CKEYS.forEach(k=>{const s=Math.floor((t.sell||{})[k]||0),b=Math.floor((t.buy||{})[k]||0);p.port[k]+=b-s;});p.fl+=q.net;}
  else if(t.mode==="buy"){p.fl-=q.gross;p.port[t.k]+=Math.floor(t.q);}
  else{const sel=t.mode==="sell"?{[t.k]:t.q}:t.sel;CKEYS.forEach(k=>{const n=Math.floor(sel[k]||0);if(n>0)p.port[k]-=n;});p.fl+=q.net;}
  p.traded=true;return Object.assign({ok:true},q);
}
/* ---------------------------- POWERS ---------------------------- */
function abilityReady(p,key){
  const c=CMAP[key];if(!c||p.folded||p.usedThisHand)return false;if(p.powerUsed&&p.powerUsed[key])return false;if((p.port[key]||0)<c.cost)return false;
  if(S.phase!=="betting")return false;
  if(key==="wheat"||key==="wood")return S.reveal>0;
  if(key==="silver")return S.reveal<5;
  if(key==="gold")return p.priv.length<3;
  return true;
}
function doAbility(p,key,params){
  params=params||{};if(!abilityReady(p,key))return false;
  const pubIdx=params.idx|0,privIdx=params.idx|0;
  if((key==="wheat"||key==="wood")&&!(pubIdx>=0&&pubIdx<S.reveal))return false;
  if((key==="brick"||key==="ore")&&!(privIdx>=0&&privIdx<p.priv.length))return false;
  if(key==="wood"&&clampDie(S.board[pubIdx]+(params.sign>0?1:-1))===S.board[pubIdx])return false;
  if(key==="ore"&&clampDie(p.priv[privIdx]+(params.sign>0?1:-1))===p.priv[privIdx])return false;
  p.port[key]-=CMAP[key].cost;
  if(key==="wheat")S.board[pubIdx]=rollDie();
  else if(key==="wood")S.board[pubIdx]=clampDie(S.board[pubIdx]+(params.sign>0?1:-1));
  else if(key==="brick")p.priv[privIdx]=rollDie();
  else if(key==="ore")p.priv[privIdx]=clampDie(p.priv[privIdx]+(params.sign>0?1:-1));
  else if(key==="gold")p.priv.push(rollDie());
  else if(key==="silver")p.preview={idx:S.reveal,v:S.board[S.reveal]};
  if(!p.powerUsed)p.powerUsed={};p.powerUsed[key]=true;p.usedThisHand=true;return true;
}
function allinPending(){return S.players.map((p,i)=>(p.allin&&!p.folded&&!p.usedThisHand&&CKEYS.some(k=>abilityReady(p,k)))?i:-1).filter(i=>i>=0);}
/* ---------------------------- END ---------------------------- */
function gameOverReason(){if(Math.max(...S.players.map(wealth))>=S.target)return "target";if(S.handNo>=S.totalHands)return "cap";return null;}
function applyFinalReprice(){const before={};CKEYS.forEach(k=>before[k]=S.prices[k]);evolveMarket();
  S._finalMove={};CKEYS.forEach(k=>S._finalMove[k]=S.prices[k]-before[k]);}
function ranking(){return S.players.map((p,i)=>({p,i,v:wealth(p)})).sort((a,b)=>b.v-a.v||b.p.fl-a.p.fl);}
/* Gentle trading hints for the market prompt. Suggestions, never instructions. */
function tradeHints(p){const out=[];const lastHand=S.handNo>=S.totalHands;const hv=holdingsValue(p);
  const moves=CKEYS.map(k=>{const h=S.history[k]||[];return {k,p:S.prices[k],d:h.length>1?h[h.length-1]-h[h.length-2]:0,d2:h.length>2?h[h.length-2]-h[h.length-3]:0};});
  const held=moves.filter(m=>p.port[m.k]>0);const cheap=moves.slice().sort((a,b)=>a.p-b.p)[0];const rich=held.slice().sort((a,b)=>b.p-a.p)[0];
  if(p.fl<ANTE)out.push(hv>0?`You can't cover the ${ANTE} fl ante right now. Selling something would get you dealt in this hand.`:`You can't cover the ${ANTE} fl ante this hand.`);
  else if(p.fl<ANTE*4&&hv>0)out.push(`Your purse is thin (${p.fl} fl). A small sale would give you room to call bets and boasts.`);
  if(lastHand)out.push(`This is the last hand. Everything you hold is valued at the closing price after one more market move, while florins stay exactly as they are.`);
  if(rich&&rich.p>=12&&out.length<2)out.push(`${CMAP[rich.k].n} is near the top of its range at ${rich.p} fl. Some merchants would take the gain; others ride it.`);
  const riser=moves.filter(m=>m.d>0&&m.d2>0).sort((a,b)=>b.d-a.d)[0];
  if(riser&&out.length<2)out.push(`${CMAP[riser.k].n} has climbed two hands running. Momentum can continue, or it can turn.`);
  if(p.fl>=ANTE*16&&cheap&&cheap.p<=8&&out.length<2)out.push(`You have florins to spare. ${CMAP[cheap.k].n} is trading low at ${cheap.p} fl, if you think it has room to recover.`);
  const need=COMM.filter(c=>!(p.powerUsed&&p.powerUsed[c.k])&&(p.port[c.k]||0)<c.cost);
  if(need.length&&out.length<2){const c=need[0];out.push(`You hold ${p.port[c.k]} ${c.n.toLowerCase()}, short of the ${c.cost} needed for ${c.ab}.`);}
  if(!out.length)out.push(`Prices moved since the last hand. The ticker shows where each good has been heading.`);
  return out.slice(0,2);}
/* ===================== END ENGINE ===================== */

/* ======================================================================
   MULTIPLAYER CORE (DOM-free). The host phone holds the real game state;
   every phone, the host's included, renders a redacted VIEW of it.
   ====================================================================== */
const ROOM_ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ";
function newRoomCode(){let s="";for(let i=0;i<4;i++)s+=ROOM_ALPHA[Math.floor(Math.random()*ROOM_ALPHA.length)];return s;}
function randToken(){let s="";for(let i=0;i<16;i++)s+="abcdefghijklmnopqrstuvwxyz0123456789"[Math.floor(Math.random()*36)];return s;}

/* host-side bookkeeping that never leaves the host */
const HOST={tokens:[],passed:{},seq:0,dmTimes:{}};

/* Build what one seat is allowed to see. */
function makeView(real,seat){
  const v=JSON.parse(JSON.stringify(real));delete v.ui;delete v.eventOrder;delete v.eventPos;delete v.trend;
  const showdown=v.phase==="result"&&v._show&&!v._show.byFold&&!v._show.nobody;
  const board=real.board||[];
  const seeAll=showdown?5:(v.phase==="result"&&v.rollout?5:v.reveal);
  v.board=board.map((d,j)=>j<seeAll?d:0);
  v.players.forEach((p,i)=>{
    if(i===seat)return;
    const reveal=(showdown&&!p.folded)||v.phase==="over";
    if(!reveal)p.priv=(p.priv||[]).map(()=>0);
    p.preview=null;
  });
  v.dms=(real.dms||[]).filter(m=>m.f===seat||m.to===seat).slice(-150); // private messages: only your own conversations
  v.mySeat=seat;v.mp=true;return v;
}
function mpLog(text,seat,type){S.lastAct={seq:++HOST.seq,seat,type:type||"info",text,pot:S.pot};}

/* Lobby */
function hostInitLobby(hostName,pi,hi){S.players=[{name:hostName||"Host",pi:pi||0,hi:hi||0}];S.phase="lobby";S.conn=[true];S.ready=[false];S.dms=[];S.dmSeq=0;
  HOST.tokens=[randToken()];HOST.passed={};HOST.seq=0;S.lastAct=null;return HOST.tokens[0];}
function hostJoin(msg){ // returns {seat,token} or {err}
  const t=msg.token&&HOST.tokens.indexOf(msg.token);
  if(t!=null&&t>=0){S.conn[t]=true;if(S.phase==="lobby"&&msg.name)S.players[t].name=cleanName(msg.name,t);return {seat:t,token:msg.token,rejoin:true};}
  if(S.phase!=="lobby")return {err:"This game has already started. Ask the host to start a new table."};
  if(S.players.length>=6)return {err:"The table is full (6 merchants)."};
  const seat=S.players.length;const token=randToken();HOST.tokens.push(token);
  S.players.push({name:cleanName(msg.name,seat),pi:(msg.pi|0)%6,hi:(msg.hi|0)%4});S.conn[seat]=true;S.ready[seat]=false;
  mpLog(`${S.players[seat].name} joined the table`,seat,"join");return {seat,token};
}
function cleanName(n,seat){n=String(n||"").replace(/[\u0000-\u001f]/g,"").trim().slice(0,14);return n||`Merchant ${seat+1}`;}
function hostStart(){if(S.phase!=="lobby"||S.players.length<2)return false;
  S.players.forEach((p,i)=>{p.name=cleanName(p.name,i);});newGame();S.ready=S.players.map(()=>false);startHand();mpLog("The table opens",0,"start");return true;}

/* Phase transitions the host drives */
function connectedSeats(){return S.players.map((_,i)=>i).filter(i=>S.conn[i]);}
function allReady(){return connectedSeats().every(i=>S.ready[i]);}
function hostDeal(){if(S.phase!=="market"||S.pendingChoice)return false;
  S.players.forEach(p=>{p.flAtDeal=p.fl;p.pledged=0;});postAntes();S.ready=S.players.map(()=>false);
  const live=liveIdx();
  if(live.length===0){S._show={winners:[],byFold:true,pots:[],boasts:[],nobody:true};S.phase="result";}
  else if(live.length===1)endHandByFold();
  mpLog(`Hand ${S.handNo} is dealt`,0,"deal");hostFlow();return true;}
function hostNext(){if(S.phase!=="result")return false;S.ready=S.players.map(()=>false);
  const why=gameOverReason();
  if(why){S._endReason=why;if(why==="cap")applyFinalReprice();else S._finalMove=null;S.phase="over";mpLog("The table closes",0,"over");return true;}
  startHand();mpLog(`Hand ${S.handNo}: the market opens`,0,"market");return true;}
/* After any betting change: run the board out while nobody can act, pausing for
   all-in merchants who still have a power to use on this street. */
function hostFlow(){
  for(let g=0;g<12;g++){
    if(S.phase!=="betting"){S.window=null;return;}
    if(!streetDone()){S.window=null;return;}
    const key=S.handNo+":"+S.street;const passed=HOST.passed[key]||[];
    const pend=allinPending().filter(i=>S.conn[i]&&!passed.includes(i));
    if(pend.length){S.window={key,pend};return;}
    S.window=null;const r=advanceStreet();
    if(r==="reveal")mpLog(["","Three community dice hit the table","The fourth die is thrown","The final die is thrown"][S.street],-1,"reveal");
  }
}
/* One action from one seat. Returns {ok} or {err}. */
function hostHandle(seat,a){
  if(!a||typeof a!=="object")return {err:"Bad action"};
  const p=S.players[seat];if(!p)return {err:"Unknown seat"};
  const nm=p.name;const t=a.type;
  if(t==="dm")return hostDM(seat,a);
  if(t==="skin"){if(seat!==0)return {err:"Only the host can change the theme"};if(S.phase!=="lobby")return {err:"The theme is set before the table opens"};if(!["medieval","scifi"].includes(a.skin))return {err:"Unknown theme"};S.skin=a.skin;return {ok:true,quiet:true};}
  if(t==="profile"){if(S.phase!=="lobby")return {err:"Game already started"};p.name=cleanName(a.name,seat);p.pi=(a.pi|0)%6;p.hi=(a.hi|0)%4;return {ok:true,quiet:true};}
  if(t==="settings"){if(seat!==0||S.phase!=="lobby")return {err:"Only the host can change settings"};
    if(typeof a.targetAuto==="boolean")S.targetAuto=a.targetAuto;if(a.target)S.target=Math.max(300,Math.min(5000,a.target|0));
    if(a.totalHands)S.totalHands=Math.max(3,Math.min(40,a.totalHands|0));if(S.targetAuto)S.target=autoTarget(S.players.length);return {ok:true,quiet:true};}
  if(t==="rematch"){if(seat!==0)return {err:"Only the host can do that"};return hostRematch()?{ok:true}:{err:"The game isn't over"};}
  if(t==="start"){if(seat!==0)return {err:"Only the host can start"};return hostStart()?{ok:true}:{err:"Need at least 2 merchants"};}
  if(t==="ready"){if(S.phase!=="market"&&S.phase!=="result")return {err:"Nothing to be ready for"};S.ready[seat]=!S.ready[seat];
    if(allReady()){if(S.phase==="market"&&!S.pendingChoice)hostDeal();else if(S.phase==="result")hostNext();}return {ok:true,quiet:true};}
  if(t==="force"){if(seat!==0)return {err:"Only the host can do that"};
    if(S.phase==="market"&&!S.pendingChoice)return hostDeal()?{ok:true}:{err:"Cannot deal yet"};
    if(S.phase==="result")return hostNext()?{ok:true}:{err:"Cannot continue"};
    if(S.phase==="market"&&S.pendingChoice){const pc=S.pendingChoice;if(S.conn[pc.chooser])return {err:"Waiting on a connected merchant"};
      const opts=pc.decree?CKEYS:S.players.map((_,i)=>i).filter(i=>i!==pc.chooser);resolveEventChoice(pick(opts));mpLog(`The host decided for ${S.players[pc.chooser].name}`,0);return {ok:true};}
    if(S.phase==="betting"){
      if(S.window){const w=S.window;(HOST.passed[w.key]=HOST.passed[w.key]||[]).push(...w.pend);hostFlow();return {ok:true};}
      const who=S.turn;if(who<0||S.conn[who])return {err:"That merchant is connected"};const L=legal();
      apply(L.canCheck?{type:"check"}:{type:"fold"});mpLog(`${S.players[who].name} is away: auto-${L.canCheck?"check":"fold"}`,who);hostFlow();return {ok:true};}
    return {err:"Nothing to force"};}
  if(t==="choose"){const pc=S.pendingChoice;if(S.phase!=="market"||!pc||pc.chooser!==seat)return {err:"Not your choice to make"};
    if(!resolveEventChoice(pc.decree?a.v:(a.v|0)))return {err:"Invalid choice"};mpLog(`${nm} made their choice`,seat);return {ok:true};}
  if(t==="trade"){if(S.phase!=="market")return {err:"The market is closed"};const r=doTrade(p,a.t||{});if(!r.ok)return {err:r.why};
    mpLog(`${nm} traded`,seat,"trade");return {ok:true};}
  if(S.phase!=="betting")return {err:"No hand in progress"};
  if(t==="power"){const mine=S.turn===seat||(p.allin&&!p.folded);if(!mine)return {err:"Wait for your turn to use a power"};
    if(!doAbility(p,a.k,{idx:a.idx|0,sign:a.sign}))return {err:"That power can't be used now"};
    const c=CMAP[a.k];const pub=c.scope==="public"||c.scope==="publicSign";
    mpLog(pub?`${nm} used ${c.ab} on community die ${(a.idx|0)+1}`:`${nm} used ${c.ab}`,seat,"power");hostFlow();return {ok:true};}
  if(t==="pass"){if(!S.window||!S.window.pend.includes(seat))return {err:"Nothing to pass"};(HOST.passed[S.window.key]=HOST.passed[S.window.key]||[]).push(seat);hostFlow();return {ok:true,quiet:true};}
  if(t==="pledge"){if(S.turn!==seat)return {err:"Not your turn"};const L=legal();if(!L.canPledge)return {err:"You can't pledge right now"};
    const g=doPledge(p,a.sel||{});if(!g)return {err:"Pick goods to pledge"};p.pledged=(p.pledged||0)+g;mpLog(`${nm} pledged goods for ${g} fl`,seat,"pledge");return {ok:true};}
  if(["check","call","raise","fold","boast","challenge"].includes(t)){
    if(S.turn!==seat)return {err:"Not your turn"};const before=S.pot;const L=legal();
    const act={type:t};if(t==="raise")act.amount=a.amount|0;if(t==="boast"){act.tier=a.tier|0;act.stake=a.stake|0;}if(t==="challenge")act.target=a.target|0;
    const hadBet=S.currentBet>0;if(apply(act)==="invalid")return {err:"That move isn't allowed"};
    const put=S.pot-before;
    const text=t==="check"?`${nm} checks`:t==="fold"?`${nm} folds`:t==="call"?(L.callAmt<L.toCall?`${nm} is all-in for ${put}`:`${nm} calls ${put}`)
      :t==="raise"?`${nm} ${hadBet?"raises to":"bets"} ${act.amount}`
      :t==="boast"?`${nm} boasts ${tierOf(act.tier).n} or better (${act.stake} fl)`:`${nm} challenges ${S.players[act.target].name}'s boast`;
    mpLog(text,seat,t);hostFlow();return {ok:true};}
  return {err:"Unknown action"};
}
function hostRematch(){if(S.phase!=="over")return false;S.players=S.players.map(p=>({name:p.name,pi:p.pi,hi:p.hi}));S.phase="lobby";
  S.ready=S.players.map(()=>false);S._show=null;S.window=null;S.pendingChoice=null;S.eventCard=null;S.handNo=0;mpLog("Back to the lobby",0);return true;}
/* Private one-to-one messages, relayed by the host. */
const DM_MAX=300;
function hostDM(seat,a){const to=a.to|0;if(!S.players[to]||to===seat||typeof a.to!=="number")return {err:"Pick someone to message"};
  const text=String(a.text==null?"":a.text).replace(/[\u0000-\u0008\u000b-\u001f\u007f]/g,"").trim().slice(0,DM_MAX);if(!text)return {err:"Type a message first"};
  const now=Date.now();const times=(HOST.dmTimes[seat]=(HOST.dmTimes[seat]||[]).filter(x=>now-x<5000));if(times.length>=8)return {err:"Slow down a little"};times.push(now);
  S.dms=S.dms||[];S.dmSeq=(S.dmSeq||0)+1;S.dms.push({id:S.dmSeq,f:seat,to,x:text,t:now});if(S.dms.length>500)S.dms.splice(0,S.dms.length-500);
  return {ok:true,quiet:true,dm:true};}

  function loop(){cx.clearRect(0,0,w,h);if(!reduce&&parts.filter(p=>p.kind==="e").length<34&&Math.random()<.25)parts.push(ember());
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;if(p.kind==="c"){p.vy+=.18;p.rot+=p.vr;}

/* Patch the DOM in place (morphdom) instead of replacing it, so taps don't replay entrance animations or flash. */
function patchDOM(el,html){html=skinText(html);if(typeof morphdom==="undefined"){el.innerHTML=html;return;}
  const tmp=el.cloneNode(false);tmp.innerHTML=html;
  morphdom(el,tmp,{childrenOnly:true,onBeforeElUpdated:(from,to)=>{if(from.isEqualNode(to))return false;
    if(from===document.activeElement&&from.tagName==="INPUT"&&from.type!=="range"&&from.type!=="checkbox"){to.value=from.value;}return true;}});}

  patchDOM($("view"),`<div id="scr-${U.screen}" class="scr">${f()}</div>`);$("view").dataset.screen=U.screen;if(typeof renderNet==="function")renderNet();
  renderSheet();if(typeof renderChat==="function")renderChat();
  if(U.rollPending){requestAnimationFrame(rollFx);U.rollPending=false;}
  if(U.fly){const fly=U.fly;U.fly=null;requestAnimationFrame(()=>flyCoin(fly.from));}
  save();
}

      <span class="soft it">${pc.take?"A rival with less gives up what they have.":`You hold ${ch.port[pc.res]}.`}</span></p>
     <div class="choice">${S.players.map((p,i)=>i===pc.chooser?"":`<button data-act="choose" data-arg="${i}"><span>${esc(p.name)}</span><span class="s">${p.port[pc.res]} ${cn} · worth ${fl(wealth(p))}</span></button>`).join("")}</div>`;}
  return `<div class="ecard"><div class="face">
    <div class="kind">${glyphSVG(ec.k)}<div><div class="eyebrow" style="color:var(--wax)">${SKIN_ID==="scifi"?"Transmission":"Event"} · hand ${S.handNo}</div><div class="t">${esc(ec.t)}</div></div></div>

    ${choice}</div></div>`;}
function tickerHTML(withPowers){return `<div class="ticker">${COMM.map(c=>{const h=S.history[c.k]||[];const cur=S.prices[c.k];const prev=h.length>1?h[h.length-2]:cur;const d=cur-prev;
  return `<div class="tk"><div class="hd">${icon(c.k)}${c.n}</div>
